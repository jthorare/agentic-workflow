schema_version: '1.1'
name: verify-desktop-forced
tags:
- tier-c
- behaviour
execution:
  max_turns: 30
  timeout_seconds: 480
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Agent
  - TodoWrite
  - AskUserQuestion
  - Bash
  - Write
context:
  scaffold_script: fixture.sh
# Canned world: a budget-planner repo with a desktop evidence config and a two-screen manifest (fixture.sh), the stub
# `ui-evidence` (repo evals/stubs/bin, run from <stage>/stubs/bin; answers in evals/stubs/ui-evidence.json, scenario "desktop-mismatch").
# Planted failure: `desktop-run` exits 2; screen "settings" differs by 6.8% (limit 2%) because the footer action bar
# with Save and Cancel is missing in the app frame; "home" passes at 0.4%. A good run maps the diff to the settings
# screen, runs desktop-run once, writes a FAIL pack that names the settings screen and the missing footer, edits
# nothing in the repo, and does not send the user to ship.
