schema_version: '1.1'
name: meta-forced
execution:
  max_turns: 30
  timeout_seconds: 400
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - TodoWrite
  - AskUserQuestion
  disallowed_tools:
  - SendMessage
  - ListAgents
  - Monitor
  - Agent
context:
  scaffold_script: fixture.sh
# stubs on PATH (repo evals/stubs/bin, staged to <stage>/stubs/bin for the run): aw-meta
# This box runs the live team on its sockets: no cross-session send, no agent listing, no background watcher.
# Needs the stubs first on PATH (repo evals/stubs/bin/aw-meta, run from <stage>/stubs/bin, answers in evals/stubs/aw-meta.json).
