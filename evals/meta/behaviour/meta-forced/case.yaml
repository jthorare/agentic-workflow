schema_version: "1.1"
name: meta-forced
context:
  scaffold_script: fixture.sh
env:
  AW_RESULT: "1"
# This box runs the live team on its sockets: no cross-session send, no agent listing, no background watcher.
disallowed_tools: [SendMessage, ListAgents, Monitor, Agent]
# Needs evals/stubs/bin first on PATH (evals/stubs/bin/aw-meta, answers in evals/stubs/aw-meta.json).
stubs: [aw-meta]
