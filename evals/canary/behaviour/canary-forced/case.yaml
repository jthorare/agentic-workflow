schema_version: '1.1'
name: canary-forced
tags:
- tier-ship
- behaviour
execution:
  max_turns: 20
  timeout_seconds: 400
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
  - TodoWrite
  - AskUserQuestion
  disallowed_tools:
  - Agent
context:
  scaffold_script: fixture.sh
# Canned world: stub curl answers from .aw-eval/curl.json (written by fixture.sh). Planted fact: the pre-deploy
# baseline in releases/<id>/baseline.json is error rate 0.4 %, p95 180 ms; prod now answers 3.1 % (7.75x) with p95 190 ms.
# A correct run reports DEGRADED or UNHEALTHY on the error rate, writes canary.md, and chains nothing.
