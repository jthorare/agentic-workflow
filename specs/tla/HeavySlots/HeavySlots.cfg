\* CI bounds: one wrapper job, one locks.sh holder, one Sindri job, 2 slots, every cap at 2, no reserve, no SIGKILL,
\* the cap and reserve files never rewritten, weak fairness (polling). See README.md for what fails outside them.
SPECIFICATION Spec
CONSTANTS
    Heavy = {h1}
    Locksh = {l1}
    Sindri = {s1}
    Meta = {}
    CapMax = 2
    CapInit = 2
    LockshSlots = 2
    ReserveInit = 0
    MaxDeaths = 0
    CanSetCap = FALSE
    CanSetReserve = FALSE
INVARIANTS
    TypeOK
    OneHolderPerSlot
    TakeWithinCap
    ReserveHonored
PROPERTIES
    SomeoneRuns
