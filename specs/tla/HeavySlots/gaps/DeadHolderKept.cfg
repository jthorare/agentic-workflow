\* Expected VIOLATION OrphanReclaimed: a SIGKILL that leaves a folder only some takers reclaim.
\* A locks.sh holder dies (record "pid": the wrapper reads only "owner"), or any holder dies between mkdir and its write
\* (an empty folder: nobody reclaims it, bar Sindri after 6 h, not modelled). The folder stays, held by no one.
SPECIFICATION SpecSF
CONSTANTS
    Heavy = {h1}
    Locksh = {l1}
    Sindri = {}
    Meta = {}
    CapMax = 1
    CapInit = 1
    LockshSlots = 1
    ReserveInit = 0
    MaxDeaths = 1
    CanSetCap = FALSE
    CanSetReserve = FALSE
PROPERTIES
    OrphanReclaimed
