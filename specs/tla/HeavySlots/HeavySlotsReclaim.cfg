\* CI bounds: reclaim without the wrapper. Two locks.sh holders and one Sindri job on 1 slot, 1 SIGKILL anywhere.
\* Their rename-aside reclaim never lets two hold one slot. Safety only: a SIGKILL between mkdir and the record write
\* leaves an empty folder nobody reclaims (README.md).
SPECIFICATION Spec
CONSTANTS
    Heavy = {}
    Locksh = {l1, l2}
    Sindri = {s1}
    Meta = {}
    CapMax = 1
    CapInit = 1
    LockshSlots = 1
    ReserveInit = 0
    MaxDeaths = 1
    CanSetCap = FALSE
    CanSetReserve = FALSE
INVARIANTS
    TypeOK
    OneHolderPerSlot
