\* A lone lane job (not AW_HEAVY_PRIORITY=meta) against heavy-meta-reserve equal to the slot count, held there. Before
\* #2060 every reader clamped the reserve to the slot count, so the job never found a slot it may take (NoStarvation
\* failed, even under strong fairness). Now the reserve is at most the slot count minus one, so it gets the slot. One job
\* only: two jobs on one slot starve each other by polling alone (gaps/PollStarvation.cfg, #2064).
SPECIFICATION SpecSF
CONSTANTS
    Heavy = {h1}
    Locksh = {}
    Sindri = {}
    Meta = {}
    CapMax = 1
    CapInit = 1
    LockshSlots = 1
    ReserveInit = 1
    MaxDeaths = 0
    CanSetCap = FALSE
    CanSetReserve = FALSE
PROPERTIES
    NoStarvation
