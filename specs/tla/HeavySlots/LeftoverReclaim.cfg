\* CI bounds (#2065): one wrapper job, one locks.sh holder and one Sindri job on 1 slot, 2 SIGKILLs, so a holder and then
\* its reclaimer can both die mid-step. A record left moved aside by a dead reclaimer is always removed again.
SPECIFICATION Spec
CONSTANTS
    Heavy = {h1}
    Locksh = {l1}
    Sindri = {s1}
    Meta = {}
    CapMax = 1
    CapInit = 1
    LockshSlots = 1
    ReserveInit = 0
    MaxDeaths = 2
    CanSetCap = FALSE
    CanSetReserve = FALSE
INVARIANTS
    TypeOK
    OneHolderPerSlot
PROPERTIES
    LeftoverCleared
