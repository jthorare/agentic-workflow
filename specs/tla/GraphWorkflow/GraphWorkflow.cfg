\* CI bounds: 4 triggers, 3 on w1 (queue, trigger 2 re-delivers trigger 1) and 1 on w2 (one-per-workflow). See README.md.
SPECIFICATION Spec
CONSTANTS
    NTrig = 4
    NW1 = 3
    Redeliver = TRUE
    ModeW1 = "queue"
    ModeW2 = "one"
    StartAtomic = TRUE
    InsertChecksId = TRUE
    DrainOldest = TRUE
    LaunchFailDrains = TRUE
    TestTrig = 3
    TestCounts = FALSE
    TestFenced = TRUE
INVARIANTS
    TypeOK
    NoDuplicateRunIds
    AtMostOneInFlight
    QueuedStartFIFO
    TestRunWritesNothing
    LiveNeverWaitsOnTest
PROPERTIES
    QueuedLeavesQueued
