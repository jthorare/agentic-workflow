\* CI bounds: 5 events, pages of 2, event 3 can't fold until a fixed build runs, 2 crashes, 2 rebuild requests.
\* Passes never throw here (CanThrow = FALSE): see README.md for the gaps a throwing pass and a crash open.
SPECIFICATION Spec
CONSTANTS
    MaxEvents = 5
    PageSize = 2
    Poison = {3}
    MaxCrashes = 2
    MaxRebuilds = 2
    CanThrow = FALSE
INVARIANTS
    TypeOK
    ExactlyOnceInOrder
    CursorWithinLedger
    NoPoisonFolded
PROPERTIES
    AllEventsLand
    HealthyMeansProgress
