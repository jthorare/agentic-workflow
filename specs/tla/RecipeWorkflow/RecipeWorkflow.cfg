\* CI bounds: one recipe (produce, checks, review, done), loop cap 2, 1 rewind, 1 takeover, retries 0..2. See README.md.
SPECIFICATION Spec
CONSTANTS
    Cap = 2
    MaxRewinds = 1
    MaxTakeovers = 1
    GapLoopOffByOne = FALSE
    GapGateFallsThrough = FALSE
INVARIANTS
    TypeOK
    LoopCapHolds
    GateRefusalNeverFallsThrough
    NoParkWithoutReason
    EndedHasNoSuspension
PROPERTIES
    EndedIsFinal
    NoStaleTimer
    UnmatchedFailureRetriesThenParks
    UnmatchedCompletedNeverMoves
    EventuallySettles
