# The slop list: words that sound smart but point at nothing (config/voice/reply.md, first lines).
extends: existence
message: "'%s' is filler that points at nothing. Say the concrete thing: the file, the number, what it does."
level: error
ignorecase: true
tokens:
  - "delv(?:e|es|ed|ing)"
  - "tapestry"
  - "seamless(?:ly)?"
  - "robust(?:ly|ness)?"
  - "holistic(?:ally)?"
  - "synerg(?:y|ies|istic)"
  - "paradigms?"
  - "game[- ]changer"
  - "cutting[- ]edge"
  - "state[- ]of[- ]the[- ]art"
  - "best[- ]in[- ]class"
  - "world[- ]class"
  - "next[- ]level"
  - "ever[- ]evolving"
  - "supercharg(?:e|es|ed|ing)"
  - "empower(?:s|ed|ing)?"
  - "elevat(?:e|es|ed|ing) (?:your|the) (?:experience|game|workflow)"
  - "unlock(?:s|ed|ing)? (?:the|your|new|its) (?:full )?(?:potential|power|value)"
  - "streamlin(?:e|es|ed|ing)"
  - "embark(?:s|ed|ing)?"
  - "pivotal"
  - "crucial(?:ly)?"
  - "it'?s worth noting(?: that)?"
  - "it is worth noting(?: that)?"
  - "it'?s important to note(?: that)?"
  - "it is important to note(?: that)?"
  - "needless to say"
  - "at the end of the day"
  - "in today'?s"
  - "in the realm of"
  - "a testament to"
  - "plays? a (?:key|vital|crucial|critical) role"
  - "deep[- ]dive"
  - "dive into"
  - "rest assured"
