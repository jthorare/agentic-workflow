schema: 1
id: workflow.dev-child-summary
version: 2
description: "A child that exports a file and checks it, and hands the file back to its parent when it resolves (decision-tree recipes, DT-C)."
displayName: "Export a file and check it"
inputs:
  - { key: fact:request, label: "Request", type: text, kind: text }
outputs:
  - { key: fact:output, label: "Exported file", type: file, from: export }
initial: export
states:
  export: { kind: active, step: step.produce, loop: rounds, timeout: { after: 4h, then: park },
            next: "Export the file for {item} (round {loop.rounds}/{loop.rounds.cap}), then complete this Step." }
  check:  { kind: active, step: step.checks, timeout: { after: 30m, then: retry },
            next: "Run the deterministic checks on the exported file." }
  done:    { kind: terminal, outcome: resolved }
  dropped: { kind: terminal, outcome: unresolved }
transitions:
  - { from: export, to: check,   on: step.completed, when: { outcome: done }, produces: [fact:output] }
  - { from: check,  to: done,    on: step.completed, when: { outcome: passed } }
  - { from: check,  to: export,  on: step.completed, when: { all: [{ outcome: failed }, { loop: rounds, below: cap }] }, produces: [fact:findings] }
  - { from: check,  to: dropped, on: step.completed, when: { outcome: failed } }
  - { from: export, to: dropped, on: command.skip }
loops: { rounds: { cap: 4 } }
evals: [evals/workflow.dev-child-summary/happy.jsonl]
