schema: 1
id: workflow.dev-agent-picks
version: 1
description: "One Step an agent session runs and reports with a typed payload, so a bad report can be refused: the run the Model picks table's states are seeded on (issue #1452; scripts/sindri-ui-fixture.sh model-picks)."
displayName: "Run an agent step whose pick is shown"
inputs:
  - { key: fact:item, label: "Item", type: item, kind: item }
  - { key: fact:issue, label: "Issue", type: text, kind: text, generate: "dev-agent-picks {start:date} {start:time}" }
outputs:
  - { key: fact:resolution, label: "Resolution", type: payload, from: write }
initial: write
states:
  write:
    kind: active
    step: step.report.write
    budget: { tokens: 1000000 }
    timeout: { after: 2d, then: park }
    next: "Write up the resolution for {item}."
  done: { kind: terminal, outcome: resolved }
transitions:
  - { from: write, to: done, on: step.completed, when: { outcome: done }, produces: [fact:resolution] }
evals: [evals/workflow.dev-agent-picks/happy.jsonl]
