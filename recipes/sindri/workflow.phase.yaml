schema: 1
id: workflow.phase
version: 3
description: "The per-phase child of the line: build, prove, review and ship one phase as one PR, then babysit it (docs sync inside) to the owner's ready-to-merge stop and the merge."
displayName: "Build, prove and ship one phase"
urgency: work
inputs:
  - { key: fact:phasePacket, label: "Phase packet (frozen)", type: packet, kind: packet }
  - { key: fact:lineContext, label: "Line context",          type: payload, kind: payload }
outputs:
  - { key: fact:pr,        label: "Pull request", type: link,   from: ship }
  - { key: fact:handoff,   label: "PR hand-off",  type: packet, from: ship }
  - { key: fact:proofPack, label: "Proof pack",   type: packet, from: prove }
  - { key: fact:mergedSha, label: "Merged sha",   type: text,   from: babysit }
initial: seed
states:
  seed:    { kind: active, step: step.phase.seed, timeout: { after: 1h, then: park },
             next: "Check {item}'s phase packet and dependencies, and prepare its worktree." }
  build:   { displayName: "Build", why: "Writes failing tests first, then the code inside the allowed files.", kind: wait, loop: stage, timeout: { after: 3d, then: park },
             waitFor: { child: { recipe: workflow.build, onParked: propagate,
                                 inputs: { "fact:phasePacket": { fact: fact:phasePacket }, "fact:workspace": { fact: fact:workspace },
                                           "fact:buildNotes": { fact: fact:buildNotes }, "fact:lineContext": { fact: fact:lineContext } } } },
             next: "Waiting for {child}: {item}'s builder (pass {loop.stage}/{loop.stage.cap})." }
  prove:   { displayName: "Prove it works", why: "Shows it works in the running app, not only in tests.", kind: wait, timeout: { after: 3d, then: park },
             waitFor: { child: { recipe: workflow.prove, onParked: propagate,
                                 inputs: { "fact:phasePacket": { fact: fact:phasePacket }, "fact:built": { fact: fact:built },
                                           "fact:workspace": { fact: fact:workspace }, "fact:redTests": { fact: fact:redTests } } } },
             next: "Waiting for {child}: proving {item} on its head." }
  review:  { displayName: "Code review", why: "Reviewers check the code, and fixes repeat until no blocking issues remain.", kind: wait, timeout: { after: 3d, then: park },
             waitFor: { child: { recipe: workflow.review-loop, onParked: propagate,
                                 inputs: { "fact:change": { fact: fact:change }, "fact:phasePacket": { fact: fact:phasePacket }, "fact:lensRounds": [] } } },
             next: "Waiting for {child}: {item}'s review to zero blocking and issue findings." }
  drift:   { kind: active, step: step.phase.drift, loop: reprove, timeout: { after: 1h, then: park },
             next: "Check that {item}'s review left the proven head unchanged." }
  ship:    { displayName: "Open the pull request", why: "Checks that the proof and review are for the exact commit being shipped, then opens the pull request.", kind: wait, timeout: { after: 1d, then: park },
             waitFor: { child: { recipe: workflow.ship, onParked: propagate,
                                 inputs: { "fact:phasePacket": { fact: fact:phasePacket }, "fact:proofPack": { fact: fact:proofPack },
                                           "fact:review": { fact: fact:review }, "fact:workspace": { fact: fact:workspace },
                                           "fact:lineContext": { fact: fact:lineContext } } } },
             next: "Waiting for {child}: {item}'s GREEN gate and its PR." }
  babysit: { displayName: "Watch the pull request", why: "Waits for the checks to go green and the docs to sync before you merge.", kind: wait, timeout: { after: 30d, then: escalate },
             waitFor: { child: { recipe: workflow.pr-babysitter, onParked: propagate,
                                 inputs: { "fact:pr": { fact: fact:pr }, "fact:handoff": { fact: fact:handoff },
                                           "fact:phasePacket": { fact: fact:phasePacket }, "fact:lineContext": { fact: fact:lineContext },
                                           "fact:workspace": { fact: fact:workspace } } } },
             next: "Waiting for {child}: docs sync and green CI on {item}'s PR, then your ready-to-merge stop." }
  owner:   { kind: active, step: step.phase.decide, timeout: { after: 7d, then: park },
             next: "{item}'s phase needs you: run `sindri workflow status {instance}` for why, then rebuild with notes or stop." }
  merged:  { displayName: "Merged", kind: terminal, outcome: resolved }
  dropped: { displayName: "Dropped", kind: terminal, outcome: unresolved }
transitions:
  - { from: seed, to: build, on: step.completed, when: { outcome: seeded },
      produces: [fact:buildNotes, fact:workspace, fact:built, fact:change, fact:redTests] }
  - { from: build, to: prove,   on: wait.satisfied, when: { outcome: resolved },
      produces: [fact:built, fact:change, fact:redTests, { fact: fact:phasePacket, from: fact:activePacket }] }
  - { label: "build got stuck: you decide", from: build, to: owner,   on: wait.satisfied, when: { outcome: unresolved } }
  - { from: build, to: dropped, on: wait.satisfied, when: { outcome: cancelled } }
  - { from: prove, to: review,  on: wait.satisfied, when: { outcome: resolved },   produces: [fact:proofPack] }
  - { label: "proof failed: back to build", from: prove, to: build,   on: wait.satisfied, when: { outcome: unresolved }, produces: [{ fact: fact:buildNotes, from: fact:findings }] }
  - { from: prove, to: dropped, on: wait.satisfied, when: { outcome: cancelled } }
  - { from: review, to: drift,   on: wait.satisfied, when: { outcome: resolved },   produces: [fact:review] }
  - { label: "review found wrong behavior: back to build", from: review, to: build,   on: wait.satisfied, when: { outcome: failed },     produces: [{ fact: fact:buildNotes, from: fact:review }] }
  - { from: review, to: owner,   on: wait.satisfied, when: { outcome: unresolved } }
  - { from: review, to: dropped, on: wait.satisfied, when: { outcome: cancelled } }
  - { from: drift, to: ship,  on: step.completed, when: { outcome: same } }
  - { label: "code changed after proof: prove again", from: drift, to: prove, on: step.completed, when: { outcome: moved }, produces: [fact:built, fact:change] }
  - { from: ship, to: babysit, on: wait.satisfied, when: { outcome: resolved }, produces: [fact:pr, fact:handoff] }   # line report effect: restore with LN-WF1 when effect.line.report has a runtime
  - { label: "final checks failed: back to build", from: ship, to: build,   on: wait.satisfied, when: { outcome: unresolved }, produces: [{ fact: fact:buildNotes, from: fact:returnNotes }] }
  - { from: ship, to: owner,   on: wait.satisfied, when: { outcome: failed } }
  - { from: ship, to: dropped, on: wait.satisfied, when: { outcome: cancelled } }
  - { from: babysit, to: merged,  on: wait.satisfied, when: { outcome: resolved }, produces: [fact:mergedSha] }   # line report effect: restore with LN-WF1 when effect.line.report has a runtime
  - { label: "needs rework: back to build", from: babysit, to: build,   on: wait.satisfied, when: { outcome: failed },   produces: [{ fact: fact:buildNotes, from: fact:reworkNotes }] }
  - { from: babysit, to: owner,   on: wait.satisfied, when: { outcome: unresolved } }
  - { from: babysit, to: dropped, on: wait.satisfied, when: { outcome: cancelled } }
  - { label: "rebuild with your notes", from: owner, to: build,   on: step.completed, when: { outcome: rebuild }, produces: [fact:buildNotes] }
  - { label: "you stopped it: tell the line it failed", from: owner, to: dropped, on: step.completed, when: { outcome: stop },
      effects: [{ use: effect.line.report, with: { status: failed, line: { fact: fact:lineContext } } }] }   # LN-WF1: the line shows the phase failed and stops its dependents (or retries)
loops: { stage: { cap: 3 }, reprove: { cap: 3 } }
evals:
  - evals/workflow.phase/happy.jsonl
  - evals/workflow.phase/drift-moved.jsonl
  - evals/workflow.phase/prove-fails-then-passes.jsonl
  - evals/workflow.phase/rework-at-stop-3.jsonl
  - evals/workflow.phase/stage-cap.jsonl
  - evals/workflow.phase/notes-from-review.jsonl
  - evals/workflow.phase/notes-from-ship.jsonl
  - evals/workflow.phase/packet-in-force.jsonl
  - evals/workflow.phase/owner-rebuild.jsonl
  - evals/workflow.phase/owner-stop.jsonl
  - evals/workflow.phase/cancelled.jsonl
  - evals/workflow.phase/babysit-stuck.jsonl
  - evals/workflow.phase/child-parks.jsonl
  - evals/workflow.phase/reprove-cap.jsonl
  - evals/workflow.phase/ship-fails.jsonl
  - evals/workflow.phase/review-unresolved.jsonl
  - evals/workflow.phase/babysit-cancelled.jsonl
  - evals/workflow.phase/prove-cancelled.jsonl
  - evals/workflow.phase/review-cancelled.jsonl
  - evals/workflow.phase/ship-cancelled.jsonl
