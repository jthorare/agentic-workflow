schema: 1
id: workflow.verify
version: 3
description: "Block recipe: the verify journey with its lenses and evidence pack, then the design check when screen baselines match. Always runs."
displayName: "Check the change in the running app"
inputs:
  - { key: fact:phasePacket, label: "Phase packet", type: packet, kind: packet }
  - { key: fact:workspace, label: "Workspace", type: text, kind: text }
outputs:
  - { key: fact:evidencePack, label: "Evidence pack", type: evidence, from: journey }
initial: journey
states:
  journey: { kind: active, step: step.verify.journey, timeout: { after: 4h, then: park },
             next: "Run the verify journey for {item} through its lenses and record the evidence pack. End your report with `artifacts`: the paths, relative to the workspace, of every file you saved as proof (screenshots, logs, notes); name no hash." }
  design:  { kind: active, step: step.verify.design, timeout: { after: 2h, then: park },
             next: "Compare the screens of {item} with their baselines, or skip when none match." }
  passed:  { kind: terminal, outcome: resolved }
  failed:  { kind: terminal, outcome: unresolved }
transitions:
  - { from: journey, to: design, on: step.completed, when: { outcome: pass }, produces: [fact:evidencePack] }
  - { from: journey, to: failed, on: step.completed, when: { outcome: fail }, produces: [fact:evidencePack] }
  - { from: design,  to: passed, on: step.completed, when: { outcome: pass }, produces: [fact:designCheck] }
  - { from: design,  to: passed, on: step.completed, when: { outcome: skipped } }
  - { from: design,  to: failed, on: step.completed, when: { outcome: fail }, produces: [fact:designCheck] }
evals: [evals/workflow.verify/happy.jsonl, evals/workflow.verify/journey-fail.jsonl, evals/workflow.verify/design-skipped.jsonl, evals/workflow.verify/design-fail.jsonl]
