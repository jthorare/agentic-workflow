schema: 1
id: workflow.build
version: 4
description: "Block recipe: one TDD builder for one phase in its own worktree: a failing test per acceptance item, then code in atomic commits inside the phase's allowed files."
displayName: "Build one phase, tests first"
inputs:
  - { key: fact:phasePacket, label: "Phase packet (frozen)", type: packet, kind: packet }
  - { key: fact:workspace,   label: "Phase worktree", type: text, kind: text }
  - { key: fact:buildNotes,  label: "Notes from a later station", type: payload, kind: payload }
  - { key: fact:lineContext, label: "Line context (base, stack parent, run area)", type: payload, kind: payload }
outputs:
  - { key: fact:built,        label: "Built head",  type: payload, from: checks }
  - { key: fact:change,       label: "Change under review", type: payload, from: checks }
  - { key: fact:redTests,     label: "Red tests",   type: payload, from: red }
  - { key: fact:activePacket, label: "Phase packet in force", type: packet, from: amend }
initial: prepare
states:
  prepare:    { kind: active, step: step.build.prepare, timeout: { after: 1h, then: park },
                next: "Check {item}'s phase worktree is clean at its recorded head." }
  slot:       { kind: wait, waitFor: { resource: heavy }, timeout: { after: 1d, then: park },
                next: "Waiting for a heavy-job slot for {item}'s builder." }
  red:        { displayName: "Write failing tests", why: "Writes one failing test for each point of done, committed before any code.", kind: active, step: step.build.red, loop: tests, budget: { tokens: 300k }, timeout: { after: 3h, then: park },
                next: "Write a failing test for each of {item}'s acceptance items (try {loop.tests}/{loop.tests.cap})." }
  red-check:  { kind: active, step: step.build.red-check, timeout: { after: 3h, then: park },
                next: "Run {item}'s red tests on the red commit: each must fail." }
  green:      { displayName: "Write the code", why: "Implements the change in small commits inside the allowed files.", kind: active, step: step.build.green, loop: revisions, budget: { tokens: 600k }, timeout: { after: 6h, then: park },
                next: "Implement {item} in atomic commits inside its allowed files (round {loop.revisions}/{loop.revisions.cap})." }
  checks:     { kind: active, step: step.build.checks, timeout: { after: 3h, then: park },
                next: "Run {item}'s scope gate, build rules and the repo's commands." }
  scope-desk: { displayName: "Allow a file outside the plan?", why: "A change outside the plan needs your OK.", kind: active, step: step.build.scope-desk, timeout: { after: 2d, then: park },
                next: "{item}'s builder needs a file outside its allowed files: allow it with a reason, have it reverted, or stop." }
  amend:      { kind: active, step: step.build.amend, loop: grants, timeout: { after: 1h, then: park },
                next: "Write {item}'s scope grant as a new, owner-frozen child of its phase packet." }
  built:      { displayName: "Built", kind: terminal, outcome: resolved }
  stopped:    { displayName: "Stopped", kind: terminal, outcome: unresolved }
transitions:
  - { from: prepare, to: slot, on: step.completed, when: { outcome: ready },
      produces: [fact:activePacket, fact:redTests, fact:built, fact:change, fact:findings, fact:answers] }
  - { from: slot, to: red, on: wait.satisfied }
  - { from: red,       to: red-check, on: step.completed, when: { outcome: written }, produces: [fact:redTests] }
  - { from: red-check, to: green,     on: step.completed, when: { outcome: red } }
  - { label: "a test passed too early: write it again", from: red-check, to: red,       on: step.completed, when: { outcome: vacuous }, produces: [fact:findings] }
  - { from: green, to: checks,     on: step.completed, when: { outcome: built },   produces: [fact:built] }
  - { from: green, to: scope-desk, on: step.completed, when: { outcome: blocked }, produces: [fact:findings] }
  - { from: checks, to: built,      on: step.completed, when: { outcome: pass },       produces: [fact:built, fact:change] }
  - { label: "checks failed: fix the code", from: checks, to: green,      on: step.completed, when: { outcome: failed },     produces: [fact:findings] }
  - { label: "file outside the plan: you decide", from: checks, to: scope-desk, on: step.completed, when: { outcome: outOfScope }, produces: [fact:findings] }
  - { label: "you allowed it", from: scope-desk, to: amend,   on: step.completed, when: { outcome: allow },  produces: [fact:answers] }
  - { label: "you said to revert it", from: scope-desk, to: green,   on: step.completed, when: { outcome: revert }, produces: [fact:answers] }
  - { from: scope-desk, to: stopped, on: step.completed, when: { outcome: stop } }
  - { from: amend, to: checks, on: step.completed, when: { outcome: amended }, produces: [fact:activePacket] }
loops: { tests: { cap: 3 }, revisions: { cap: 4 }, grants: { cap: 3 } }
budget: { tokens: 1200k }
evals:
  - evals/workflow.build/blocked-stop.jsonl
  - evals/workflow.build/happy.jsonl
  - evals/workflow.build/out-of-scope-allow.jsonl
  - evals/workflow.build/prepare-park.jsonl
  - evals/workflow.build/slot-desk-cycle.jsonl
  - evals/workflow.build/slot-timeout.jsonl
  - evals/workflow.build/revisions-cap.jsonl
  - evals/workflow.build/scope-revert.jsonl
  - evals/workflow.build/vacuous-red.jsonl
