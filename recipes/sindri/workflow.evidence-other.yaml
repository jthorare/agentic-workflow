schema: 1
id: workflow.evidence-other
version: 3
description: "Block recipe: the evidence a person used when no evidence block fitted, and why."
displayName: "Record proof a person gathered by hand"
inputs:
  - { key: fact:phasePacket, label: "Phase packet", type: packet, kind: packet }
  - { key: fact:built, label: "Built change", type: link, kind: link }
outputs:
  - { key: fact:evidenceSummary, label: "Evidence summary", type: evidence, from: record }
  - { key: fact:evidenceReason, label: "Why no block fitted", type: text, from: record }
initial: record
states:
  record:    { kind: active, step: step.evidence.desk, timeout: { after: 14d, then: park },
               next: "Record the evidence you used for {item} and why no listed evidence fitted, or say none was found." }
  recorded:  { kind: terminal, outcome: resolved }
  none-found: { kind: terminal, outcome: unresolved }
transitions:
  - { from: record, to: recorded,   on: step.completed, when: { outcome: recorded },  produces: [fact:evidenceSummary, fact:evidenceReason] }
  - { from: record, to: none-found, on: step.completed, when: { outcome: noneFound }, produces: [fact:evidenceSummary, fact:evidenceReason] }
evals: [evals/workflow.evidence-other/none-found.jsonl, evals/workflow.evidence-other/happy.jsonl]
