schema: 1
id: workflow.hand-test
version: 3
description: "Block recipe: use the change by hand in the running app; record what was done, expected and seen."
displayName: "Try the change by hand in the running app"
inputs:
  - { key: fact:phasePacket, label: "Phase packet", type: packet, kind: packet }
  - { key: fact:workspace, label: "Workspace", type: text, kind: text }
outputs:
  - { key: fact:manualTest, label: "Manual test", type: text, from: handtest }
initial: handtest
states:
  handtest: { kind: active, step: step.handtest.run, timeout: { after: 4h, then: park },
              next: "Use the change for {item} by hand in the running app; record what you did, expected and saw. End your report with `artifacts`: the paths, relative to the workspace, of every file you saved as proof (screenshots, logs, notes); name no hash." }
  works:    { kind: terminal, outcome: resolved }
  broken:   { kind: terminal, outcome: unresolved }
transitions:
  - { from: handtest, to: works,  on: step.completed, when: { outcome: works },  produces: [fact:manualTest] }
  - { from: handtest, to: broken, on: step.completed, when: { outcome: broken }, produces: [fact:manualTest] }
evals: [evals/workflow.hand-test/happy.jsonl, evals/workflow.hand-test/broken.jsonl]
