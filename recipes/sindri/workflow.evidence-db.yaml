schema: 1
id: workflow.evidence-db
version: 4
description: "Block recipe: A persisted-state run: plan, then a read-only run."
displayName: "Prove what is stored in the database"
inputs:
  - { key: fact:phasePacket, label: "Phase packet", type: packet, kind: packet }
  - { key: fact:built, label: "Built change", type: link, kind: link }
outputs:
  - { key: fact:evidenceSummary, label: "Evidence summary", type: evidence, from: run }
initial: plan
states:
  plan:   { kind: active, step: step.evidence.db-plan, timeout: { after: 4h, then: park },
            next: "Plan the database evidence for {item} from the phase packet and the built change." }
  run:    { kind: active, step: step.evidence.db-run, timeout: { after: 4h, then: park },
            next: "Run the planned database evidence for {item} and record the summary. End your report with `artifacts`: the paths, relative to the workspace, of every file you saved as proof (screenshots, logs, notes); name no hash." }
  passed: { kind: terminal, outcome: resolved }
  skipped: { kind: terminal, outcome: resolved }
  failed: { kind: terminal, outcome: unresolved }
transitions:
  - { from: plan, to: run,    on: step.completed, when: { outcome: planned },  produces: [fact:evidencePlan] }
  - { from: plan, to: skipped, on: step.completed, when: { outcome: noTarget }, produces: [fact:evidenceSummary] }
  - { from: run,  to: passed, on: step.completed, when: { outcome: passed }, produces: [fact:evidenceSummary] }
  - { from: run,  to: failed, on: step.completed, when: { outcome: failed }, produces: [fact:evidenceSummary] }
evals: [evals/workflow.evidence-db/happy.jsonl, evals/workflow.evidence-db/failed.jsonl, evals/workflow.evidence-db/no-target.jsonl]
