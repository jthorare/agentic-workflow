schema: 1
id: workflow.implement
version: 4
description: "Block recipe: build the change test first, looping on the deterministic checks."
displayName: "Build a change, tests first"
inputs:
  - { key: fact:issue, label: "Issue", type: text, kind: text }
  - { key: fact:rootCause, label: "Root cause", type: text, kind: text }
outputs:
  - { key: fact:output, label: "Diff", type: text, from: produce }
initial: produce
states:
  produce: { kind: active, step: step.produce, loop: revisions, timeout: { after: 1d, then: park },
             budget: { tokens: 5M }, next: "Build the change for {item} test first (round {loop.revisions}/{loop.revisions.cap}): write the failing test, then the fix." }
  checks:  { kind: active, step: step.checks, timeout: { after: 30m, then: retry },
             next: "Run the deterministic checks on the change for {item}." }
  built:   { kind: terminal, outcome: resolved }
  stuck:   { kind: terminal, outcome: unresolved }
transitions:
  - { from: produce, to: checks, on: step.completed, when: { outcome: done }, produces: [fact:output] }
  - { from: checks,  to: built,  on: step.completed, when: { outcome: passed } }
  - { from: checks,  to: produce, on: step.completed, when: { all: [ { outcome: failed }, { loop: revisions, below: cap } ] }, produces: [fact:findings] }
  - { from: checks,  to: stuck,   on: step.completed, when: { all: [ { outcome: failed }, { not: { loop: revisions, below: cap } } ] }, produces: [fact:findings] }
loops: { revisions: { cap: 5 } }
evals:
  - evals/workflow.implement/happy.jsonl
  - evals/workflow.implement/rounds.jsonl
  - evals/workflow.implement/checks-retry.jsonl
  - evals/workflow.implement/produce-park.jsonl
