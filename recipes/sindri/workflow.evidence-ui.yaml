schema: 1
id: workflow.evidence-ui
version: 4
description: "Block recipe: A ui-evidence run: plan, run, lint and critique; one repair when a selector is broken."
displayName: "Prove the screens work in a browser"
inputs:
  - { key: fact:phasePacket, label: "Phase packet", type: packet, kind: packet }
  - { key: fact:built, label: "Built change", type: link, kind: link }
outputs:
  - { key: fact:evidenceSummary, label: "Evidence summary", type: evidence, from: run }
initial: plan
states:
  plan:   { kind: active, step: step.evidence.ui-plan, timeout: { after: 4h, then: park },
            next: "Plan the UI evidence for {item} from the phase packet and the built change." }
  run:    { kind: active, step: step.evidence.ui-run, loop: repairs, timeout: { after: 4h, then: park },
            next: "Run the planned UI evidence for {item} and record the summary. End your report with `artifacts`: the paths, relative to the workspace, of every file you saved as proof (screenshots, logs, notes); name no hash." }
  passed: { kind: terminal, outcome: resolved }
  skipped: { kind: terminal, outcome: resolved }
  failed: { kind: terminal, outcome: unresolved }
transitions:
  - { from: plan, to: run,    on: step.completed, when: { outcome: planned },  produces: [fact:evidencePlan] }
  - { from: plan, to: skipped, on: step.completed, when: { outcome: noTarget }, produces: [fact:evidenceSummary] }
  - { from: run,  to: passed, on: step.completed, when: { outcome: passed },  produces: [fact:evidenceSummary] }
  - { from: run,  to: failed, on: step.completed, when: { outcome: failed },  produces: [fact:evidenceSummary] }
  - { from: run,  to: run,    on: step.completed, when: { all: [ { outcome: broken }, { loop: repairs, below: cap } ] }, produces: [fact:evidenceSummary] }
  - { from: run,  to: failed, on: step.completed, when: { all: [ { outcome: broken }, { not: { loop: repairs, below: cap } } ] }, produces: [fact:evidenceSummary] }
loops: { repairs: { cap: 2 } }
evals:
  - evals/workflow.evidence-ui/happy.jsonl
  - evals/workflow.evidence-ui/failed.jsonl
  - evals/workflow.evidence-ui/broken-twice.jsonl
  - evals/workflow.evidence-ui/repaired.jsonl
  - evals/workflow.evidence-ui/no-target.jsonl
