schema: 1
id: workflow.evidence-all
version: 3
description: "Block recipe: run the UI, API and database evidence in sequence, then combine the three summaries."
displayName: "Run the proof this phase needs"
inputs:
  - { key: fact:phasePacket, label: "Phase packet", type: packet, kind: packet }
  - { key: fact:built, label: "Built change", type: link, kind: link }
outputs:
  - { key: fact:evidenceSummary, label: "Evidence summary", type: evidence, from: combine }
initial: ui
states:
  ui:
    kind: wait
    waitFor:
      child:
        recipe: workflow.evidence-ui
        inputs: { "fact:phasePacket": { fact: fact:phasePacket }, "fact:built": { fact: fact:built } }
        onParked: propagate
    timeout: { after: 14d, then: park }
    next: "Waiting for the UI evidence for {item}: run `sindri workflow status {instance}`."
  api:
    kind: wait
    waitFor:
      child:
        recipe: workflow.evidence-api
        inputs: { "fact:phasePacket": { fact: fact:phasePacket }, "fact:built": { fact: fact:built } }
        onParked: propagate
    timeout: { after: 14d, then: park }
    next: "Waiting for the API evidence for {item}: run `sindri workflow status {instance}`."
  db:
    kind: wait
    waitFor:
      child:
        recipe: workflow.evidence-db
        inputs: { "fact:phasePacket": { fact: fact:phasePacket }, "fact:built": { fact: fact:built } }
        onParked: propagate
    timeout: { after: 14d, then: park }
    next: "Waiting for the database evidence for {item}: run `sindri workflow status {instance}`."
  combine: { kind: active, step: step.evidence.combine, timeout: { after: 1d, then: park },
             next: "Combine the UI, API and database evidence summaries for {item}." }
  done:    { kind: terminal, outcome: resolved }
  failed:  { kind: terminal, outcome: unresolved }
  dropped: { kind: terminal, outcome: unresolved }
transitions:
  - { from: ui,  to: api,     on: wait.satisfied, when: { outcome: resolved },   produces: [{ fact: fact:evidenceUi, from: fact:evidenceSummary }] }
  - { from: ui,  to: failed,  on: wait.satisfied, when: { outcome: unresolved } }
  - { from: ui,  to: dropped, on: wait.satisfied, when: { outcome: cancelled } }
  - { from: api, to: db,      on: wait.satisfied, when: { outcome: resolved },   produces: [{ fact: fact:evidenceApi, from: fact:evidenceSummary }] }
  - { from: api, to: failed,  on: wait.satisfied, when: { outcome: unresolved } }
  - { from: api, to: dropped, on: wait.satisfied, when: { outcome: cancelled } }
  - { from: db,  to: combine, on: wait.satisfied, when: { outcome: resolved },   produces: [{ fact: fact:evidenceDb, from: fact:evidenceSummary }] }
  - { from: db,  to: failed,  on: wait.satisfied, when: { outcome: unresolved } }
  - { from: db,  to: dropped, on: wait.satisfied, when: { outcome: cancelled } }
  - { from: combine, to: done, on: step.completed, when: { outcome: done }, produces: [fact:evidenceSummary] }
evals:
  - evals/workflow.evidence-all/happy.jsonl
  - evals/workflow.evidence-all/api-fails.jsonl
  - evals/workflow.evidence-all/cancelled.jsonl
  - evals/workflow.evidence-all/ui-fails.jsonl
  - evals/workflow.evidence-all/db-fails.jsonl
