schema: 1
id: workflow.reproduce
version: 3
description: "Block recipe: route a bug to a UI check or a test check, then reproduce it with a check that fails for the reported reason."
displayName: "Reproduce a bug with a failing check"
inputs:
  - { key: fact:issue, label: "Issue", type: text, kind: text }
  - { key: fact:rootCause, label: "Root cause", type: text, kind: text }
outputs:
  - { key: fact:check, label: "Check", type: payload, from: ui-check }
  - { key: fact:baseline, label: "Baseline", type: payload, from: ui-check }
initial: route-check
states:
  route-check:
    kind: active
    step:
      use: step.judge.choose
      with:
        prompt: "Which kind of check reproduces this bug?"
        facts: [fact:issue, fact:rootCause]
        choices:
          - "uiCheck: the bug is what a user sees or does in a web app, so a browser check reproduces it"
          - "testCheck: the bug is in logic or a contract a test can call directly, with no browser"
    timeout: { after: 14d, then: park }
    next: "Pick the kind of check for {item}: run `sindri workflow status {instance}` for the choices."
  route-check-desk:
    kind: active
    step: { use: step.desk.choose, with: { from: route-check } }
    timeout: { after: 14d, then: park }
    next: "Pick the kind of check that reproduces {item}. Each choice shows the model's lean, if it had one."
  ui-check:   { kind: active, step: step.reproduce.ui-check, timeout: { after: 1d, then: park },
                next: "Write a browser check for {item} that fails on the base for the reported reason, and freeze it." }
  test-check: { kind: active, step: step.reproduce.test-check, timeout: { after: 1d, then: park },
                next: "Write a test for {item} that fails on the base for the reported reason, and freeze it." }
  reproduced:     { kind: terminal, outcome: resolved }
  not-reproduced: { kind: terminal, outcome: unresolved }
transitions:
  - { from: [route-check, route-check-desk], to: ui-check,   on: step.completed, when: { outcome: uiCheck },   produces: [fact:decision] }
  - { from: route-check, to: test-check, on: step.completed, when: { any: [ { outcome: testCheck }, { outcome: uncertain } ] }, produces: [fact:decision] }
  - { from: route-check-desk, to: test-check, on: step.completed, when: { outcome: testCheck }, produces: [fact:decision] }
  - { from: route-check, to: route-check-desk, on: step.failed }
  - { from: [ui-check, test-check], to: reproduced,     on: step.completed, when: { outcome: reproduced },    produces: [fact:check, fact:baseline] }
  - { from: [ui-check, test-check], to: not-reproduced, on: step.completed, when: { outcome: notReproduced }, produces: [fact:findings] }
evals:
  - evals/workflow.reproduce/happy.jsonl
  - evals/workflow.reproduce/test.jsonl
  - evals/workflow.reproduce/uncertain.jsonl
  - evals/workflow.reproduce/failed.jsonl
  - evals/workflow.reproduce/not-reproduced.jsonl
