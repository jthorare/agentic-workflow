schema: 1
id: workflow.investigate
version: 2
description: "Block recipe: find the root cause of a reported bug, with a confirmed hypothesis; at most 2 rounds."
displayName: "Find why a bug happens"
inputs:
  - { key: fact:issue, label: "Issue", type: text, kind: text }
  - { key: fact:expected, label: "Expected", type: text, kind: text }
  - { key: fact:actual, label: "Actual", type: text, kind: text }
outputs:
  - { key: fact:rootCause, label: "Root cause", type: text, from: investigate }
initial: investigate
states:
  investigate: { kind: active, step: step.rootcause.investigate, loop: rounds, timeout: { after: 4h, then: park },
                 next: "Investigate the root cause for {item} (round {loop.rounds}/{loop.rounds.cap})." }
  diagnosed:   { kind: terminal, outcome: resolved }
  unfixed:     { kind: terminal, outcome: unresolved }
transitions:
  - { from: investigate, to: diagnosed,   on: step.completed, when: { outcome: diagnosed }, produces: [fact:rootCause] }
  - { from: investigate, to: investigate, on: step.completed, when: { all: [ { outcome: unfixed }, { loop: rounds, below: cap } ] }, produces: [fact:findings] }
  - { from: investigate, to: unfixed,     on: step.completed, when: { all: [ { outcome: unfixed }, { not: { loop: rounds, below: cap } } ] }, produces: [fact:findings] }
loops: { rounds: { cap: 4 } }
evals: [evals/workflow.investigate/happy.jsonl, evals/workflow.investigate/unfixed-cap.jsonl]
