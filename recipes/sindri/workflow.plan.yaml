schema: 1
id: workflow.plan
version: 8
description: "Station 3 of the line: the phase graph for a candidate design, its executability review and hidden scenarios, then the owner's after-design stop, which freezes the design, the plan and every phase packet together."
displayName: "Plan the build in phases"
why: "Breaks the approved design into phases small enough to build and prove one at a time, then waits for your approval."
urgency: work
inputs:
  - { key: fact:scopePacket,  label: "Scope packet (frozen)",     type: packet, kind: packet }
  - { key: fact:designPacket, label: "Design packet (candidate)", type: packet, kind: packet }
outputs:
  - { key: fact:planPacket,     label: "Plan graph",       type: packet,  from: freeze }
  - { key: fact:phasePackets,   label: "Phase packets",    type: payload, from: freeze }
  - { key: fact:designRevision, label: "Design revision",  type: payload, from: settle }
initial: intake
states:
  intake:      { kind: active, step: step.plan.intake, timeout: { after: 1d, then: park },
                 next: "Load {item}'s candidate design and frozen scope packets." }
  graph:
    displayName: "Split into phases"
    why: "Breaks the design into phases that each fit one pull request."
    kind: active
    step:
      use: step.plan.graph
      inputs:
        - { use: input.context.code, with: { anchors: { fact: fact:anchors } } }   # LN-CTX2: the code lens, anchored on the design's covered surfaces (intake derives fact:anchors from the design packet)
    loop: rounds
    budget: { tokens: 5M }
    timeout: { after: 1d, then: park }
    next: "Draft {item}'s phase graph (round {loop.rounds}/{loop.rounds.cap})."
  check:       { kind: active, step: step.plan.check, timeout: { after: 1d, then: park },
                 next: "Run the plan checks and aw-packets validate on {item}'s graph." }
  exec-review:
    displayName: "Dry-run each phase"
    why: "Asks whether a builder, given only this, would succeed, so vague phases are found early."
    kind: active
    step:
      use: step.plan.exec-review
      inputs:
        - { use: input.context.code, with: { anchors: { fact: fact:anchors } } }   # LN-CTX2
    budget: { tokens: 5M }
    timeout: { after: 1d, then: park }
    next: "Review each of {item}'s phases as its builder: executable, context, files, checkable signals."
  holdout:     { displayName: "Write hidden tests", why: "Tests the builder never sees, so passing them cannot be gamed.", kind: active, step: step.plan.holdout, budget: { tokens: 5M }, timeout: { after: 1d, then: park },
                 next: "Write {item}'s hidden scenarios into the holdout store." }
  holdout-store: { displayName: "Store the hidden tests", why: "Puts the hidden tests where only the evaluator can read them.", kind: active, step: step.plan.holdout-store, loop: holdouts, timeout: { after: 1d, then: park },
                 next: "Move {item}'s hidden scenarios into the private store and add the canary." }
  evidence:    { kind: active, step: step.plan.evidence, timeout: { after: 1d, then: park },
                 next: "Check {item}'s design and plan evidence and assemble the candidate packets." }
  questions:   { kind: active, step: step.plan.questions, timeout: { after: 1d, then: park },
                 next: "Turn {item}'s open decisions into the stop's questions." }
  decide:      { kind: active, step: step.interview.answer, timeout: { after: 14d, then: park },
                 next: "Your stop: answer {item}'s open decisions. Each shows its options, trade-offs and the recommended one." }
  record:      { kind: active, step: step.interview.record, timeout: { after: 1d, then: park },
                 next: "Append {item}'s answers to the answer log." }
  settle:      { kind: active, step: step.plan.settle, timeout: { after: 1d, then: park },
                 next: "Compare {item}'s answers with the design's assumptions." }
  stop:        { displayName: "Approve the design and plan", why: "Locks in the design, the plan and every phase together.", kind: active, step: step.plan.review, loop: revisions, timeout: { after: 7d, then: park },
                 onOutcome: { approve: "Locks in the design and the plan and starts building.", reviseDesign: "Sends your notes back so the design is changed, then asks you again.", revisePlan: "Sends your notes back so the plan is changed, then asks you again.", drop: "Ends the work here and builds nothing." },
                 next: "Your stop: read {item}'s design and plan graph (`sindri plan show {instance}` or the stop view), then approve, revise the design, revise the plan, or drop." }
  freeze:      { kind: active, step: step.plan.freeze, loop: refreeze, timeout: { after: 1d, then: park },
                 next: "Re-check and freeze {item}'s design, plan and phase packets." }
  planned:     { displayName: "Plan approved", kind: terminal, outcome: resolved }
  redesign:    { displayName: "Sent back to design", kind: terminal, outcome: unresolved }
  dropped:     { displayName: "Dropped", kind: terminal, outcome: failed }
transitions:
  - { from: intake, to: graph, on: step.completed, when: { outcome: loaded },
      produces: [fact:design, fact:plan, fact:findings, fact:questions, fact:answers, fact:answerLog, fact:holdoutSets, fact:anchors] }
  - { from: graph,  to: check, on: step.completed, when: { outcome: drafted }, produces: [fact:plan] }
  - { label: "gaps found: plan again", from: check,  to: graph,       on: step.completed, when: { outcome: gaps }, produces: [fact:findings] }
  - { from: check,  to: exec-review, on: step.completed, when: { outcome: pass } }
  - { from: exec-review, to: holdout, on: step.completed, when: { outcome: executable } }
  - { label: "a builder would struggle: plan again", from: exec-review, to: graph,   on: step.completed, when: { outcome: objections }, produces: [fact:findings] }
  - { from: holdout,  to: holdout-store, on: step.completed, when: { outcome: written }, produces: [fact:holdoutDraft] }
  - { from: holdout-store, to: evidence, on: step.completed, when: { outcome: stored }, produces: [fact:holdoutSets] }
  - { label: "hidden tests rejected: write them again", from: holdout-store, to: holdout, on: step.completed, when: { outcome: invalid }, produces: [fact:findings] }
  - { from: evidence, to: questions, on: step.completed, when: { outcome: complete },   produces: [fact:planPacket, fact:recommendation] }
  - { from: evidence, to: graph,     on: step.completed, when: { outcome: incomplete }, produces: [fact:findings] }
  - { from: questions, to: decide, on: step.completed, when: { outcome: asked }, produces: [fact:questions] }
  - { from: questions, to: stop,   on: step.completed, when: { outcome: none } }
  - { from: decide, to: record, on: step.completed, when: { outcome: answered },   produces: [fact:answers] }
  - { from: decide, to: record, on: step.completed, when: { outcome: doneAsking }, produces: [fact:answers, fact:interviewClosed] }
  - { from: record, to: settle, on: step.completed, when: { outcome: recorded }, produces: [fact:answerLog] }
  - { from: settle, to: stop,     on: step.completed, when: { outcome: assumed } }
  - { label: "answers change the design: redesign", from: settle, to: redesign, on: step.completed, when: { outcome: changed }, produces: [fact:designRevision] }
  - { label: "answers change the plan: plan again", from: settle, to: graph,    on: step.completed, when: { outcome: replan } }
  - { from: stop, to: freeze,  on: step.completed, when: { outcome: approve } }
  - { label: "you asked for design changes", from: stop, to: record,  on: step.completed, when: { outcome: reviseDesign }, produces: [fact:answers] }
  - { label: "you asked for plan changes", from: stop, to: record,  on: step.completed, when: { outcome: revisePlan },   produces: [fact:answers] }
  - { label: "you dropped it", from: stop, to: dropped, on: step.completed, when: { outcome: drop } }
  - { from: freeze, to: planned, on: step.completed, when: { outcome: frozen },   produces: [fact:planPacket, fact:phasePackets] }
  - { from: freeze, to: evidence, on: step.completed, when: { outcome: mismatch }, produces: [fact:findings] }
loops: { rounds: { cap: 5 }, refreeze: { cap: 2 }, revisions: { cap: 5 }, holdouts: { cap: 5 } }
evals:   # the 7 cases of Appendix B.1 (plan's happy-assumed is assumed-happy: the shipped-recipe test wants a *-happy name) and two more
  - evals/workflow.plan/assumed-happy.jsonl
  - evals/workflow.plan/changed-decision.jsonl
  - evals/workflow.plan/drop.jsonl
  - evals/workflow.plan/evidence-incomplete.jsonl
  - evals/workflow.plan/freeze-mismatch.jsonl
  - evals/workflow.plan/holdout-invalid.jsonl
  - evals/workflow.plan/no-questions.jsonl
  - evals/workflow.plan/objections.jsonl
  - evals/workflow.plan/revise-cap.jsonl
  - evals/workflow.plan/revise-plan.jsonl
