# Validated against the wiring catalog, whose effect.test.merge acts with a human's authority, and a profile that allows it.
schema: 1
id: workflow.human-trigger
version: 1
initial: ask
states:
  ask:
    kind: active
    step: step.produce
    timeout: { after: 1h, then: park }
    next: "Write the line to send to your desk, then complete this Step."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - { from: ask, to: done, on: step.completed, when: { outcome: done }, effects: [effect.test.merge] }
inputs: [{ key: fact:item, type: item, kind: item }]
