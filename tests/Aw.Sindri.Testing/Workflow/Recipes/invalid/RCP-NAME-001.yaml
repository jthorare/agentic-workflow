schema: 1
id: workflow.name
version: 1
initial: produce_it
states:
  produce_it:
    kind: active
    step: step.produce
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - { from: produce_it, to: done, on: step.completed, when: { outcome: done }, produces: [fact:output] }
