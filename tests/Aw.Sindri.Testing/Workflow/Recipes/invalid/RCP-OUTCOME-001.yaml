schema: 1
id: workflow.outcome
version: 1
initial: produce
states:
  produce:
    kind: active
    step: step.produce
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
  checks:
    kind: active
    step: step.checks
    timeout: { after: 30m, then: retry }
    next: "Run the Step's deterministic checks."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - { from: produce, to: checks, on: step.completed, when: { outcome: done }, produces: [fact:output] }
  - { from: checks, to: done, on: step.completed, when: { outcome: passed } }
