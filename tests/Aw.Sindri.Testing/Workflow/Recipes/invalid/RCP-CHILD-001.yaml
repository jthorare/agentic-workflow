schema: 1
id: workflow.child-missing
version: 1
initial: running
states:
  running:
    kind: wait
    waitFor: { child: { recipe: workflow.absent, inputs: {}, onParked: propagate } }
    timeout: { after: 14d, then: park }
    next: "Waiting for {child}."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - { from: running, to: done, on: wait.satisfied }
