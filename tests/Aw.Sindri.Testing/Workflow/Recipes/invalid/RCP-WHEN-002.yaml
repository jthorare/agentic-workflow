schema: 1
id: workflow.when-loop
version: 1
initial: produce
states:
  produce:
    kind: active
    step: step.produce
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - { from: produce, to: done, on: step.completed, when: { all: [{ outcome: done }, { loop: rounds, below: cap }] } }
