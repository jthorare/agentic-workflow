schema: 1
id: workflow.loop-no-signal
version: 1
initial: produce
states:
  produce:
    kind: active
    step: step.produce
    loop: revisions
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - { from: produce, to: done, on: step.completed, when: { outcome: done }, produces: [fact:output] }
  - { from: produce, to: produce, on: step.failed }
loops: { revisions: { cap: 3, noProgress: [] } }
