schema: 1
id: workflow.cap-base
version: 1
initial: produce
states:
  produce:
    kind: active
    step: step.produce
    loop: revisions
    budget: { tokens: 200k }
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
  publish:
    kind: active
    step: step.produce
    timeout: { after: 4h, then: park }
    next: "Produce the Step output."
  running:
    kind: wait
    waitFor: { child: { recipe: workflow.step, onParked: propagate } }
    timeout: { after: 4h, then: park }
    next: "Waiting for {child}."
  done:
    kind: terminal
    outcome: resolved
transitions:
  - from: produce
    to: publish
    on: step.completed
    when: { outcome: done }
    gates:
      - { use: gate.review, threshold: 0.8 }
    evidence:
      - { kind: tests, at: head, expect: pass }
    produces: [fact:output]
  - from: produce
    to: produce
    on: step.failed
  - from: publish
    to: running
    on: step.completed
    when: { outcome: done }
    gates: [gate.check]
    effects:
      - use: effect.repo.push
        with: { remote: origin }
      - effect.notify.desk
  - from: running
    to: done
    on: wait.satisfied
loops: { revisions: { cap: 3 } }
budget: { tokens: 400k }
