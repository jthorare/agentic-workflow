questions:
  - id: aw-01
    issue: 3673
    question: "Where does a heavy job wait for a slot? Find the code that queues a dotnet job until one of the heavy slots is free."
    plain: "Where does a heavy job wait for a slot?"
    touch:
      - path: scripts/heavy.sh
        why: "the heavy wrapper: takes a slot under the lock, waits in the queue when the slots are taken and releases it when the job exits"
    read: []
    decoys: []
  - id: aw-02
    issue: 3673
    question: "Add a field to the payload of a Sindri ledger event: declare it in the event catalog and carry it through the ledger event."
    plain: "Add a field to the Sindri ledger events"
    touch:
      - path: src/Sindri/Aw.Sindri.Core/Events/EventCatalog.cs
        why: "the catalog of every event type with its public payload fields; a new field is declared here"
      - path: src/Sindri/Aw.Sindri.Core/Ledger/LedgerEvent.cs
        why: "the ledger event record every event is written as; the field travels in it"
    read:
      - path: src/Sindri/Aw.Sindri.Infrastructure/Ledger/LedgerEventMapper.cs
        why: "maps a ledger row to and from the event; shows how a payload field is read back"
    decoys: []
  - id: aw-03
    issue: 3673
    question: "How does aw-meta lane-recycle send keys into a lane's tmux pane: the command that runs it and the pane adapter that types."
