  - id: effect-05
    question: "Add a new SqlError reason `ReadOnlyViolation` (a write attempted on a read-only transaction/connection), not retryable, and have every SQL driver map its native 'read only' error to it."
    plain: "Add a distinct database error for 'tried to write in a read-only transaction' and make each database driver report it, instead of lumping it into unknown errors."
    touch:
      - path: packages/effect/src/sql/SqlError.ts
        why: "defines each reason class (LockTimeoutError l.280), the SqlErrorReason type union (l.370), the Schema.Union (l.390) and classifySqliteError (l.557, SQLITE_READONLY code 8) used by all SQLite drivers"
      - path: packages/sql/pg/src/internal/sqlError.ts
        why: "classifySqlState (l.37) maps Postgres SQLSTATEs to reasons; add 25006 read_only_sql_transaction"
      - path: packages/sql/pglite/src/PgliteClient.ts
        why: "its own classifyError (l.499) for Postgres codes, imports the reason classes (l.32); add the same 25006 mapping"
      - path: packages/sql/mysql2/src/MysqlClient.ts
        why: "classifyError (l.111) switches on errno; add 1792 (ER_CANT_EXECUTE_IN_READ_ONLY_TRANSACTION) and 1290"
      - path: packages/sql/mssql/src/MssqlClient.ts
        why: "classifyError (l.108) switches on SQL Server error numbers; add the read-only database codes (e.g. 3906)"
      - path: packages/effect/test/sql/SqlError.test.ts
        why: "table of reasons with tag + isRetryable + constructor (l.38 StatementTimeoutError row); the new reason gets a row"
      - path: packages/sql/pg/test/SqlErrorClassification.test.ts
        why: "asserts pg SQLSTATE -> reason mapping"
      - path: packages/sql/mysql2/test/SqlErrorClassification.test.ts
        why: "asserts mysql errno -> reason mapping"
      - path: packages/sql/mssql/test/SqlErrorClassification.test.ts
        why: "asserts mssql error number -> reason mapping"
      - path: packages/sql/pglite/test/SqlErrorClassification.test.ts
        why: "asserts pglite code -> reason mapping"
    read:
      - path: packages/sql/sqlite-node/src/SqliteClient.ts
        why: "classifyError (l.417) delegates to classifySqliteError, so SQLite gets the new reason from SqlError.ts with no edit; also matches error.reason._tag === 'LockTimeoutError' (l.194) as a retry condition, the pattern for tag-string coupling"
      - path: packages/sql/sqlite-bun/src/SqliteClient.ts
        why: "same delegation (l.39) and the same _tag string check (l.190); same for sqlite-wasm, sqlite-do, sqlite-react-native, libsql"
      - path: packages/sql/clickhouse/src/ClickhouseClient.ts
        why: "classifyError (l.62) is code-set based; ClickHouse READONLY (164) could map too, decide in or out of scope"
      - path: packages/sql/d1/src/D1Client.ts
        why: "classifyError (l.35) returns UnknownError for everything: no mapping to add, confirms D1 is out of scope"
      - path: packages/effect/src/sql/Migrator.ts
        why: "branches on error.reason._tag === 'ConstraintError' || 'UniqueViolation' (l.380): consumer of reason tags, shows that adding a variant must not alter these branches"
      - path: packages/sql/clickhouse/test/SqlErrorClassification.test.ts
        why: "only edited if ClickHouse is brought into scope"
    decoys:
      - path: packages/sql/pg/src/PgConnection.ts
        why: "where pg errors originate (ErrorResponse handling) but it hands code+message to classifySqlState; mapping lives in internal/sqlError.ts"
      - path: packages/effect/src/ai/AiError.ts
        why: "another structured 'reason' error type (AiError.reason), matches 'error variant' words, unrelated to SQL"
      - path: packages/effect/src/http/HttpClientError.ts
        why: "same 'reason' pattern for HTTP; not SQL"
      - path: packages/sql/mssql/src/MssqlMigrator.ts
        why: "mssql-named, contains no error classification"
    links_followed:
      - "rg -n 'LockTimeoutError' packages --glob '*.ts' --glob '!node_modules'   # every place a reason is defined, mapped or matched"
      - "rg -ln 'classifyError' packages/sql   # per-driver classifiers (12 files)"
      - "rg -n 'classifySqliteError' packages/sql/*/src   # sqlite family reuse the shared classifier"
      - "rg -n 'reason._tag' packages/effect/src packages/sql/*/src   # string-tag consumers"
