id: engineering.csharp.cross-package-through-core
kind: engineering
section: "4b.1"
text: "Reference another package only through its Core public surface (from Features, App or Host) or through its CLI or HTTP contract."
why: "Packages stay replaceable behind their contracts; Infrastructure and Features of another package are never reachable."
