schemaVersion: 1
id: engineering.csharp.fakes-with-contract-tests
kind: engineering
section: "4b.5"
text: "Each port has one in-memory fake, and a generic contract-test base runs the same tests against the fake and every real adapter; no mocking libraries."
why: "A fake that drifts from the real adapter makes tests lie."
select:
  languages: [csharp]
  paths: ["tests/**"]
checks:
  - type: test
    id: "ReadRepositoryContract"
    ref: tests/Aw.Kernel.Testing/ReadRepositoryContract.cs
    status: active
  - type: test
    id: "ContractCatchesBrokenFakesTests"
    ref: tests/Aw.Kernel.Testing.Tests/ContractCatchesBrokenFakesTests.cs
    status: active
  - type: test
    id: "OutboxContract"
    ref: tests/Aw.Kernel.Testing/OutboxContract.cs
    status: active
  - type: test
    id: "IdGeneratorContract"
    ref: tests/Aw.Kernel.Testing/IdGeneratorContract.cs
    status: active
  - type: review
    id: "no mocking library pins"
    status: active
    note: "Directory.Packages.props is reviewed"
gap: partial
gapNote: "The Kernel ports' contract bases (read repository, unit of work, outbox, id generator) run against their fakes and real adapters (SQL, and the judge's RandomIdGenerator); that every new port gets one (/new-slice writes it) and that no mocking library is pinned are reviewed."
