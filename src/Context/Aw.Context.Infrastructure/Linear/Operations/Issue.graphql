query Issue($id: String!) {
  issue(id: $id) {
    id identifier title description url createdAt updatedAt completedAt canceledAt
    priority estimate dueDate sortOrder
    state { id name type }
    assignee { id }
    cycle { id }
    labels { nodes { id } }
    team { id key name }
    creator { id name }
    project { id name }
    parent { id identifier title }
    attachments(first: 10) { nodes { id title url sourceType } pageInfo { hasNextPage } }
    comments(first: 50, orderBy: updatedAt) { nodes { id body createdAt user { id name } } pageInfo { hasNextPage } }
    relations(first: 25) { nodes { type relatedIssue { id identifier title } } }
    inverseRelations(first: 25) { nodes { type issue { id identifier title } } }
  }
}
