# Dependency updates (spec §4d): grouped, with a 14-day cooldown that matches the
# repo's minimum-age pin policy.
#
# Node stays only for scripts/ (Ajv for the schema checks) and the setup-time tools, so npm gets no
# major-version bumps and one grouped minor/patch PR a month. Security updates are separate from these
# version updates and still arrive as they're published.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /scripts
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    ignore:
      # Maintenance only: no major bumps in the Node tooling.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # The C# build (spec §4b.6), not in maintenance: versions live in Directory.Packages.props (central package
  # management), so one root entry covers every project. One grouped minor/patch PR a month, majors one at a time.
  # The bump must refresh the lock files (scripts/dotnet-verify-packages.sh fails on a stale one).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 1
    groups:
      nuget-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
