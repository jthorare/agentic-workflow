# CI — the AGENTS.md merge gate, run on every PR, every push to main and every merge-queue group.
#
# Rules (docs/superpowers/specs/2026-10-09-agent-readiness-design.md §4d):
# - workflow-level `permissions: contents: read`; no job asks for more
# - every action pinned to a full commit SHA (tag in the trailing comment)
# - no pull_request_target, no workflow_run, no secrets
# - path filtering happens inside each job (step-level `if:`), so a job whose
#   area didn't change still reports success with a no-op line, never "skipped"
# - `CI result` is the one check to require: it fails unless every job succeeded,
#   so a job skipped because `changes` failed can't pass for it
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  # Only superseded PR runs are cancelled; every main commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "0"

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      bash: ${{ steps.detect.outputs.bash }}
      dotnet: ${{ steps.detect.outputs.dotnet }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        name: Diff against the base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          bash scripts/ci/changed-areas.sh "$EVENT_NAME" "${BASE_SHA:-}" "${BASE_REF:-}" "${DEFAULT_BRANCH:-}"
          >> "$GITHUB_OUTPUT"

  bash-tests:
    name: Bash tests
    needs: changes
    # The hooks and installers target the owner's macOS boxes (launchd, BSD userland).
    # macos-15 is a moving image label: BSD tool updates on it are accepted churn,
    # and they're what this job exists to catch.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CHANGED: ${{ needs.changes.outputs.bash }}
    steps:
      - name: No-op when unchanged
        if: env.CHANGED != 'true'
        run: |
          echo "no-op: no hook, script, installer or package change — bash tests not needed"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CHANGED == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.CHANGED == 'true'
        with:
          # Node stays for the Ajv-based schema checks (scripts/package.json) and the .mjs gates.
          node-version-file: .nvmrc
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: env.CHANGED == 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Publish the C# judge and sindri the suites call
        if: env.CHANGED == 'true'
        # The suites run the real binaries (hooks, installers, the nudge), never a TS build. Judge is the NativeAOT
        # publish the hooks run; sindri is framework-dependent (the Temporal worker cannot be trimmed). The paths go to
        # the later steps through GITHUB_ENV; scripts/ci/bash-tests.sh keeps them in every suite's environment.
        run: |
          dotnet publish src/Judge/Aw.Judge.Host/Aw.Judge.Host.csproj -c Release -o "$RUNNER_TEMP/cs-bin/judge" -nologo -v quiet
          dotnet publish src/Sindri/Aw.Sindri.Host/Aw.Sindri.Host.csproj -c Release -o "$RUNNER_TEMP/cs-bin/sindri" -nologo -v quiet
          echo "AW_JUDGE_CS_BIN=$RUNNER_TEMP/cs-bin/judge/judge" >> "$GITHUB_ENV"
          echo "AW_SINDRI_CS_BIN=$RUNNER_TEMP/cs-bin/sindri/sindri" >> "$GITHUB_ENV"
      - name: Run every tracked bash test suite
        if: env.CHANGED == 'true'
        run: bash scripts/ci/bash-tests.sh
      - name: setup.sh dry run on macOS (every provider)
        if: env.CHANGED == 'true'
        run: ./setup.sh --providers claude,codex,cursor --dry-run

  gate:
    name: Merge gate checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Rules links and index are current
        run: scripts/sync-rules.sh --check
      - name: setup.sh dry run (every provider)
        run: ./setup.sh --providers claude,codex,cursor --dry-run
      - name: Every env var the code reads is in .env.example
        # A C# change runs only the .NET job, so the env scan runs here, where every PR passes.
        run: scripts/check-env-example.sh
      - name: deps.yaml matches the code
        run: |
          if [ -f scripts/check-deps.mjs ]; then
            node scripts/check-deps.mjs
          else
            echo "no-op: scripts/check-deps.mjs not present yet — the deps.yaml check starts when it lands"
          fi
      - name: Rule records name real checks
        run: node scripts/check-rules.mjs

  dotnet:
    name: .NET build and test
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHANGED: ${{ needs.changes.outputs.dotnet }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect the solution
        id: sln
        run: |
          if [ ! -d src ]; then
            echo "no-op: src/ not present — dotnet build/test no-op until the first C# project lands"
            exit 0
          fi
          if [ "$CHANGED" != "true" ]; then
            echo "no-op: no .NET change — dotnet build/test not needed"
            exit 0
          fi
          if [ ! -f global.json ]; then
            echo "::error::src/ exists but global.json doesn't — the SDK must be pinned before C# builds"
            exit 1
          fi
          shopt -s nullglob
          slns=(*.slnx)
          if [ "${#slns[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .slnx at the repo root, found ${#slns[@]}"
            exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "sln=${slns[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.sln.outputs.run == 'true'
        with:
          # With rollForward: disable, setup-dotnet v6 installs sdk.version exactly
          # (only latestPatch/latestFeature/latestMinor/latestMajor widen it).
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: The SDK is exactly the global.json pin
        if: steps.sln.outputs.run == 'true'
        run: |
          want="$(jq -r .sdk.version global.json)"
          got="$(dotnet --version)"
          echo "global.json pins $want; dotnet --version is $got"
          if [ "$want" != "$got" ]; then
            echo "::error::SDK $got is not the global.json pin $want"
            exit 1
          fi
      - name: dotnet restore (locked, signature-verified) and the NuGet supply-chain check
        if: steps.sln.outputs.run == 'true'
        # scripts/dotnet-verify-packages.sh (spec §4b.6, §4d; merge gate item 8): every solution project has a
        # committed lock file; a locked, signature-verified restore (one retry: NU1900 feed outages are transient)
        # leaves them unchanged; and `dotnet nuget verify --all` passes for every locked package (analyzers
        # included: they run in every build). The build and test steps below use this restore.
        run: bash scripts/dotnet-verify-packages.sh
      - name: dotnet format
        if: steps.sln.outputs.run == 'true'
        # The same check as the meta gate's format step (~3 GB solution-wide, so one step and not parallel).
        env:
          SLN: ${{ steps.sln.outputs.sln }}
        run: dotnet format "$SLN" --verify-no-changes -v q
      - name: dotnet build
        if: steps.sln.outputs.run == 'true'
        env:
          SLN: ${{ steps.sln.outputs.sln }}
        run: dotnet build "$SLN" --no-restore --configuration Release -warnaserror
      - name: Fetch the pinned Temporal binaries
        if: steps.sln.outputs.run == 'true'
        # binaries.lock (engine spec rev 8 §0): the Sindri integration tests start the dev server (temporal) and the
        # time-skipping server (temporal-test-server) from these paths with ExistingPath, so the SDK never downloads;
        # the Sindri host smoke below starts 'sindri serve', which runs the dev server. fetch checks each archive's
        # sha256 and installs under ~/.agentic-workflow/cache/bin/<name>-<version>/.
        run: |
          scripts/binaries-lock.sh fetch temporal
          scripts/binaries-lock.sh fetch temporal-test-server
      - name: dotnet test
        if: steps.sln.outputs.run == 'true'
        env:
          SLN: ${{ steps.sln.outputs.sln }}
        # Microsoft.Testing.Platform (global.json test.runner): --solution, and MTP options
        # only. VSTest options (--logger, --collect, --settings, --blame) make MTP run zero
        # tests (exit 5). A lane step that may select no tests adds --ignore-exit-code 8.
        # --report-xunit-ctrf writes one CTRF report per test project for the lane cap below; no
        # --report-xunit-ctrf-filename, or every project would write the same file.
        run: dotnet test --solution "$SLN" --no-build --configuration Release --results-directory TestResults --report-xunit-ctrf
      - name: Per-test lane cap (LANE-TEST-001/002)
        if: steps.sln.outputs.run == 'true'
        # Each test's own time against its lane's budget (unit 10 s, integration 60 s), and exactly one
        # known Lane trait per test: the run above is unfiltered, so a test with none shows up (spec §4b.5).
        run: dotnet run --project tests/Aw.LaneCap.Testing --configuration Release --no-build -- TestResults
      - name: Recipe versions (a content change bumps the version)
        if: steps.sln.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        # Setup-once spec §5.3: `recipe manifest` over `git archive HEAD recipes/sindri` and over the same archive of the base branch,
        # then `recipe validate <file> --against <the base manifest>` for every recipe: a hash that changed at the same version
        # fails (RCP-VERSION-001). No manifest is committed. Every shipped recipe's evals run in the test step above
        # (ShippedRecipesTests, EvalShippedRecipesTests); `sindri recipe eval --shipped` runs them over the embedded set at publish time.
        # The credential travels in this one git process's environment as a header, never in the URL or an argument.
        run: |
          token_header="Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$token_header" \
            git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          bash scripts/ci/recipe-versions.sh --base-ref "origin/${BASE_BRANCH}"
      - name: NativeAOT smoke tests
        if: steps.sln.outputs.run == 'true'
        # Each publishes for the runner's own RID (linux-x64), runs the native binary and
        # compares its output; clang and zlib1g-dev are on ubuntu runners. One exception: the Sindri
        # host's smoke (src/Sindri/aot-smoke) publishes framework-dependent, since the Temporal SDK has
        # no trimming support (engine spec rev 8 §11), and runs the published apphost. The smokes are found by
        # location (src/<Project>.AotSmoke/, src/<Pkg>/<Project>.AotSmoke/ or src/<Pkg>/aot-smoke/), so
        # a new package's smoke needs no edit here.
        run: |
          shopt -s nullglob
          for smoke in src/*.AotSmoke/run.sh src/*/*.AotSmoke/run.sh src/*/aot-smoke/run.sh; do
            echo "== $smoke"
            bash "$smoke"
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.sln.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
      - name: Hook contract (real hooks against the C# judge)
        if: steps.sln.outputs.run == 'true'
        # Spec §4c: the bash hooks keep running through the switch, so what they read from judge is frozen.
        # Runs config/hooks/* with the C# judge first on PATH, offline, and checks only the hook-read points.
        # Spec §4a step 3 and §4b.5: the real hooks run against the NativeAOT binary, the one the NativeAOT smoke step
        # above published to artifacts/aot-judge-smoke/bin/judge (its cleanup removes only its run directory), so a
        # trimmed member or a missing source-generated type on a hook path fails here.
        run: AW_JUDGE_CS_BIN=artifacts/aot-judge-smoke/bin/judge bash config/lib/tests/judge-cs-hook-surface.test.sh
      - name: Hook contract, sindri
        if: steps.sln.outputs.run == 'true'
        # The SessionStart nudge (config/hooks/sindri-nudge.sh) against the C# sindri: one line, silence, exit 0, read-only, bounded.
        # Sindri is framework-dependent (no NativeAOT), so the test builds it itself.
        run: bash config/lib/tests/sindri-cs-hook-surface.test.sh
      - name: Install end to end
        if: steps.sln.outputs.run == 'true'
        # Cutover spec §12 P2: scripts/cutover-prove.sh installs the C# build into a scratch box (a guarded temp
        # AW_STATE_DIR and CLAUDE_LOCAL_BIN, never the runner's real ones), drives the installed binaries and the removal
        # script, and fails if anything installed still points at a TS build.
        run: bash scripts/cutover-prove.sh
      - name: Lane budgets per package
        if: steps.sln.outputs.run == 'true'
        # Times each test project's unit and integration lanes against the Release build
        # above (--no-build: compile time is not part of the budget), sums them per
        # deps.yaml package and fails a package at or over its budget (LANE-PKG-001, §4b.5).
        run: node scripts/ci/lane-budgets.mjs --configuration Release
      - name: Upload test and AOT smoke output on failure
        if: failure() && steps.sln.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-results
          path: |
            TestResults
            artifacts/aot-smoke
            artifacts/aot-*/*.txt
            artifacts/aot-*/publish.log
            artifacts/aot-data-smoke
            artifacts/aot-redaction-smoke
            artifacts/aot-telemetry-smoke
          if-no-files-found: ignore
          retention-days: 7

  scaffold:
    name: C# scaffold generators
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # The generators live under scripts/ (bash area) and their templates must build against the root C# settings
      # (dotnet area): either change runs them.
      CHANGED: ${{ needs.changes.outputs.bash == 'true' || needs.changes.outputs.dotnet == 'true' }}
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      AVALONIA_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: No-op when unchanged
        if: env.CHANGED != 'true'
        run: |
          echo "no-op: no script or .NET change — the scaffold end-to-end test is not needed"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CHANGED == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.CHANGED == 'true'
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: env.CHANGED == 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Scaffold, build and test a small cli and a full http package, then remove them
        if: env.CHANGED == 'true'
        # docs/csharp/scaffolds/new-package.md "Done criteria": the generators' own CI test, against the real root
        # files. Each package lives in a throwaway git worktree that the script removes. A NuGet feed error (the
        # generators restore new projects over the network) gets one retry, like the .NET job's restore.
        run: |
          set +e
          bash scripts/scaffold/e2e.sh 2>&1 | tee "$RUNNER_TEMP/scaffold-e2e.log"
          code="${PIPESTATUS[0]}"
          if [ "$code" -ne 0 ] && grep -qE 'NU1900|NU1301|Unable to load the service index' "$RUNNER_TEMP/scaffold-e2e.log"; then
            echo "::warning::NuGet feed error during the scaffold e2e — retrying once in 30s"
            sleep 30
            bash scripts/scaffold/e2e.sh
            code=$?
          fi
          exit "$code"

  ci-result:
    name: CI result
    needs: [changes, bash-tests, gate, dotnet, scaffold]
    # The one job-level `if:` in this file: it must run (and fail) even when a need
    # failed or was skipped, since GitHub counts a skipped required check as passing.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::not successful: $bad"
            exit 1
          fi
