# Vale (vale.sh), the prose linter: scripts/check-prose.sh runs it (issue 2919). Our own style only, under
# .vale/styles/Aw, written from the reply voice (config/voice/reply.md) and its Structure rules. No packages are
# fetched at check time; the vale binary is pinned in binaries.lock.
StylesPath = .vale/styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Aw

# The voice files quote bad examples on purpose (the ✗ lines) and speak Slack, not docs.
[config/voice/*.md]
BasedOnStyles =
