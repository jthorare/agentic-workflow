# deploy/images.lock — every third-party image the Sindri deployment pulls, pinned by digest (spec
# docs/superpowers/specs/2026-10-23-sindri-deployable-context-design.md decision K11, §A.1). Checked by scripts/images-lock.sh check (CI).
# Rows (whitespace-separated; '#' comments and blank lines are ignored):
#   image <repository> <tag> <platform> <sha256:digest>   platform is `index` (the multi-arch image index: what a Dockerfile FROM and a
#                                                         chart name, as <repository>@<digest>) or linux/amd64 or linux/arm64 (the
#                                                         manifest the index lists for it). A repository may carry several tags; each
#                                                         tag has one index row and both platform rows.
#   todo <repository> <phase>                             an image the deployment will pull whose digests are not resolved yet; the
#                                                         phase (K-C1: the charts) fills it in. `check` lists these and still passes.
# Resolved 2026-10-23 from the registries' manifest APIs (mcr.microsoft.com, registry-1.docker.io, ghcr.io), anonymous reads:
#   the index digest is the Docker-Content-Digest of GET /v2/<repository>/manifests/<tag> with an index Accept header, the platform
#   rows are that index's linux/amd64 and linux/arm64 entries. Recheck with `docker buildx imagetools inspect <repository>:<tag>`.
# mcr.microsoft.com/dotnet/sdk is the SDK global.json pins (10.0.401) on Ubuntu noble. The aspnet runtime tag floats within 10.0,
# which is why only its digest is trusted; bump both rows when the SDK pin moves.

