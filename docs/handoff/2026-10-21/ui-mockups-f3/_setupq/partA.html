<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Tokens: SuperPlane dark factory theme (VISUAL-LANGUAGE.md section 1). Each colour is defined once. */
:root{
  --bg:#14120b; --fg:#edecec; --card:#17191c; --card-warm:#1b1913; --muted:#26251e; --muted-fg:#a3a3a3; --faint:#8a8f98;
  --border:#33312b; --field:#221f18; --ring:#8a8578; --wire:#4a4740;
  --panel:#101113; --panel-card:#17191c; --panel-border:#2e3138; --panel-hover:#1f2125;
  --seg:#2a2c2f; --seg-on:#101113;
  --lane-run:rgba(29,78,216,.08); --lane-idle:rgba(255,255,255,.02); --lane-head:rgba(0,0,0,.25);
  --hover:rgba(255,255,255,.04); --focus:rgba(255,255,255,.07); --select:rgba(255,255,255,.1);
  --run-fg:#93c5fd; --run-bg:rgba(29,78,216,.16); --run-bd:rgba(59,130,246,.4); --run-dot:#60a5fa;
  --wait-fg:#fcd34d; --wait-bg:rgba(180,83,9,.18); --wait-bd:rgba(245,158,11,.4); --wait-dot:#f59e0b;
  --done-fg:#86efac; --done-bg:rgba(21,128,61,.18); --done-bd:rgba(74,222,128,.35); --done-dot:#4ade80;
  --fail-fg:#fca5a5; --fail-bg:rgba(185,28,28,.18); --fail-bd:rgba(248,113,113,.35); --fail-dot:#f87171;
  --you-fg:#c4b5fd; --you-bg:rgba(109,40,217,.18); --you-bd:rgba(139,92,246,.4); --you-dot:#a78bfa;
  --idle-fg:#a1a1aa; --idle-bg:#26251e; --idle-bd:#33312b; --idle-dot:#71717a;
  --annot:#f59e0b; --annot-ink:#1a1200;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 13px/19.5px var(--font);font-feature-settings:"cv02","cv03","cv04","cv11";-webkit-font-smoothing:antialiased;overflow:hidden;letter-spacing:-.01em}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ring);outline-offset:1px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:0}
.tnum{font-variant-numeric:tabular-nums}
kbd{font:500 11px/16px var(--mono);letter-spacing:0;border:1px solid var(--border);border-radius:4px;padding:0 5px;height:18px;display:inline-flex;align-items:center;color:var(--muted-fg);background:var(--field)}

/* ---------- App frame ---------- */
.app{display:flex;height:100vh;min-width:900px}
.rail{width:56px;flex:none;background:var(--card-warm);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
.rail .ws{width:32px;height:32px;border-radius:8px;background:var(--fg);color:var(--bg);font:700 13px/32px var(--font);text-align:center;margin-bottom:12px}
.rail a{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted-fg);position:relative}
.rail a svg{width:20px;height:20px}
.rail a:hover{background:var(--hover);color:var(--fg)}
.rail a[aria-current]{background:var(--muted);color:var(--fg);box-shadow:inset 0 0 0 1px var(--border)}
.rail a .tip{position:absolute;left:48px;top:50%;transform:translateY(-50%);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font:500 12px/18px var(--font);color:var(--fg);white-space:nowrap;display:none;z-index:30}
.rail a:hover .tip{display:block}
.rail .sp{flex:1}
.rail .me{width:28px;height:28px;border-radius:50%;background:var(--seg);font:600 11px/28px var(--font);text-align:center;color:var(--muted-fg)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.work{flex:1;min-height:0;display:flex}
.page{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- Top bar ---------- */
.top{height:56px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--border)}
.top h1{font:600 22px/33px var(--font);letter-spacing:-.02em;margin:0;white-space:nowrap}
.search{position:relative;flex:1;max-width:360px;min-width:120px;margin-left:8px}
.search svg{position:absolute;left:10px;top:8px;width:16px;height:16px;color:var(--muted-fg)}
.search input{width:100%;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--field);padding:0 40px 0 34px;outline:none;font-size:13px}
.search input::placeholder{color:var(--muted-fg)}
.search input:focus{border-color:var(--ring)}
.search kbd{position:absolute;right:8px;top:7px}
.top .sp{flex:1}
.cmdk{display:inline-flex;align-items:center;gap:6px;color:var(--muted-fg);font-size:12px;height:28px;padding:0 8px;border-radius:6px;border:1px solid var(--border)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-fg);height:28px;cursor:pointer;user-select:none}
.switch i{width:28px;height:16px;border-radius:8px;background:var(--seg);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--muted-fg);transition:transform .2s}
.switch[aria-checked=true] i{background:var(--annot)}
.switch[aria-checked=true] i::after{transform:translateX(12px);background:var(--annot-ink)}

.bar{height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border)}
.seg{display:inline-flex;background:var(--seg);border-radius:8px;padding:2px;gap:2px}
.seg button{white-space:nowrap;height:28px;padding:0 12px;border-radius:6px;font:500 12px/16px var(--font);color:var(--muted-fg);display:inline-flex;align-items:center;gap:6px;border:1px solid transparent}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed=true]{background:var(--seg-on);color:var(--fg);border-color:var(--border)}
.seg .n{font-variant-numeric:tabular-nums;color:var(--faint);font-size:11px}
.seg button .ico{width:14px;height:14px}
.wfchip{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:6px;font:500 13px/16px var(--font);background:var(--field);min-width:0}
.wfchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wfchip .ico{width:14px;height:14px;color:var(--muted-fg)}
.bar .sp{flex:1}
.hint{color:var(--faint);font-size:12px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}

/* ---------- Status badge and glyphs ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 6px 2px 4px;border-radius:4px;font:500 12px/16px var(--font);white-space:nowrap;border:1px solid transparent}
.badge .ico{width:14px;height:14px}
.s-running{color:var(--run-fg);background:var(--run-bg);border-color:var(--run-bd)}
.s-running .ico{stroke:var(--run-dot)}
.s-wait{color:var(--wait-fg);background:var(--wait-bg);border-color:var(--wait-bd)}
.s-wait .ico{stroke:var(--wait-dot)}
.s-done{color:var(--done-fg);background:var(--done-bg);border-color:var(--done-bd)}
.s-done .ico{stroke:var(--done-dot)}
.s-fail{color:var(--fail-fg);background:var(--fail-bg);border-color:var(--fail-bd)}
.s-fail .ico{stroke:var(--fail-dot)}
.s-you{color:var(--you-fg);background:var(--you-bg);border-color:var(--you-bd)}
.s-you .ico{stroke:var(--you-dot)}
.s-idle{color:var(--idle-fg);background:var(--idle-bg);border-color:var(--idle-bd)}
.s-idle .ico{stroke:var(--idle-dot)}
.spin{animation:spin 1s linear infinite;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font:500 11px/16px var(--font);border:1px solid;white-space:nowrap}
.chip .ico{width:12px;height:12px}

/* ---------- Board ---------- */
.boardwrap{flex:1;min-height:0;overflow:auto;padding:16px 16px 12px}
.board{display:flex;gap:10px;height:100%;min-height:420px;width:100%;min-width:1230px}
.lane{flex:1 1 0;min-width:200px;display:flex;flex-direction:column;border:1px solid color-mix(in oklab,var(--border) 70%,transparent);border-radius:8px;background:var(--lane-run)}
.lane.idle{background:var(--lane-idle)}
.lane.last{flex:.6 1 0;min-width:150px}
.lane .lh{background:var(--lane-head);border-bottom:1px solid color-mix(in oklab,var(--border) 70%,transparent);border-radius:8px 8px 0 0;padding:10px 12px 8px}
.lane .lt{display:flex;align-items:center;gap:8px}
.lane .lt h2{font:600 15px/22.5px var(--font);letter-spacing:-.01em;margin:0;flex:1}
.lane .cnt{font:500 12px/16px var(--font);color:var(--faint);font-variant-numeric:tabular-nums}
.lane .why{color:var(--muted-fg);font-size:12px;line-height:16px;min-height:32px;margin-top:2px}
.lane .appr{display:flex;align-items:center;gap:6px;color:var(--muted-fg);font-size:12px;line-height:16px;height:20px;margin-top:6px}
.lane .appr .ico{width:14px;height:14px}
.lane .lb{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.empty{border:1px dashed color-mix(in oklab,var(--border) 90%,transparent);border-radius:6px;padding:20px 12px;text-align:center;color:var(--muted-fg);font-size:12px;line-height:18px}
.empty b{display:block;color:var(--fg);font-weight:500;font-size:13px;margin-bottom:2px}

.card{display:block;width:100%;text-align:left;border-radius:6px;border:1px solid var(--border);background:var(--card-warm);padding:10px;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:border-color .2s,background-color .2s;position:relative}
.card:hover{border-color:color-mix(in oklab,var(--fg) 20%,transparent)}
.card[aria-selected=true]{background:var(--panel-card);border-color:color-mix(in oklab,var(--fg) 30%,transparent)}
.card .ct{font:500 13px/20px var(--font);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cm{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;margin-top:6px}
.card .time{font-size:12px;line-height:16px;color:var(--muted-fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .step{margin-top:6px;font-size:12px;line-height:16px;color:var(--muted-fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .chips{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.chip.need{color:var(--wait-fg);background:var(--wait-bg);border-color:var(--wait-bd)}

/* ---------- List ---------- */
.listwrap{flex:1;min-height:0;overflow:auto;container-type:inline-size}
.lcols,.lrow{display:grid;grid-template-columns:minmax(200px,2.2fr) 128px 148px minmax(150px,1.8fr) 124px 80px;column-gap:12px;align-items:center;padding:0 16px}
.lcols{height:28px;position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--border);color:var(--faint);font:500 12px/16px var(--font)}
.grp{height:32px;display:flex;align-items:center;gap:8px;padding:0 16px;background:color-mix(in oklab,var(--card-warm) 80%,transparent);border-bottom:1px solid var(--border);font:500 13px/16px var(--font);color:var(--muted-fg);position:sticky;top:28px;z-index:2}
.grp .ico{width:14px;height:14px}
.grp b{color:var(--fg);font-weight:500}
.grp .n{color:var(--faint);font-variant-numeric:tabular-nums}
.lrow{height:36px;border-bottom:1px solid color-mix(in oklab,var(--border) 60%,transparent);width:100%;text-align:left;transition:background-color .1s}
.lrow:hover{background:var(--hover)}
.lrow[data-focus=true]{background:var(--focus)}
.lrow[aria-selected=true]{background:var(--select);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--fg) 15%,transparent)}
.lrow > *{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .it{display:flex;align-items:center;gap:8px;font-weight:500}
.lrow .it span.t{overflow:hidden;text-overflow:ellipsis}
.lrow .it .mono{color:var(--faint);font-weight:400}
.lrow .muted{color:var(--muted-fg)}
.lrow .up{color:var(--faint);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.lcols .r{text-align:right}
@container (max-width:960px){
  .lcols,.lrow{grid-template-columns:minmax(150px,2fr) 148px minmax(110px,1.4fr) 72px}
  .c-stage,.c-wait{display:none}
}
@container (max-width:560px){
  .lcols,.lrow{grid-template-columns:minmax(120px,1fr) 148px}
  .c-step,.c-up{display:none}
  .lrow .it .mono{display:none}
}
.noresult{padding:48px 16px}

/* ---------- Inspector ---------- */
.insp{width:min(480px,48vw);min-width:360px;flex:none;background:var(--panel);border-left:1px solid var(--panel-border);display:none;flex-direction:column;min-height:0}
.insp.open{display:flex}
.insp .chrome{height:40px;flex:none;display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--panel-border)}
.ib{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted-fg)}
.ib:hover{background:var(--panel-hover);color:var(--fg)}
.ib .ico{width:16px;height:16px}
.insp .chrome .sp{flex:1}
.insp .scroll{flex:1;overflow-y:auto;min-height:0}
.insp .hd{padding:16px;border-bottom:1px solid var(--panel-border)}
.insp .hd .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.insp h2{font:600 16px/22px var(--font);letter-spacing:-.01em;margin:8px 0 0}
.insp .meta{margin-top:6px;font-size:12px;line-height:16px;color:var(--muted-fg);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.insp .meta .dotsep{color:var(--faint)}
.copy{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--panel-border);border-radius:4px;padding:1px 6px;color:var(--muted-fg);font:400 11px/16px var(--mono);letter-spacing:0;max-width:100%}
.copy:hover{color:var(--fg);background:var(--panel-hover)}
.copy .ico{width:12px;height:12px}
.copy span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{height:32px;padding:0 12px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;font:500 13px/16px var(--font);border:1px solid var(--border);background:var(--field);color:var(--fg)}
.btn:hover{background:var(--muted)}
.btn .ico{width:14px;height:14px}
.btn.primary{background:#f7f7f4;color:#26251e;border-color:#f7f7f4}
.btn.primary:hover{background:#e6e6e0}
.callout{margin:16px 16px 0;border:1px solid var(--panel-border);background:var(--panel-card);border-radius:8px;padding:12px}
.callout.need{border-color:var(--wait-bd);background:var(--wait-bg)}
.callout.bad{border-color:var(--fail-bd);background:var(--fail-bg)}
.callout h3{font:600 13px/19px var(--font);margin:0;display:flex;gap:8px;align-items:center}
.callout h3 .ico{width:14px;height:14px}
.callout.need h3{color:var(--wait-fg)}
.callout.bad h3{color:var(--fail-fg)}
.callout p{margin:4px 0 0;font-size:12px;line-height:18px;color:var(--muted-fg)}
.callout .acts{margin-top:10px}
.cap{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--panel-border);font:600 12px/16px var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-top:16px}
.cap .n{margin-left:auto;font-weight:500;text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.stg{border-bottom:1px solid var(--panel-border)}
.stg .sh{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 16px}
.stg .sn{font:500 13px/20px var(--font);flex:1;min-width:0}
.stg .sn small{display:block;font:400 12px/16px var(--font);color:var(--muted-fg);margin-top:1px}
.stg .sr{display:flex;align-items:center;gap:8px;white-space:nowrap}
.stg .sd{font-size:12px;color:var(--muted-fg);font-variant-numeric:tabular-nums}
.stg.cur{background:var(--panel-card)}
.stg.off .sn{color:var(--muted-fg)}
.idx{width:16px;height:16px;border-radius:50%;background:var(--panel-border);color:var(--muted-fg);font:600 11px/16px var(--font);text-align:center;flex:none;font-variant-numeric:tabular-nums}
.foot{padding:12px 16px 24px;color:var(--faint);font-size:12px;line-height:18px;display:flex;gap:8px;align-items:center}

/* ---------- Annotations (data-gap) ---------- */
body.annot [data-gap]{outline:1px dashed var(--annot);outline-offset:2px;position:relative}
body.annot [data-gap]::after{content:attr(data-gap);position:absolute;top:-10px;left:4px;z-index:40;background:var(--annot);color:var(--annot-ink);font:600 11px/14px var(--font);letter-spacing:0;padding:0 4px;border-radius:3px;pointer-events:none;white-space:nowrap}
body.annot .lane .lh [data-gap]::after{top:-9px}
