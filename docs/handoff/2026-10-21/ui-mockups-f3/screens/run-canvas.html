<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14120b; --fg:#edecec; --card:#17191c; --card-warm:#1b1913; --muted:#26251e; --muted-fg:#a3a3a3;
  --border:#33312b; --field:#221f18; --ring:#8a8578; --wire:#4a4740; --dots:#33312b; --canvas:#14120b;
  --handle-border:#4a4740; --handle-hover:#6b6560;
  --node-outline:rgba(255,255,255,.06); --node-icon-border:rgba(255,255,255,.08); --node-shadow:0 1px 3px rgba(0,0,0,.28);
  --running-dot:#60a5fa; --running-bg:rgba(29,78,216,.16); --sel-ring:#60a5fa; --wire-running:#818cf8; --wire-failed:#f87171;
  --hover:rgba(255,255,255,.04);--seg:#2a2c2f;--seg-on:#101113;--panel:#101113; --panel-line:rgba(255,255,255,.1); --panel-fg:#f3f4f6; --panel-muted:#9096a2; --panel-dim:#747c8b; --tl-border:#2e3138;
  --attn:#fcd34d; --attn-bg:rgba(180,83,9,.18); --attn-border:rgba(245,158,11,.4);
  --ok:#6ee7b7; --fail:#fca5a5; --gap:#f59e0b;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 13px/19.5px var(--font);font-feature-settings:"cv02","cv03","cv04","cv11";-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer}
svg{flex:none}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{display:flex;height:100vh;width:100vw}
/* rail */
.rail{width:56px;flex:none;background:var(--card-warm);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px}
.rail .ws{width:32px;height:32px;border-radius:8px;background:var(--fg);color:var(--bg);font:700 13px/32px var(--font);text-align:center;margin-bottom:12px}
.rail a{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted-fg);position:relative}
.rail a svg{width:20px;height:20px}
.rail a:hover{background:var(--hover);color:var(--fg)}
.rail a[aria-current]{background:var(--muted);color:var(--fg);box-shadow:inset 0 0 0 1px var(--border)}
.rail a .tip{position:absolute;left:48px;top:50%;transform:translateY(-50%);background:var(--card);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font:500 12px/18px var(--font);color:var(--fg);white-space:nowrap;display:none;z-index:30}
.rail a:hover .tip{display:block}
.rail .sp{flex:1}
.rail .me{width:28px;height:28px;border-radius:50%;background:var(--seg);font:600 11px/28px var(--font);text-align:center;color:var(--muted-fg)}
.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rail a svg{width:20px;height:20px}
/* main column */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;border-bottom:1px solid var(--border);background:var(--bg);min-width:0}
.hdr h1{margin:0;font:600 16px/24px var(--font);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.hdr .crumb{color:var(--muted-fg);font:500 12px/16px var(--font);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 6px 2px 4px;font:500 12px/16px var(--font);flex:none;white-space:nowrap}
.badge svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.b-running{background:rgba(23,37,84,.7);color:#93c5fd}.b-passed{background:rgba(2,44,34,.7);color:#6ee7b7}
.b-failed{background:rgba(69,10,10,.7);color:#fca5a5}.b-pending{background:#0f172a;color:#d1d5db}
.b-unres{background:#26251e;color:#d6d3d1}.b-canc{background:#0f172a;color:#d1d5db}.b-done{background:rgba(2,44,34,.7);color:#6ee7b7}
.b-took{background:rgba(76,29,149,.45);color:#c4b5fd}
.b-needs{background:var(--attn-bg);color:var(--attn)}.b-you{background:#26251e;color:#d1d5db}
.meta{color:var(--muted-fg);font:400 12px/16px var(--font);white-space:nowrap;font-variant-numeric:tabular-nums}
.ref{display:inline-flex;align-items:center;gap:6px;font:400 11px/16px var(--mono);color:#747c8b;border:1px solid var(--border);border-radius:6px;padding:2px 6px;background:var(--field);white-space:nowrap}
.ref:hover{color:var(--fg)}
.ref svg{width:12px;height:12px}
.hdr .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--muted);color:var(--fg);font:500 12px/1 var(--font);white-space:nowrap}
a.btn,a.btn:hover{text-decoration:none}
.btn:hover{background:#383c44}
.btn.pri{background:#f7f7f4;color:#26251e;border-color:transparent}.btn.pri:hover{background:#fff}
.btn.dis{opacity:.45;pointer-events:none}
.btn .ic{width:14px;height:14px}
.btn.term{font-family:var(--font);background:var(--field)}
.seg{display:inline-flex;background:#26251e;border-radius:8px;padding:2px;gap:2px}
.seg button{white-space:nowrap;height:24px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--muted-fg);font:500 12px/1 var(--font)}
.seg button.on{background:#383c44;color:var(--fg)}
.smenu{position:relative}.smenu summary{list-style:none}.smenu summary::-webkit-details-marker{display:none}.smenu .sm{position:absolute;right:0;top:34px;min-width:210px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px;z-index:70}
.smenu .sm a{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font:500 12px/16px var(--font)}.smenu .sm a small{color:var(--muted-fg);font-weight:400;font-size:11px}.smenu .sm a:hover{background:rgba(255,255,255,.06)}
.tgl{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted-fg);font:500 12px/1 var(--font)}
.tgl .sw{width:22px;height:12px;border-radius:6px;background:var(--muted);position:relative}
.tgl .sw:after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--muted-fg);transition:.15s}
body.ann .tgl{color:var(--fg)}body.ann .tgl .sw{background:#5b4410}body.ann .tgl .sw:after{left:12px;background:var(--gap)}
.runsbtn{display:none}
.wd{font-weight:500}

/* body row */
.row{flex:1;display:flex;min-height:0;position:relative}
/* runs sidebar */
.runs{width:280px;flex:none;background:var(--card-warm);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.runs-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);font:500 12px/16px var(--font);text-transform:uppercase;letter-spacing:.04em;color:var(--muted-fg)}
.search{flex:1;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--field);font:400 13px/1 var(--font);color:var(--muted-fg);text-transform:none;letter-spacing:-.01em;min-width:0}
.search svg{width:16px;height:16px}
.fbtn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted-fg);display:flex;align-items:center;justify-content:center}
.runs-list{overflow:auto;padding:2px 0 8px}
.rw{padding:6px 8px 0}
.rc{color:inherit;text-decoration:none;display:block;border:1px solid var(--border);background:var(--card-warm);border-radius:6px;padding:10px 12px;cursor:pointer}
.rc:hover{background:rgba(30,41,59,.55)}
.rc.sel{background:#1e293b;border-color:rgba(237,236,236,.2)}
.rc .t{font:500 13px/19.5px var(--font);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc .m{margin-top:4px;display:flex;align-items:center;gap:6px;font:400 12px/16px var(--font);color:var(--muted-fg)}
.rc .m svg{width:14px;height:14px}
.rc .m .w{font-weight:500}
.rc .m .ts{margin-left:auto;font-variant-numeric:tabular-nums}
.c-neu{color:#d6d3d1}.c-run{color:#93c5fd}.c-needs{color:var(--attn)}.c-you{color:#c4b5fd}.c-fail{color:var(--fail)}.c-ok{color:var(--ok)}
.runs-note{padding:10px 12px;color:var(--panel-dim);font:400 12px/16px var(--font)}
/* canvas */
.cv{flex:1;min-width:0;position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(circle,var(--dots) 1px,transparent 1.3px);background-size:22px 22px;cursor:grab;touch-action:none}
.cv.pan{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.world svg.edges{position:absolute;left:-2000px;top:-300px;width:5000px;height:5000px;overflow:visible;pointer-events:none}
.edges path{fill:none;stroke-width:2;stroke:var(--wire);transition:stroke .2s}
.edges path.run{stroke:var(--wire-running)}.edges path.fail{stroke:var(--wire-failed)}.edges path.dim{stroke-dasharray:6 5;opacity:.7}
.edges path.hl{stroke:#8a847c}.edges path.run.hl{stroke:#a5b4fc}
.chan{position:absolute;transform:translate(-50%,-50%);border:1px solid var(--border);background:var(--card);border-radius:6px;padding:2px 6px;font:500 11px/1.4 var(--font);color:var(--muted-fg);box-shadow:0 1px 2px rgba(0,0,0,.05);white-space:nowrap;pointer-events:none}
.chan.fail{color:var(--fail);border-color:rgba(239,68,68,.35)}
/* nodes */
.node{position:absolute;width:280px;background:var(--card);border-radius:16px;box-shadow:var(--node-shadow),0 0 0 1px var(--node-outline);color:var(--fg);text-align:left;cursor:pointer;transition:box-shadow .2s}
.node.wide{width:320px}
.node .clip{border-radius:16px;overflow:hidden}
.node.selected{box-shadow:0 0 0 2px var(--running-bg),0 0 0 6px var(--sel-ring)}
.node.dim{opacity:.7}
.node:hover:not(.selected){box-shadow:var(--node-shadow),0 0 0 1px rgba(255,255,255,.2)}
.node .head{padding:14px 14px 12px;display:flex;gap:10px;align-items:flex-start}
.node .icon{margin-top:2px;width:28px;height:28px;flex:none;border-radius:6px;background:var(--muted);border:1px solid var(--node-icon-border);display:flex;align-items:center;justify-content:center;color:var(--fg);opacity:.9}
.node .icon svg{width:16px;height:16px}
.node .title{font:600 14px/1.375 var(--font);letter-spacing:-.015em}
.node .sub{font:400 12px/1.375 var(--font);color:var(--muted-fg);margin-top:2px}
.steps{list-style:none;margin:0;padding:10px 14px;border-top:1px solid color-mix(in oklab,var(--border) 70%,transparent);background:color-mix(in oklab,var(--muted) 30%,transparent)}
.steps li{display:flex;align-items:center;gap:8px;min-height:28px;padding:6px 6px;margin:0 -6px;border-bottom:1px solid color-mix(in oklab,var(--border) 50%,transparent);border-radius:6px;position:relative}
.steps li:last-child{border-bottom:0}
.steps li:hover{background:rgba(255,255,255,.05)}
.steps li.cur{background:rgba(59,130,246,.12);border-bottom-color:transparent}
.steps li.sel{box-shadow:inset 0 0 0 1px rgba(96,165,250,.7)}
.steps .n{width:16px;height:16px;border-radius:50%;background:var(--muted);color:var(--muted-fg);font:600 11px/16px var(--font);text-align:center;font-variant-numeric:tabular-nums;flex:none}
.steps li.done .n{background:rgba(16,185,129,.2);color:#6ee7b7}
.steps li.cur .n{background:#2563eb;color:#fff}
.steps li.unres .n,.steps li.canc .n{background:#3a3833;color:#d6d3d1}
.steps li.wait .n{background:rgba(245,158,11,.25);color:#fcd34d}.steps li.took .n{background:rgba(139,92,246,.25);color:#c4b5fd}
.steps li.failed .n{background:rgba(239,68,68,.25);color:#fca5a5}
.steps .t{font:500 12px/16px var(--font);flex:1;min-width:0}
.steps .t small{display:block;font:400 11px/14px var(--font);color:var(--muted-fg);margin-top:1px}
.steps li.cur .t{color:#dbeafe}
.steps .sg{width:14px;height:14px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.steps .kd{width:13px;height:13px;stroke:var(--muted-fg);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.steps .try{font:500 11px/14px var(--font);color:#93c5fd;white-space:nowrap}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid;font:500 11px/16.5px var(--font)}
.foot .l{display:inline-flex;align-items:center;gap:6px}
.foot .r{max-width:60%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums;opacity:.8}
.g{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.g svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.gi{width:14px;height:14px;flex:none;fill:none;stroke-width:1.75}
.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.s-passed{border-color:rgba(16,185,129,.2);background:rgba(16,185,129,.1);color:#6ee7b7}
.s-failed{border-color:rgba(239,68,68,.2);background:rgba(239,68,68,.1);color:#fca5a5}
.s-running{border-color:rgba(59,130,246,.2);background:rgba(59,130,246,.1);color:#93c5fd}
.s-wait{border-color:var(--attn-border);background:var(--attn-bg);color:var(--attn)}.s-took{border-color:rgba(139,92,246,.25);background:rgba(139,92,246,.1);color:#c4b5fd}
.s-unres,.s-canc{border-color:var(--border);background:var(--muted);color:#d1d5db}
.s-pending{border-color:var(--border);background:var(--muted);color:var(--muted-fg)}
.port{position:absolute;width:10px;height:10px;border-radius:3px;border:1px solid var(--handle-border);background:var(--card);z-index:11}
.port.t{top:-5px;left:50%;margin-left:-5px}.port.b{bottom:-5px;left:50%;margin-left:-5px}.port.r{right:-5px;top:50%;margin-top:-5px}.port.l{left:-5px;top:50%;margin-top:-5px}
.node:hover .port{border-color:var(--handle-hover)}
/* zoom pill + minimap */
.zoom{position:absolute;left:16px;bottom:16px;display:inline-flex;align-items:center;gap:2px;height:28px;padding:2px;border-radius:6px;background:#2e3138;box-shadow:0 0 0 1px rgba(75,85,99,.7);color:#f3f4f6;font:500 12px/1 var(--font);z-index:20;cursor:default}
.zoom button{width:24px;height:24px;border:0;background:none;color:inherit;border-radius:4px;display:flex;align-items:center;justify-content:center}
.zoom button:hover{background:rgba(255,255,255,.1)}
.zoom button svg{width:14px;height:14px}
.zoom span{padding:0 6px;font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
.mini{position:absolute;right:16px;bottom:16px;width:168px;z-index:20;cursor:default}
.mini .box{height:132px;border-radius:8px;background:var(--card-warm);border:1px solid var(--border);position:relative;overflow:hidden}
.mini .box i{position:absolute;display:block;border-radius:2px;background:#464a53}
.mini .box i.d{background:#2f7a5c}.mini .box i.a{background:#3b82f6}.mini .box i.w{background:#b45309}.mini .box i.t{background:#7c3aed}.mini .box i.u,.mini .box i.c{background:#8a8578}.mini .box i.f{background:#dc2626}.mini .box i.s{outline:1px solid #fff}
.mini .vp{position:absolute;border:1.5px solid #f3f4f6;border-radius:2px;background:rgba(255,255,255,.06);pointer-events:none}
.mini .cap{font:500 11px/16px var(--font);color:var(--muted-fg);margin-top:4px;text-align:right}
/* inspector */
.insp{width:480px;flex:none;background:var(--card-warm);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;font-size:13px;line-height:19.5px;letter-spacing:-.01em}
.insp.hide{display:none}
.sb-chrome{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-bottom:1px solid var(--panel-line);flex:none}
.icbtn{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted-fg);background:none;border:0}
.icbtn:hover{background:rgba(255,255,255,.06);color:var(--fg)}
.insp-scroll{overflow:auto;flex:1;min-height:0}
.run-head{padding:16px;border-bottom:1px solid var(--panel-line);background:var(--panel)}
.run-head .l1{display:flex;align-items:center;gap:8px}
.run-head h2{margin:0;font:600 16px/1.25 var(--font);letter-spacing:0;color:var(--panel-fg);flex:1;min-width:0}
.run-head .sub{margin-top:6px;font:400 12px/16px var(--font);color:var(--panel-muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.run-head .sub i{color:#464a53;font-style:normal}
.kind{display:inline-flex;align-items:center;gap:4px;border-radius:999px;border:1px solid var(--tl-border);padding:1px 8px;font:500 11px/16px var(--font);color:#d1d5db}
.kind svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.run-head .acts{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.why{margin:12px;padding:12px 14px;border-radius:8px;background:#17191c;border:1px solid var(--tl-border)}
.why .lb,.sec .lb{font:600 11px/16px var(--font);text-transform:uppercase;letter-spacing:.025em;color:var(--panel-dim)}
.why p{margin:4px 0 0;font:400 14px/21px var(--font);color:var(--panel-fg);letter-spacing:-.005em}
.sec{padding:4px 12px 12px}
.sec .lb{padding:0 4px 6px;display:block}
.tl{border:1px solid var(--tl-border);border-radius:8px;background:#17191c;overflow:hidden}
.li{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-bottom:1px solid var(--tl-border);font:400 13px/19.5px var(--font);color:#e3e5e8}
.li:last-child{border-bottom:0}
.li .gl{margin-top:3px;width:14px;height:14px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.li .tx{flex:1;min-width:0}
.li .tx small{display:block;color:var(--panel-muted);font:400 12px/16px var(--font)}
.li .st{font:500 12px/16px var(--font);color:var(--panel-muted);white-space:nowrap;margin-top:2px}
.runrow{display:flex;gap:12px;padding:10px 12px;border-bottom:1px solid var(--tl-border)}
.runrow:last-child{border-bottom:0}
.dotcol{display:flex;flex-direction:column;align-items:center;width:14px;flex:none;padding-top:4px}
.dotcol b{width:10px;height:10px;border-radius:50%;background:#464a53;display:block}
.dotcol b.d{background:#10b981}.dotcol b.a{background:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.25);animation:pulse 1.6s ease-in-out infinite}.dotcol b.n{background:#8a8578}.dotcol b.f{background:#ef4444}
@keyframes pulse{50%{opacity:.55}}
.runrow .tx{flex:1;min-width:0}
.runrow .tt{font:500 13px/19.5px var(--font);color:var(--panel-fg)}
.runrow .tt em{font-style:normal;color:var(--panel-muted);font-weight:400}
.runrow small{display:block;font:400 12px/17px var(--font);color:var(--panel-muted)}
.bar{height:6px;border-radius:3px;background:#2e3138;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:#60a5fa;border-radius:3px}
.err{border:1px solid rgba(127,29,29,.7);background:rgba(69,10,10,.3);border-radius:8px;margin:0 12px 12px;color:#fca5a5}
.err.neutral{border-color:var(--tl-border);background:#17191c;color:#e3e5e8}.err.neutral .h{color:#d6d3d1;border-color:var(--tl-border)}.err.neutral .b small{color:var(--panel-muted)}
.err .h{display:flex;align-items:center;gap:6px;padding:6px 12px;font:600 11px/16px var(--font);text-transform:uppercase;letter-spacing:.025em;color:#f87171;border-bottom:1px solid rgba(127,29,29,.7)}
.err .h svg{width:14px;height:14px}
.err .b{padding:10px 12px;font:500 13px/19.5px var(--font)}
.err .b small{display:block;margin-top:4px;color:#fca5a5;opacity:.8;font:400 12px/17px var(--font)}
.next{padding:4px 12px 12px}
.next .opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--tl-border);border-radius:8px;background:#17191c;margin-bottom:8px}
.next .opt .tx{flex:1;min-width:0}.next .opt .tx b{font-weight:500;color:var(--panel-fg);display:block}.next .opt .tx small{color:var(--panel-muted);font:400 12px/16px var(--font)}
details.dt{margin:0 12px 12px;border:1px solid var(--tl-border);border-radius:8px;background:#17191c;overflow:hidden}
details.dt summary{list-style:none;display:flex;align-items:center;gap:6px;padding:6px 12px;font:600 11px/16px var(--font);text-transform:uppercase;letter-spacing:.025em;color:var(--panel-dim);cursor:pointer}
details.dt summary::-webkit-details-marker{display:none}
details.dt summary svg{width:14px;height:14px;transition:transform .15s}
details.dt[open] summary svg{transform:rotate(90deg)}
details.dt[open] summary{border-bottom:1px solid var(--tl-border)}
details.dt pre{margin:0;padding:10px 12px;font:400 12px/18px var(--mono);color:#e3e5e8;white-space:pre-wrap;word-break:break-word}
.jk{color:#93c5fd}.js{color:#86efac}.jn{color:#fcd34d}
kbd{font:500 11px/16px var(--font);border:1px solid var(--tl-border);border-radius:4px;padding:0 4px;color:var(--panel-muted)}
.hint{padding:8px 16px 14px;color:var(--panel-dim);font:400 12px/16px var(--font)}
/* annotations */
body.ann [data-gap]{outline:1px dashed var(--gap);outline-offset:2px;position:relative}
body.ann [data-gap]::after{content:attr(data-gap);position:absolute;left:0;top:-9px;background:var(--gap);color:#1b1913;font:600 11px/13px var(--font);padding:0 4px;border-radius:3px;white-space:nowrap;z-index:40;pointer-events:none}
body.ann .mini[data-gap]{position:absolute}
body.ann .edges g[data-gap] path{stroke-dasharray:3 3;filter:drop-shadow(0 0 2px var(--gap))}
body.ann .edges g[data-gap] path{stroke:var(--gap)}
body.ann .steps li[data-gap]{outline-offset:-1px}
/* narrow */
@media (max-width:1199px){
  .insp{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);z-index:30;box-shadow:-8px 0 24px rgba(0,0,0,.35)}
  .mini{right:16px}
  body.insp-open .mini{display:none}
}
@media (max-width:1099px){
  .runs{position:absolute;left:0;top:0;bottom:0;z-index:35;display:none;width:300px}
  .runs.open{display:flex}
  .runsbtn{display:inline-flex}
  .hdr .crumb{display:none}
  .hdr .opt-r{display:none}
}
/* aw-frame: the shared top bar and Annotations toggle, copied from workflows.html */
.top,.hdr{height:56px;padding:0 16px;gap:16px}
.top .crumb b,.hdr h1{font:600 22px/33px var(--font);letter-spacing:-.02em;color:var(--fg)}
#annTog,#annBtn{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0;border:0;border-radius:0;background:none;color:var(--muted-fg);font:500 12px/1 var(--font);cursor:pointer;user-select:none}
#annTog i,#annBtn i,#annBtn .sw{display:block;width:28px;height:16px;border-radius:8px;border:0;background:var(--seg);position:relative;transition:background .2s}
#annTog i::after,#annBtn i::after,#annBtn .sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--muted-fg);transition:transform .2s}
#annTog[aria-pressed=true] i,#annBtn[aria-pressed=true] i,#annBtn[aria-pressed=true] .sw{background:#f59e0b}
#annTog[aria-pressed=true] i::after,#annBtn[aria-pressed=true] i::after,#annBtn[aria-pressed=true] .sw::after{left:2px;transform:translateX(12px);background:#1a1200}
@media (max-width:1100px){.hdr .crumb,.hdr .meta{display:none}.hdr h1{min-width:120px}}
