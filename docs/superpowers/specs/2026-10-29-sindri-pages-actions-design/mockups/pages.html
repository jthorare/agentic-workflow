<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pages and actions mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<!--
  Sindri named pages and actions mockups (spec 2026-10-29-sindri-pages-actions-design.md §0, §3.4, §3.5, §3.6, §5; phase P2m "mockup first").
  Static: no production code. Tokens and sheet styles are the concept pins mockup's (same app).
  Query: s=section|sheet|accept|none|today · v=a|b|c
  Every visible product string is a literal text of the spec. Page, action, concept and file names are a sample web app's
  (the spec's own scheduling example). The small grey captions (mockup · ...) are annotations, not UI.
-->
<style>
:root {
  --canvas:#010102; --s1:#0f1011; --s2:#141516; --s3:#18191a; --s4:#191a1b;
  --hair:#23252a; --hair2:#34343a; --hair3:#3e3e44;
  --ink:#f7f8f8; --muted:#d0d6e0; --subtle:#8a8f98; --tert:#62666d;
  --primary:#5e6ad2; --primarySoft:#1d2036; --onPrimary:#fff;
  --success:#27a644; --attention:#f2994a; --error:#eb5757;
  --attentionSoft:#23160c; --errorSoft:#220d0e;
  --xxs:4px; --xs:8px; --sm:12px; --md:16px; --lg:24px; --xl:32px;
  --rxs:4px; --rsm:6px; --rmd:8px; --rlg:12px;
  --topbar:48px; --strip:26px; --sheet:520px; --control:30px;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { background:var(--canvas); color:var(--ink); font:13px/1.45 Inter, system-ui, sans-serif; overflow:hidden; }
.mono { font-family:"JetBrains Mono", Menlo, monospace; font-size:12px; }
.top { height:var(--topbar); display:flex; align-items:center; gap:var(--sm); padding:0 var(--md); border-bottom:1px solid var(--hair); }
.brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:13px; margin-right:2px; }
.brand i { color:#5e6ad2; font-style:normal; font-size:15px; }
.tabs { display:flex; gap:2px; padding:2px; border:1px solid var(--hair2); border-radius:var(--rmd); background:var(--s1); }
.tab { height:26px; padding:0 8px; display:flex; align-items:center; gap:5px; border-radius:var(--rsm); color:var(--subtle); white-space:nowrap; }
.tab .c { color:var(--tert); font-size:12px; }
.tab.on { color:var(--ink); background:var(--s3); }
.top .grow { flex:1; }
.search { height:30px; width:300px; min-width:0; flex:0 1 300px; display:flex; align-items:center; gap:8px; padding:0 var(--sm); border:1px solid var(--hair2); border-radius:var(--rmd); background:var(--s1); color:var(--subtle); white-space:nowrap; overflow:hidden; }
.search .k { margin-left:auto; font-size:11px; }
.health { height:30px; display:flex; align-items:center; gap:8px; padding:0 var(--sm); border:1px solid var(--hair2); border-radius:999px; background:var(--s1); white-space:nowrap; }
.health b { font-weight:600; } .health span { color:var(--subtle); font-size:12px; } .health .ok { color:var(--success); }
.body { position:absolute; top:var(--topbar); left:0; right:0; bottom:var(--strip); display:flex; }
.page { flex:1; min-width:0; overflow:hidden; padding:var(--lg) var(--lg) var(--xl); }
.head { display:flex; align-items:flex-start; gap:var(--md); margin-bottom:var(--md); }
.head h1 { font-size:20px; font-weight:600; margin:0 0 var(--xxs); letter-spacing:-0.01em; }
.head .grow { flex:1; min-width:0; }
.cov { color:var(--subtle); font-size:12px; }
.link { color:#aab1f0; text-decoration:underline; text-underline-offset:2px; }
.btn { height:var(--control); padding:0 var(--sm); border-radius:var(--rmd); border:1px solid var(--hair2); background:var(--s2); color:var(--ink); display:inline-flex; align-items:center; gap:6px; font:500 13px Inter, sans-serif; white-space:nowrap; }
.btn.primary { background:var(--ink); color:#000; border-color:var(--ink); }
.btn.sm { height:26px; font-size:12px; padding:0 10px; }
.btn.danger { color:var(--error); }
.btn.ghost { background:transparent; border-color:transparent; color:var(--subtle); }
.chip { display:inline-flex; align-items:center; height:18px; padding:0 6px; border-radius:var(--rxs); border:1px solid var(--hair2); color:var(--subtle); font-size:11px; white-space:nowrap; }
.chip.mine { color:#a78bfa; border-color:#3a2d5c; }
.chip.attn { color:var(--attention); border-color:#5a3a1a; background:var(--attentionSoft); }
.chip.nocode { color:var(--tert); border-style:dashed; }
.cap { color:var(--tert); font:11px "JetBrains Mono", monospace; margin:0 0 6px; }

/* background concept cards */
.cgrid { display:grid; gap:var(--sm); }
.card { background:var(--s1); border:1px solid var(--hair); border-radius:var(--rlg); min-width:0; display:flex; flex-direction:column; overflow:hidden; }
.card .in { padding:var(--md); flex:1; }
.card .r1 { display:flex; gap:var(--xs); align-items:center; }
.card .name { font-weight:600; font-size:14px; flex:1; min-width:0; }
.card .size { color:var(--muted); font-size:12px; margin-top:6px; }
.card .new { color:#aab1f0; font-size:12px; margin-top:6px; }
.card.derived { border-style:dashed; }

/* drill / sheet */
.drill { flex:none; background:var(--s2); border-left:1px solid var(--hair2); padding:var(--lg); overflow:hidden; display:flex; flex-direction:column; gap:var(--sm); }
.sheet { flex:none; background:var(--s2); border-left:1px solid var(--hair2); padding:var(--lg); overflow:hidden; display:flex; flex-direction:column; gap:var(--sm); width:var(--sheet); }
.cover { position:absolute; right:0; top:0; bottom:0; box-shadow:-24px 0 48px rgba(0,0,0,.6); }
.scrim { position:absolute; inset:0; background:rgba(0,0,0,.5); }
h2 { font-size:18px; font-weight:600; margin:0; }
h3 { font-size:13px; font-weight:600; margin:0; color:var(--muted); }
.x { margin-left:auto; color:var(--tert); font-size:12px; }
.fl { color:var(--muted); font-weight:500; font-size:12px; margin-bottom:4px; }
.hint { color:var(--subtle); font-size:12px; margin-top:4px; }
.hint.warn { color:var(--attention); }
.input { min-height:var(--control); border:1px solid var(--hair2); background:var(--s1); border-radius:var(--rmd); display:flex; align-items:center; padding:0 var(--sm); color:var(--ink); min-width:0; }
.input.focus { border-color:var(--primary); }
.input.sm { min-height:26px; font-size:12px; }
.fromMap { display:flex; align-items:center; gap:var(--xs); color:var(--subtle); font-size:12px; }
.fromMap .mono { color:var(--subtle); }
.row { display:flex; align-items:center; gap:var(--xs); padding:6px 0; border-top:1px solid var(--hair); min-width:0; }
.row:first-child { border-top:0; }
.row .t { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .n { color:var(--subtle); font-size:12px; white-space:nowrap; }
.cb { width:16px; height:16px; border-radius:4px; border:1px solid var(--hair3); flex:none; display:grid; place-items:center; font-size:11px; line-height:1; }
.cb.on { background:var(--primary); border-color:var(--primary); color:#fff; }
.tk { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); white-space:nowrap; }
.sec { border:1px solid var(--hair); border-radius:var(--rmd); background:var(--s1); }
.sec > .sh { padding:var(--xs) var(--sm); display:flex; align-items:center; gap:var(--xs); color:var(--muted); font-weight:500; border-bottom:1px solid var(--hair); }
.sec > .sh .n { margin-left:auto; color:var(--subtle); font-weight:400; font-size:12px; }
.sec > .sb { padding:var(--xs) var(--sm); }
.foot { margin-top:auto; display:flex; gap:var(--xs); align-items:center; flex-wrap:wrap; }
.fold { color:var(--subtle); display:flex; align-items:center; gap:var(--xs); padding:6px 0; border-top:1px solid var(--hair); font-size:12px; }
.fold b { color:var(--muted); font-weight:500; }

/* section rows */
.pg { padding:var(--sm) 0; border-top:1px solid var(--hair); }
.pg:first-child { border-top:0; }
.pg .ph { display:flex; align-items:center; gap:var(--xs); flex-wrap:wrap; }
.pg .pn { font-weight:600; }
.pg .key { color:var(--tert); font:11px "JetBrains Mono", monospace; }
.pg .why { color:var(--subtle); font-size:12px; }
.act { color:var(--muted); font-size:12px; padding:3px 0 3px var(--md); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.act .an { color:var(--ink); text-decoration:underline; text-decoration-color:var(--hair3); text-underline-offset:2px; }
.act .nc { color:var(--tert); }
.pcards { display:grid; gap:var(--sm); }
.pcard { background:var(--s1); border:1px solid var(--hair); border-radius:var(--rlg); padding:var(--sm) var(--md); min-width:0; display:flex; flex-direction:column; gap:4px; }
.pcard.sug { border-style:dashed; }
.pcard .act { padding-left:0; }
.pcard .pf { display:flex; gap:var(--xs); align-items:center; margin-top:6px; }
table.t { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; }
table.t th { text-align:left; color:var(--subtle); font-weight:500; padding:6px var(--xs); border-bottom:1px solid var(--hair2); white-space:nowrap; }
table.t td { padding:6px var(--xs); border-bottom:1px solid var(--hair); vertical-align:top; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
table.t td.c { text-align:center; }
.rc { border:1px solid var(--hair); border-radius:var(--rmd); background:var(--s1); padding:var(--sm); display:flex; gap:var(--sm); min-width:0; }
.rc.dim { opacity:.72; }
.rc.open { border-color:var(--primary); }
.rc .main { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
.sub { color:var(--subtle); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dlg { background:var(--s2); border:1px solid var(--hair2); border-radius:var(--rlg); padding:var(--lg); display:flex; flex-direction:column; gap:var(--sm); overflow:hidden; }
.empty { color:var(--subtle); padding:var(--md) 0; }
.crumb { color:var(--subtle); font-size:12px; margin-bottom:var(--xs); }
.mstrip { position:fixed; left:0; right:0; bottom:0; height:var(--strip); display:flex; align-items:center; gap:12px; padding:0 12px; background:var(--s4); border-top:1px solid var(--hair2); font:10px "JetBrains Mono", monospace; color:var(--tert); z-index:9; }
.mstrip .grow { flex:1; }
.switch { display:flex; gap:4px; font:11px "JetBrains Mono", monospace; }
.switch a { color:var(--subtle); text-decoration:none; padding:1px 6px; border:1px solid var(--hair2); border-radius:4px; background:var(--s1); }
.switch a.on { color:var(--ink); border-color:var(--primary); }
.switch .sep { width:8px; }
</style>
</head>
<body>
<div class="top" id="top"></div>
<div class="body" id="body"></div>
<script>
const q = new URLSearchParams(location.search);
const S = q.get('s') || 'section', V = q.get('v') || 'a';
const W = innerWidth;
const tabs = [['Home'],['Projects'],['Workflows','0'],['Work','0'],['Workflow types'],['Context'],['Agents','2'],['System']];
document.getElementById('top').innerHTML = '<div class="brand"><i>◆</i>Sindri</div><div class="tabs">' + tabs.map(t => `<div class="tab${t[0] === 'Context' ? ' on' : ''}">${t[0]}${t[1] ? `<span class="c">${t[1]}</span>` : ''}</div>`).join('') + '</div><div class="grow"></div><div class="search">⌕ Search or run a command<span class="k">⌘K</span></div><div class="health"><span class="ok">✓</span><b>Healthy</b><span>updated 3s ago</span></div>';

const tick = on => `<span class="cb${on ? ' on' : ''}">${on ? '✓' : ''}</span>`;
const chip = (t, c) => `<span class="chip ${c || ''}">${t}</span>`;
const MINE = chip('Set by a person', 'mine'), SUG = chip('Suggested'), WAIT = chip('Waiting for approval', 'attn');
const codeChip = has => has ? chip('Code found') : chip('No code found yet', 'nocode');

/* ---------------- sample data: a small scheduling web app (the spec's own example) ---------------- */
// Pages under the concept Self-scheduling, in the section's order: owner pages in profile order, then suggested by number of actions.
const pages = [
  { name:'Time-off request', key:'TimeOffDialog', mine:true, code:true, acts:[
      { n:'Send a request', also:'Approval workflow', dec:1, code:'TimeOffDialog.tsx' },
      { n:'Pick dates', code:'DateRange.tsx' } ] },
  { name:'Shift swap', key:'GET /swaps/new', mine:true, wait:true, code:true, acts:[
      { n:'Request a swap', also:'Approval workflow' },
      { n:'Cancel a swap', code:'SwapRow.tsx' } ] },
  { name:'Schedule week', key:'GET /schedule/week', code:true, acts:[
      { n:'Submit schedule', also:'Approval workflow', dec:2, code:'SubmitButton.tsx' },
      { n:'Copy last week', code:'WeekToolbar.tsx' },
      { n:'Publish week', also:'Approval workflow', code:'PublishButton.tsx' },
      { n:'Clear day', code:'DayColumn.tsx' } ] },
  { name:'Availability', key:'GET /availability', code:true, acts:[
      { n:'Save availability', code:'AvailabilityForm.tsx' },
      { n:'Copy last week', code:'AvailabilityPage.tsx' },
      { n:'Mark unavailable', dec:1, code:'DayRow.tsx' } ] },
  { name:'Open shifts', key:'GET /shifts/open', code:true, acts:[
      { n:'Claim shift', also:'Approval workflow', code:'ClaimButton.tsx' },
      { n:'Hide shift', code:'ShiftCard.tsx' } ] },
  { name:'Schedule week', key:'ScheduleWeekPage', code:true, acts:[
      { n:'Print week', code:'ScheduleWeekPage.tsx' },
      { n:'Show totals', code:'ScheduleWeekPage.tsx' } ] },
];
const MORE_SUG = 10;   // suggested pages below the fold: 4 drawn + 10 = Accept all suggested (14)
const actRow = (a, page) => {
  const bits = [`<span class="an">${a.n}</span>`, `on ${page}`];
  if (a.also) bits.push(`also in ${a.also}`);
  if (a.dec) bits.push(`${a.dec} decision${a.dec > 1 ? 's' : ''}`);
  bits.push(a.code ? `code: ${a.code}` : '<span class="nc">No code found yet</span>');
  return bits.join(' · ');
};
const pageBtn = p => p.mine ? '<span class="btn sm">Edit page</span>' : '<span class="btn sm primary">Name this page</span>';
const marks = p => (p.mine ? MINE : SUG) + (p.wait ? WAIT : '') + codeChip(p.code);

/* ---------------- the Context page behind the drill ---------------- */
function head(withNone) {
  return `<div class="head"><div class="grow"><h1>Context</h1><div class="cov">You've pinned 120 of 300 features and 410 of 2,300 records. The rest are in suggestions or in no concept.${withNone ? ` <span class="link">Pages in no concept (12)</span>` : ''}</div></div>
    <span class="btn">Add several</span><span class="btn primary">New pin</span></div>`;
}
function behind(cols, dim) {
  const c = (n, mine, extra) => `<div class="card${mine ? '' : ' derived'}"><div class="in"><div class="r1"><span class="name">${n}</span>${mine ? MINE : SUG}</div><div class="size">3 features · 5 records · 2 decisions · 41 code files</div>${extra || ''}</div></div>`;
  return `<div class="page"${dim ? ' style="opacity:.55"' : ''}>${head(true)}<div class="cap">mockup · concept cards (sample names)</div><div class="cgrid" style="grid-template-columns:repeat(${cols},1fr)">
    ${c('Self-scheduling', true, '<div class="new">2 new suggested pages</div>')}${c('Approval workflow', true)}${c('Time off', false)}${c('Payroll export', false)}${c('Team calendar', false)}${c('Notifications', false)}</div></div>`;
}

/* ---------------- 1. Pages and actions in the concept's Why drill ---------------- */
function drillHead() {
  return `<div style="display:flex;align-items:center;gap:var(--xs)"><h2>Self-scheduling</h2>${MINE}<span class="x">Esc</span></div>
    <div class="cap">mockup · the Why drill: decisions and records first (folded here), then the new section</div>
    <div class="fold"><b>Decisions</b> 3 <span class="grow"></span>▸</div>
    <div class="fold"><b>Records</b> 5 <span class="grow"></span>▸</div>`;
}
const secHead = `<div style="display:flex;align-items:center;gap:var(--xs);border-top:1px solid var(--hair2);padding-top:var(--sm)"><h3>Pages and actions</h3><span class="grow" style="flex:1"></span><span class="btn sm">New page</span><span class="btn sm">Accept all suggested (14)</span></div>`;
function sectionA(list) {  // grouped list: page line, its actions under it
  return list.map(p => `<div class="pg"><div class="ph"><span class="pn">${p.name}</span>${marks(p)}<span class="grow" style="flex:1"></span>${pageBtn(p)}</div>
    <div class="key">From the map: ${p.key}${p.mine ? '' : ' · <span class="why">code in Self-scheduling</span>'}</div>
    ${p.acts.map(a => `<div class="act">${actRow(a, p.name)}</div>`).join('')}</div>`).join('');
}
function sectionB(list, cols) {  // page cards
  return `<div class="pcards" style="grid-template-columns:repeat(${cols},1fr)">${list.map(p => `<div class="pcard${p.mine ? '' : ' sug'}">
    <div style="display:flex;gap:var(--xs);align-items:center"><span style="font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</span>${p.mine ? MINE : SUG}</div>
    <div class="key mono" style="color:var(--tert);font-size:11px">${p.key}</div>
    ${p.acts.map(a => `<div class="act">${actRow(a, p.name)}</div>`).join('')}
    <div class="pf">${p.wait ? WAIT : ''}${codeChip(p.code)}<span style="flex:1"></span>${pageBtn(p)}</div></div>`).join('')}</div>`;
}
function sectionC(list) {  // one row per action, the spec's row text as is
  const rows = [];
  list.forEach(p => p.acts.forEach((a, i) => rows.push(`<div class="row"><div class="t act" style="padding:0">${actRow(a, p.name)}</div>${i === 0 ? (p.mine ? MINE : SUG) + (p.wait ? WAIT : '') : '<span class="chip" style="visibility:hidden">Suggested</span>'}${i === 0 ? pageBtn(p) : '<span class="btn sm" style="visibility:hidden">Name this page</span>'}</div>`)));
  return `<div class="sec"><div class="sb" style="padding:2px var(--sm)">${rows.join('')}</div></div>`;
}
function sectionPage() {
  const dw = W < 1200 ? W - 40 : 760;
  const covers = W < 1200;
  const list = pages.slice(0, V === 'b' ? 4 : 5);
  const body = V === 'a' ? sectionA(list) : V === 'b' ? sectionB(list, dw > 700 ? 2 : 1) : sectionC(pages.slice(0, 5));
  const foot = `<div class="cap" style="margin-top:var(--xs)">mockup · ${MORE_SUG} more suggested pages below; the list holds 16 (2 set by a person, 14 suggested), under the cap of 20, so no Show all</div>`;
  return behind(covers ? 2 : 2, true) + (covers ? '<div class="scrim"></div>' : '') + `<div class="drill${covers ? ' cover' : ''}" style="width:${dw}px">${drillHead()}${secHead}<div style="overflow:hidden">${body}</div>${foot}</div>`;
}

/* ---------------- 2. The Name this page sheet ---------------- */
const concepts = ['Self-scheduling', 'Approval workflow', 'Time off'];
const sheetActs = [
  { n:'Submit a schedule', map:'Submit schedule', on:[1,1,0], focus:false, renamed:true },
  { n:'Copy last week', map:'Copy last week', on:[1,0,0] },
  { n:'Publish week', map:'Publish week', on:[1,1,0] },
  { n:'Clear day', map:'Clear day', on:[1,0,0] },
  { n:'Request a swap', map:null, on:[1,0,0], added:true },
];
const nameField = `<div><div class="fl">Name</div><div class="input focus">Schedule week</div><div class="hint warn">Another page is called Schedule week</div></div>
  <div class="fromMap"><span>From the map: <span class="mono">GET /schedule/week</span></span><span class="grow" style="flex:1"></span><span class="btn sm ghost">Pick another</span></div>`;
const sheetFoot = `<div class="foot"><span class="btn primary">Save and approve</span><span class="btn">Esc</span></div>`;
const sheetTitle = `<div style="display:flex;align-items:center"><h2>Name this page</h2><span class="x">Esc</span></div>`;
function sheetA() {  // one column: each action a name field with its ticks in a line under it
  return `${sheetTitle}${nameField}<div class="fl" style="margin:4px 0 0">Actions</div>
    ${sheetActs.map((a, i) => `<div style="display:flex;flex-direction:column;gap:4px;padding-bottom:var(--xs);border-bottom:1px solid var(--hair)">
      <div style="display:flex;gap:var(--xs);align-items:center"><div class="input sm" style="flex:1">${a.n}</div><span class="btn sm ghost">Remove</span></div>
      <div style="display:flex;gap:var(--md);flex-wrap:wrap">${concepts.map((c, j) => `<span class="tk">${tick(a.on[j])}${c}</span>`).join('')}</div>
      ${a.map ? `<div class="fromMap">From the map: ${a.map}</div>` : `<div class="fromMap">${chip('No code found yet', 'nocode')}</div>`}</div>`).join('')}
    <div><span class="btn sm">Add an action</span></div>${sheetFoot}`;
}
function sheetB() {  // a bordered block per action, the concepts as a list of ticks
  return `${sheetTitle}${nameField}
    ${sheetActs.slice(0, 3).concat(sheetActs[4]).map((a, i) => `<div class="sec"><div class="sh">Action ${i + 1} of 5<span class="n">${a.map ? 'From the map: ' + a.map : 'No code found yet'}</span></div>
      <div class="sb" style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;gap:var(--xs)"><div class="input sm" style="flex:1">${a.n}</div><span class="btn sm ghost">Remove</span></div>
      ${concepts.slice(0, 2).map((c, j) => `<span class="tk">${tick(a.on[j])}${c}</span>`).join('')}</div></div>`).join('')}
    <div class="cap">mockup · action 4 of 5 (Clear day) is scrolled past</div>
    <div><span class="btn sm">Add an action</span></div>${sheetFoot}`;
}
function sheetC() {  // a grid: actions down, concepts across
  return `${sheetTitle}<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--md);align-items:start">
    <div><div class="fl">Name</div><div class="input focus">Schedule week</div><div class="hint warn">Another page is called Schedule week</div></div>
    <div class="fromMap" style="margin-top:26px"><span>From the map: <span class="mono">GET /schedule/week</span></span><span class="btn sm ghost">Pick another</span></div></div>
    <table class="t"><colgroup><col style="width:34%"><col style="width:22%">${concepts.map(() => '<col>').join('')}<col style="width:70px"></colgroup>
    <thead><tr><th>Action</th><th>From the map</th>${concepts.map(c => `<th style="text-align:center">${c}</th>`).join('')}<th></th></tr></thead>
    <tbody>${sheetActs.map(a => `<tr><td><div class="input sm">${a.n}</div></td><td style="padding-top:11px;color:var(--subtle)">${a.map || '<span class="chip nocode">No code found yet</span>'}</td>${a.on.map(o => `<td class="c" style="padding-top:11px"><span style="display:inline-grid">${tick(o)}</span></td>`).join('')}<td style="padding-top:8px"><span class="btn sm ghost">Remove</span></td></tr>`).join('')}</tbody></table>
    <div><span class="btn sm">Add an action</span></div>${sheetFoot}`;
}
function sheetPage() {
  const w = V === 'c' ? 900 : 520;
  const covers = W < w + 480 || V === 'c' && W < 1400;
  const sh = `<div class="sheet${covers ? ' cover' : ''}" style="width:${covers ? Math.min(w, W - 40) : w}px">${V === 'a' ? sheetA() : V === 'b' ? sheetB() : sheetC()}</div>`;
  return behind(2, true) + (covers ? '<div class="scrim"></div>' : '') + sh;
}

/* ---------------- 3. The Accept all suggested (14) sheet ---------------- */
const sug = [
  { name:'Schedule week', key:'GET /schedule/week', acts:['Submit schedule','Copy last week','Publish week','Clear day'], con:['Self-scheduling','Approval workflow'], on:true },
  { name:'Availability', key:'GET /availability', acts:['Save availability','Copy last week','Mark unavailable'], con:['Self-scheduling'], on:true },
  { name:'Open shifts', key:'GET /shifts/open', acts:['Claim shift','Hide shift'], con:['Self-scheduling','Approval workflow'], on:true },
  { name:'Schedule week', key:'ScheduleWeekPage', acts:['Print week','Show totals'], con:['Self-scheduling'], on:false, note:'Another page is called Schedule week' },
  { name:'Schedule day', key:'GET /schedule/day', acts:['Submit day','Clear day'], con:['Self-scheduling'], on:true },
  { name:'Shift templates', key:'GET /templates', acts:['Save template','Apply template'], con:['Self-scheduling'], on:true },
  { name:'Coverage', key:'CoverageDialog', acts:['Fill gap'], con:['Self-scheduling','Payroll export'], on:false },
  { name:'Break planner', key:'BreakPlannerDialog', acts:['Save breaks'], con:['Self-scheduling'], on:true },
];
const accTitle = `<div style="display:flex;align-items:center"><h2>Accept all suggested (14)</h2><span class="x">Esc</span></div>`;
const accFoot = `<div class="foot"><span class="btn primary">Save all and approve</span><span class="btn">Esc</span><span class="hint" style="margin:0 0 0 auto">mockup · 12 of 14 ticked</span></div>`;
function acceptA() {  // a table, one row per page
  return `${accTitle}<table class="t"><colgroup><col style="width:28px"><col style="width:24%"><col style="width:20%"><col><col style="width:24%"></colgroup>
    <thead><tr><th></th><th>Name</th><th>From the map</th><th>Actions</th><th>Relates to</th></tr></thead>
    <tbody>${sug.map(s => `<tr${s.on ? '' : ' style="opacity:.72"'}><td style="padding-top:10px">${tick(s.on)}</td><td><div class="input sm">${s.name}</div>${s.note ? `<div class="hint warn" style="white-space:normal">${s.note}</div>` : ''}</td><td class="mono" style="padding-top:10px;color:var(--subtle)">${s.key}</td><td style="padding-top:10px;color:var(--muted)">${s.acts.join(' · ')}</td><td style="padding-top:10px;color:var(--muted)">${s.con.join(', ')}</td></tr>`).join('')}</tbody></table>
    <div class="cap">mockup · 6 more rows below</div>${accFoot}`;
}
function acceptB() {  // stacked rows; one row opened into the single-page fields
  const open = 0;
  return `${accTitle}<div style="display:flex;flex-direction:column;gap:var(--xs);overflow:hidden">${sug.slice(0, 6).map((s, i) => i === open ? `<div class="rc open">${tick(true)}<div class="main">
      <div class="input sm focus">${s.name}</div><div class="fromMap">From the map: <span class="mono">${s.key}</span></div>
      ${sheetActs.slice(0, 4).map(a => `<div style="display:flex;gap:var(--md);align-items:center;padding:3px 0;border-top:1px solid var(--hair)"><span style="flex:1;min-width:0;color:var(--ink);font-size:12px">${a.map}</span>${concepts.slice(0, 2).map((c, j) => `<span class="tk">${tick(a.on[j])}${c}</span>`).join('')}</div>`).join('')}
    </div></div>` : `<div class="rc${s.on ? '' : ' dim'}">${tick(s.on)}<div class="main"><div style="display:flex;gap:var(--xs);align-items:center"><span style="font-weight:600">${s.name}</span><span class="mono" style="color:var(--tert);font-size:11px">${s.key}</span><span class="grow" style="flex:1"></span><span style="color:var(--tert)">▸</span></div>
      <div class="sub">${s.acts.join(' · ')} · relates to ${s.con.join(', ')}</div>${s.note ? `<div class="hint warn" style="margin:0">${s.note}</div>` : ''}</div></div>`).join('')}</div>
    <div class="cap">mockup · 8 more rows below</div>${accFoot}`;
}
function acceptC() {  // two panes: the list left, the picked page's fields right
  return `${accTitle}<div style="display:grid;grid-template-columns:${W < 1100 ? '1fr 1.2fr' : '1fr 1.3fr'};gap:var(--md);min-height:0;flex:1">
    <div class="sec" style="overflow:hidden"><div class="sb" style="padding:2px var(--sm)">${sug.map((s, i) => `<div class="row"${i === 0 ? ' style="background:var(--primarySoft);margin:0 calc(-1 * var(--sm));padding:6px var(--sm)"' : s.on ? '' : ' style="opacity:.72"'}>${tick(s.on)}<div class="t"><div>${s.name}</div><div class="sub">${s.acts.length} actions · ${s.con.join(', ')}</div></div></div>`).join('')}</div></div>
    <div style="display:flex;flex-direction:column;gap:var(--sm);min-width:0">${nameField.replace(' focus', '')}
      ${sheetActs.slice(0, 4).map(a => `<div style="display:flex;flex-direction:column;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--hair)"><div class="input sm">${a.map}</div><div style="display:flex;gap:var(--md);flex-wrap:wrap">${concepts.map((c, j) => `<span class="tk">${tick(a.on[j])}${c}</span>`).join('')}</div></div>`).join('')}</div></div>
    ${accFoot}`;
}
function acceptPage() {
  const w = V === 'a' ? Math.min(W - 40, 1000) : V === 'b' ? 520 : Math.min(W - 40, 1000);
  const inner = V === 'a' ? acceptA() : V === 'b' ? acceptB() : acceptC();
  if (V === 'b') {
    const covers = W < 1000;
    return behind(2, true) + (covers ? '<div class="scrim"></div>' : '') + `<div class="sheet${covers ? ' cover' : ''}" style="width:${w}px">${inner}</div>`;
  }
  return behind(3, true) + '<div class="scrim"></div>' + `<div class="dlg" style="position:absolute;top:var(--md);bottom:var(--md);left:50%;transform:translateX(-50%);width:${w}px">${inner}</div>`;
}

/* ---------------- 4. Pages in no concept ---------------- */
const loose = [
  { name:'Settings', key:'GET /settings', code:true, acts:[{ n:'Save settings', code:'SettingsForm.tsx' }] },
  { name:'Login', key:'GET /login', code:true, acts:[{ n:'Sign in', code:'LoginForm.tsx' }, { n:'Reset password', code:'ResetLink.tsx' }] },
  { name:'Profile', key:'GET /profile', code:true, acts:[{ n:'Save profile', code:'ProfileForm.tsx' }] },
  { name:'Invite', key:'InviteDialog', code:true, acts:[{ n:'Send invite', code:'InviteDialog.tsx' }] },
  { name:'Help', key:'GET /help', code:true, acts:[] },
];
const looseRows = list => list.map(p => `<div class="pg"><div class="ph"><span class="pn">${p.name}</span>${SUG}${codeChip(p.code)}<span class="grow" style="flex:1"></span><span class="btn sm primary">Name this page</span></div>
  <div class="key">From the map: ${p.key}</div>${p.acts.map(a => `<div class="act">${actRow(a, p.name)}</div>`).join('')}</div>`).join('');
const looseHead = `<div style="display:flex;align-items:center;gap:var(--xs)"><h3>Pages in no concept (12)</h3><span class="grow" style="flex:1"></span><span class="btn sm">Accept all suggested (12)</span></div>`;
function nonePage() {
  if (V === 'a') {  // the head link opens a sheet with the section
    const covers = W < 1000;
    return behind(2, true) + (covers ? '<div class="scrim"></div>' : '') + `<div class="sheet${covers ? ' cover' : ''}"><div style="display:flex;align-items:center"><h2>Pages in no concept (12)</h2><span class="x">Esc</span></div>
      <div style="display:flex;gap:var(--xs)"><span class="btn sm">Accept all suggested (12)</span></div><div style="overflow:hidden">${looseRows(loose)}</div><div class="cap">mockup · 7 more below</div></div>`;
  }
  if (V === 'b') {  // the link swaps the cards for the list, with a way back
    return `<div class="page"><div class="crumb"><span class="link">Context</span> › Pages in no concept</div>
      <div class="head"><div class="grow"><h1>Pages in no concept (12)</h1></div><span class="btn">New page</span><span class="btn primary">Accept all suggested (12)</span></div>
      <div class="sec" style="max-width:980px"><div class="sb">${looseRows(loose)}</div></div><div class="cap" style="margin-top:var(--xs)">mockup · 7 more below</div></div>`;
  }
  // C: a fold under the head, open, over the concept cards
  const cols = W < 1100 ? 2 : 3;
  return `<div class="page">${head(false).replace('</div></div>', ' <span class="link">Pages in no concept (12)</span> ▾</div></div>')}
    <div class="sec" style="margin-bottom:var(--md)"><div class="sh">${looseHead.replace('<h3>', '<h3 style="margin:0">')}</div><div class="sb">${looseRows(loose.slice(0, 3))}<div class="fold"><span class="link">Show all 12</span></div></div></div>
    <div class="cgrid" style="grid-template-columns:repeat(${cols},1fr);opacity:.55">${['Self-scheduling','Approval workflow','Time off'].map(n => `<div class="card"><div class="in"><div class="r1"><span class="name">${n}</span>${SUG}</div></div></div>`).join('')}</div></div>`;
}

/* ---------------- 5. This repo's map today: 0 pages ---------------- */
function todayPage() {
  const dw = W < 1200 ? W - 40 : 760, covers = W < 1200;

    <div class="cap">mockup · no Pages in no concept link: the count is 0</div><div class="cgrid" style="grid-template-columns:repeat(2,1fr)">${c('Sindri desktop UI shell', 13, 2, 506)}${c('Sindri workflow engine', 51, 3, '1,246')}${c('Code index', 3, 29, 202)}${c('Bug fix pipeline', 4, 22, 133)}</div></div>`;
  return pg + (covers ? '<div class="scrim"></div>' : '') + `<div class="drill${covers ? ' cover' : ''}" style="width:${dw}px">
    <div style="display:flex;align-items:center;gap:var(--xs)"><h2>Sindri desktop UI shell</h2>${SUG}<span class="x">Esc</span></div>
    <div class="cap">mockup · this repo's map (v7, 121 surfaces: 112 routes, 9 settings, no screen or dialog)</div>
    <div class="fold"><b>Decisions</b> 0 <span class="grow"></span>▸</div><div class="fold"><b>Records</b> 2 <span class="grow"></span>▸</div>
    ${secHead.replace('<span class="btn sm">Accept all suggested (14)</span>', '')}
    <div class="empty">No pages or actions found for this concept yet. Name one with New page.</div></div>`;
}

const pagesBy = { section:sectionPage, sheet:sheetPage, accept:acceptPage, none:nonePage, today:todayPage };
document.getElementById('body').innerHTML = (pagesBy[S] || sectionPage)();
const sw = (label, href, on) => `<a class="${on ? 'on' : ''}" href="${href}">${label}</a>`;
document.body.insertAdjacentHTML('beforeend', `<div class="mstrip"><span>mockup · ${S}${S === 'today' ? '' : ' · variant ' + V.toUpperCase()} · ${W}px</span><span class="grow"></span><div class="switch">${Object.keys(pagesBy).map(s => sw(s, `?s=${s}&v=${V}`, s === S)).join('')}<span class="sep"></span>${['a','b','c'].map(v => sw(v.toUpperCase(), `?s=${S}&v=${v}`, v === V)).join('')}</div></div>`);
</script>
</body>
