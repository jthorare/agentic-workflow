<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo page mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<!--
  Sindri Todo page mockups (spec 2026-11-07-sindri-todo-design.md §3.1 page, §3.2 quick-add, §3.4 states, §6 errors, §11 TP-7; Ph0).
  Static: no production code. Colors, sizes and radii are the app's tokens (src/Sindri/Aw.Sindri.Ui/Theme/Tokens.axaml); no new ones.
  The top bar is the shared one from the PR review list mockup, with a tenth tab (Todo) after Home, measured by the same model.
  Query:  page=todo|reviews|home|bars                    (default todo)
          state=main|empty|notrunning|elsefail          (the Todo page)
          sel=1  edit=1  conflict=1  toast=1  done=1     (a selected row, a row in edit, the 409 row, the Undo toast, Done today open)
          quick=parsed|pr|fail                           (the quick-add box over the page; page=reviews for the "N on any page" shot)
          v=home                                         (the fallback: nine tabs and a "Todo 2" button in Home's header)
          ts=1.3                                         (text scale, bars page only)
  Today in the sample is Sat 2026-11-07.
-->
<style>
:root {
  --canvas:#010102; --s1:#0f1011; --s2:#141516; --s3:#18191a; --s4:#191a1b;
  --hair:#23252a; --hair2:#34343a; --hair3:#3e3e44;
  --ink:#f7f8f8; --muted:#d0d6e0; --subtle:#8a8f98; --tert:#62666d;
  --primary:#5e6ad2; --primaryHover:#828fff; --primarySoft:#1d2036; --onPrimary:#fff;
  --success:#27a644; --attention:#f2994a; --error:#eb5757;
  --attentionSoft:#23160c; --errorSoft:#220d0e;
  --xxs:4px; --xs:8px; --sm:12px; --md:16px; --lg:24px; --xl:32px;
  --rxs:4px; --rsm:6px; --rmd:8px; --rlg:12px;
  --topbar:48px; --sheet:520px; --control:30px;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { background:var(--canvas); color:var(--ink); font:13px/1.45 Inter, system-ui, sans-serif; overflow:hidden; }
.mono { font-family:"JetBrains Mono", Menlo, monospace; font-size:12px; }
svg { flex:none; }

/* ---------- Top bar: nine tabs (spec §3). Same structure as the real bar; the .step-* classes are its step-down. ---------- */
.top { --ts:1; height:var(--topbar); display:flex; align-items:center; padding:0 var(--md); border-bottom:1px solid var(--hair); background:var(--canvas); position:relative; z-index:2; }
.brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:calc(14px * var(--ts)); letter-spacing:-.2px; margin-right:20px; flex:none; }
.brand-mark { width:20px; height:20px; border-radius:5px; background:var(--primary); color:var(--onPrimary); display:grid; place-items:center; }
.top.nobrandword .brand { gap:0; }
.top.nobrandword .brand-word { display:none; }
.seg { display:flex; align-items:center; gap:2px; padding:2px; background:var(--s1); border:1px solid var(--hair); border-radius:var(--rmd); flex:none; }
.seg .tab { display:flex; align-items:center; gap:6px; height:26px; padding:0 7px; border-radius:var(--rsm); color:var(--subtle); font-weight:500; font-size:calc(13px * var(--ts)); white-space:nowrap; }
.top.tight .seg .tab { padding:0 2px; }
.seg .tab.on { background:var(--primarySoft); color:var(--primaryHover); }
.seg .tab.on::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--primary); }
.count { font-size:calc(12px * var(--ts)); font-weight:600; line-height:1.2; color:var(--attention); background:var(--attentionSoft); border-radius:var(--rxs); padding:1px 5px; }
.cnum { font-size:calc(12px * var(--ts)); font-weight:500; color:var(--subtle); }
.top.nocounts .count, .top.nocounts .cnum { display:none; }
.grow { flex:1; min-width:0; }
.search { margin:0 12px; height:var(--control); display:flex; align-items:center; gap:8px; padding:0 10px; border:1px solid var(--hair); border-radius:var(--rmd); background:var(--s1); color:var(--subtle); white-space:nowrap; flex:0 1 300px; min-width:160px; font-size:calc(13px * var(--ts)); }
.search span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.top.compact .search { flex:none; min-width:0; }
.top.compact .search span, .top.compact .search kbd { display:none; }
kbd { font:500 11px Inter, sans-serif; color:var(--subtle); border:1px solid var(--hair2); border-radius:var(--rxs); padding:1px 5px; background:var(--s2); }
.pill { font-size:calc(13px * var(--ts)); display:flex; align-items:center; gap:6px; height:var(--control); padding:4px 12px; border:1px solid var(--hair2); border-radius:999px; background:var(--s1); white-space:nowrap; flex:none; }
.pill .w { font-weight:600; display:flex; align-items:center; gap:6px; }
.pill .age { color:var(--subtle); font-size:calc(12px * var(--ts)); }
.top.noage .pill .age { display:none; }
.bar-on { margin-left:6px; }

.body { position:absolute; top:var(--topbar); left:0; right:0; bottom:0; display:flex; }
.page { flex:1; min-width:0; overflow:hidden; padding:var(--lg) var(--lg) var(--xl); }
.col { max-width:760px; margin:0 auto; }
.fresh { color:var(--subtle); font-size:12px; }
.btn { height:var(--control); padding:0 var(--sm); border-radius:var(--rmd); border:1px solid var(--hair2); background:var(--s2); color:var(--ink); display:inline-flex; align-items:center; gap:6px; font:500 13px Inter, sans-serif; white-space:nowrap; }
.btn.primary { background:var(--ink); color:#000; border-color:var(--ink); }
.btn.ghost { background:transparent; border-color:transparent; color:var(--subtle); }
.btn.sm { height:26px; padding:0 var(--xs); font-size:12px; }
.focus { outline:2px solid var(--primary); outline-offset:2px; }
.ok { color:var(--success); } .att { color:var(--attention); } .err { color:var(--error); }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
.dot.ok { background:var(--success); } .dot.err { background:var(--error); }
.ico { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.chip { display:inline-flex; align-items:center; gap:4px; height:18px; padding:0 6px; border-radius:var(--rxs); border:1px solid var(--hair2); color:var(--subtle); font-size:11px; white-space:nowrap; flex:none; }
.chip.link { color:var(--primaryHover); border-color:#2a2f55; background:var(--primarySoft); }
.chip.att { color:var(--attention); border-color:#4a3017; background:var(--attentionSoft); }

/* Header */
.pagehead { display:flex; align-items:flex-start; gap:var(--md); margin-bottom:var(--md); }
.pagehead h1 { font-size:20px; font-weight:600; margin:0 0 var(--xxs); letter-spacing:-0.01em; }
.pagehead .grow { flex:1; min-width:0; }
.cnt { color:var(--subtle); font-size:12px; } .cnt b { color:var(--error); font-weight:500; }
.newhint { display:inline-flex; align-items:center; gap:8px; height:var(--control); padding:0 var(--sm) 0 6px; border:1px solid var(--hair2); border-radius:var(--rmd); background:var(--s2); color:var(--ink); font-weight:500; }

/* Groups and rows (spec §3.1) */
.group { margin-bottom:var(--md); }
.ghead { display:flex; align-items:center; gap:var(--xs); color:var(--subtle); font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:500; margin:0 0 6px var(--xs); }
.ghead .n { color:var(--tert); }
.ghead.over { color:var(--error); }
.ghead .chev { width:10px; color:var(--subtle); letter-spacing:0; }
.list { border:1px solid var(--hair); border-radius:var(--rlg); background:var(--s1); overflow:hidden; }
.row { display:flex; align-items:center; gap:var(--sm); min-height:36px; padding:0 var(--md) 0 var(--sm); border-top:1px solid var(--hair); }
.row:first-child { border-top:none; }
.row.sel { outline:2px solid var(--primary); outline-offset:-2px; background:var(--s3); }
.cb { width:16px; height:16px; border:1.5px solid var(--hair3); border-radius:4px; flex:none; display:grid; place-items:center; }
.cb.on { background:var(--primary); border-color:var(--primary); color:#fff; }
.row .tx { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; }
.row.done .tx { color:var(--subtle); text-decoration:line-through; text-decoration-color:var(--tert); }
.due { color:var(--subtle); font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.due.over { color:var(--error); } .due.today { color:var(--attention); }
.keys { display:inline-flex; gap:4px; margin-left:4px; }
.divider { display:flex; align-items:center; gap:var(--sm); margin:var(--lg) 0 var(--md); color:var(--tert); font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
.divider::before, .divider::after { content:""; flex:1; border-top:1px solid var(--hair); }
.go { color:var(--tert); flex:none; }
.erow .tx { font-size:13px; } .erow .m { color:var(--subtle); font-size:12px; white-space:nowrap; }
.erow .tag { min-width:64px; justify-content:center; font-size:11px; color:var(--muted); border:1px solid var(--hair2); border-radius:var(--rxs); padding:0 6px; height:18px; display:inline-flex; align-items:center; flex:none; }
.erow .tag.f { color:var(--error); border-color:#4a1f21; background:var(--errorSoft); }
.showall { padding:6px var(--md); border-top:1px solid var(--hair); color:var(--primaryHover); font-size:12px; }
.gerr { display:flex; align-items:center; gap:var(--sm); padding:10px var(--md); color:var(--muted); }
.gerr .btn { margin-left:auto; }
.foot { margin-top:var(--lg); color:var(--tert); font-size:12px; display:flex; flex-wrap:wrap; gap:6px 16px; }
kbd { font:500 11px Inter, sans-serif; color:var(--subtle); border:1px solid var(--hair2); border-radius:var(--rxs); padding:1px 5px; background:var(--s2); }

/* Row in edit (spec §3.3 Enter) */
.edit { border-top:1px solid var(--hair); padding:var(--sm); background:var(--s3); outline:2px solid var(--primary); outline-offset:-2px; display:flex; flex-direction:column; gap:var(--xs); }
.edit .f { display:grid; grid-template-columns:60px 1fr; align-items:center; gap:var(--xs); }
.edit .f .k { color:var(--tert); font-size:11px; letter-spacing:.06em; text-transform:uppercase; }
.fld { height:var(--control); border:1px solid var(--hair2); background:var(--s1); border-radius:var(--rmd); display:flex; align-items:center; padding:0 var(--sm); gap:8px; }
.fld.on { border-color:var(--primary); } .fld .caret { width:1px; height:16px; background:var(--ink); }
.edit .bar { display:flex; align-items:center; gap:var(--sm); color:var(--tert); font-size:12px; }
.msg { font-size:12px; display:flex; gap:8px; align-items:baseline; }
.msg .code { font-family:"JetBrains Mono", Menlo, monospace; color:var(--tert); }
.latest { padding:6px var(--sm) 6px 36px; font-size:12px; color:var(--subtle); border-top:1px solid var(--hair); background:var(--attentionSoft); }

/* Quick-add (spec §3.2): 560 px under the top bar, over the page */
.scrim { position:absolute; inset:var(--topbar) 0 0 0; background:rgba(1,1,2,.35); z-index:4; }
.qa { position:absolute; top:calc(var(--topbar) + 12px); left:50%; transform:translateX(-50%); width:560px; max-width:calc(100% - 32px); z-index:5; background:var(--s2); border:1px solid var(--hair3); border-radius:var(--rlg); padding:var(--sm); box-shadow:0 12px 40px rgba(0,0,0,.6); display:flex; flex-direction:column; gap:var(--xs); }
.qa .in { height:38px; border:1px solid var(--primary); background:var(--s1); border-radius:var(--rmd); display:flex; align-items:center; padding:0 var(--sm); font-size:14px; gap:8px; }
.qa .in .ph { color:var(--tert); }
.qa .caret { width:1px; height:18px; background:var(--ink); }
.qa .parse { font-size:12px; color:var(--muted); display:flex; gap:var(--sm); align-items:center; min-height:20px; padding-left:2px; }
.qa .foot2 { display:flex; gap:var(--md); color:var(--tert); font-size:11px; padding-left:2px; }
.qa .fail { color:var(--error); font-size:12px; display:flex; gap:8px; align-items:baseline; padding-left:2px; }

/* Toast */
.toast { position:absolute; left:50%; bottom:28px; transform:translateX(-50%); z-index:6; background:var(--s4); border:1px solid var(--hair3); border-radius:var(--rmd); padding:0 var(--sm); height:40px; display:flex; align-items:center; gap:var(--md); box-shadow:0 8px 28px rgba(0,0,0,.6); }
.toast .undo { color:var(--primaryHover); font-weight:600; }
.toast .tm { width:60px; height:3px; background:var(--hair2); border-radius:2px; overflow:hidden; } .toast .tm i { display:block; width:72%; height:100%; background:var(--primary); }

/* Not running card, Home */
.card { border:1px solid var(--hair); background:var(--s1); border-radius:var(--rlg); padding:var(--lg); display:flex; flex-direction:column; gap:var(--sm); align-items:flex-start; }
.card h3 { margin:0; font-size:16px; display:flex; gap:8px; align-items:center; }
.card code { font-family:"JetBrains Mono", Menlo, monospace; font-size:12px; background:var(--s3); padding:1px 6px; border-radius:var(--rxs); }
.empty { border:1px dashed var(--hair2); border-radius:var(--rlg); padding:var(--xl); text-align:center; color:var(--muted); margin-bottom:var(--md); }
.hband { margin-bottom:var(--md); } .hband h2 { font-size:13px; margin:0 0 6px; color:var(--muted); font-weight:600; }
.hrow { display:grid; grid-template-columns:78px 1fr 1fr 40px; gap:var(--md); align-items:center; padding:0 var(--md); min-height:38px; border:1px solid var(--hair); border-top:none; background:var(--s1); }
.hrow:first-of-type { border-top:1px solid var(--hair); border-radius:var(--rlg) var(--rlg) 0 0; } .hrow:last-of-type { border-radius:0 0 var(--rlg) var(--rlg); }
.hline { display:flex; align-items:center; gap:var(--sm); padding:0 var(--md); min-height:40px; border:1px solid var(--hair); border-radius:var(--rlg); background:var(--s1); margin-bottom:var(--xs); }
.hline .big { font-weight:600; } .hline .grow { flex:1; color:var(--subtle); font-size:12px; }
.hchip { font-size:11px; color:var(--attention); border:1px solid #4a3017; background:var(--attentionSoft); border-radius:var(--rxs); padding:0 6px; height:18px; display:inline-flex; align-items:center; width:fit-content; }
.label { position:fixed; right:8px; bottom:6px; z-index:20; font-size:10px; color:var(--tert); }

/* Bars page */
.bars { padding:var(--lg) 0; overflow:auto; height:100%; } .bars h1, .bars .lead, .barbox .cap, .bars .verdict, table.meas { margin-left:var(--lg); margin-right:var(--lg); }
.bars h1 { font-size:20px; margin:0 var(--lg) var(--xs); } .bars .lead { color:var(--subtle); margin-bottom:var(--md); max-width:1100px; }
.barbox { margin-bottom:var(--md); } .barbox .cap { display:flex; gap:var(--md); color:var(--muted); margin-bottom:6px; } .barbox .cap span { color:var(--subtle); }
.frame { border:1px solid var(--hair2); } .frame.overflow-x { overflow:hidden; }
.verdict { border:1px solid var(--hair2); background:var(--s1); border-radius:var(--rlg); padding:var(--sm) var(--md); margin-bottom:var(--md); max-width:1100px; }
table.meas { border-collapse:collapse; font-variant-numeric:tabular-nums; margin-bottom:var(--md); }
table.meas th { text-align:right; color:var(--tert); font-size:11px; letter-spacing:.05em; text-transform:uppercase; font-weight:500; padding:4px 10px; border-bottom:1px solid var(--hair2); }
table.meas th:first-child, table.meas td:first-child { text-align:left; }
table.meas td { text-align:right; padding:4px 10px; border-bottom:1px solid var(--hair); }
table.meas td.stp { text-align:left; color:var(--muted); } table.meas tr.bad td { color:var(--attention); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search);
const PAGE = q.get('page') || 'todo', STATE = q.get('state') || 'main', QUICK = q.get('quick'), V = q.get('v');
const TS = parseFloat(q.get('ts') || '1');
const W = window.innerWidth;

const I = {
  glyph:'<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 9.5 6 2l4 7.5H7.4L6 6.8 4.6 9.5z" fill="currentColor"/></svg>',
  mag:  '<svg width="13" height="13" viewBox="0 0 14 14"><circle cx="6" cy="6" r="4.2" stroke="currentColor" fill="none" stroke-width="1.4"/><path d="m9.2 9.2 3 3" stroke="currentColor" stroke-width="1.4"/></svg>',
  check:'<svg width="10" height="10" viewBox="0 0 12 12"><path d="M2 6.5 5 9.5 10 3" stroke="currentColor" fill="none" stroke-width="1.8"/></svg>',
  pr:   '<svg width="12" height="12" viewBox="0 0 14 14"><circle cx="3.5" cy="3" r="1.6" stroke="currentColor" fill="none" stroke-width="1.3"/><circle cx="3.5" cy="11" r="1.6" stroke="currentColor" fill="none" stroke-width="1.3"/><circle cx="10.5" cy="11" r="1.6" stroke="currentColor" fill="none" stroke-width="1.3"/><path d="M3.5 4.6v4.8M10.5 9.4V5.5a2 2 0 0 0-2-2H7" stroke="currentColor" fill="none" stroke-width="1.3"/></svg>',
  lin:  '<svg width="12" height="12" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.2" stroke="currentColor" fill="none" stroke-width="1.3"/><path d="M3.6 6.2 5.4 8l3-3.4" stroke="currentColor" fill="none" stroke-width="1.3"/></svg>',
  off:  '<svg width="15" height="15" viewBox="0 0 16 16"><path d="M2.6 13.2 8 3l5.4 10.2z" fill="none" stroke="#d0d6e0" stroke-width="1.3" stroke-linejoin="round"/><path d="M2 2.5 14 14" stroke="#d0d6e0" stroke-width="1.4"/></svg>',
  warn: '<svg width="13" height="13" viewBox="0 0 13 13"><path d="M6.5 1.5 12 11H1z" stroke="currentColor" fill="none" stroke-width="1.4" stroke-linejoin="round"/><path d="M6.5 5v3M6.5 9.3v.4" stroke="currentColor" stroke-width="1.4"/></svg>',
};

/* ---------- Top bar: ten tabs (Todo after Home), or nine with v=home. Same model as the PR review list mockup. ---------- */
const FULL10 = ['Home','Todo','Projects','Workflows','Work','Recipes','Context','Agents','System','Reviews'];
const FULL9 = FULL10.filter(t => t !== 'Todo');
const SHORT = { Workflows:'Flows' };
const CNT = { Todo:'2', Workflows:'12', Work:'12', Recipes:'8', Agents:'4', Reviews:'3' };   // worst case, as in the Reviews list mockup; Todo = overdue 1 + due today 1
const BOLD = { Todo:1, Reviews:1 };                                                          // drawn as the attention count
const STEPS = ['full','compactSearch','noAge','tightNav','noBrandWord','noCounts'];
const tl = (t, css) => { const s = document.createElement('span'); s.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;' + css; s.textContent = t; document.body.appendChild(s); const w = s.getBoundingClientRect().width; s.remove(); return w; };
let M = null;
function measure() {
  const lab = {}; [...FULL10, ...Object.values(SHORT)].forEach(t => lab[t] = tl(t, 'font:500 13px Inter'));
  M = { lab, brandWord: tl('Sindri', 'font:600 14px Inter'), pillWord: tl('Running', 'font:600 13px Inter'), pillAge: tl('updated 4s ago', 'font:400 12px Inter') };
}
function need(step, names, labels, s) {
  const i = STEPS.indexOf(step), padX = i >= 3 ? 2 : 7, search = i >= 1 ? 60 : 184, age = i < 2, word = i < 4, counts = i < 5;
  const brand = 20 + (word ? 8 + M.brandWord * s : 0) + 20;
  const tabs = labels.map((l, k) => { const key = names[k], c = CNT[key]; return 2 * padX + (M.lab[l] || tl(l, 'font:500 13px Inter')) * s + (counts && c ? 6 + (BOLD[key] ? tl(c, 'font:600 12px Inter') + 10 : tl(c, 'font:500 12px Inter')) * s : 0); });
  const nav = 2 + 4 + tabs.reduce((a, b) => a + b, 0) + 2 * (labels.length - 1) + 12;
  const pill = 26 + 16 + 6 + M.pillWord * s + (age ? 6 + M.pillAge * s : 0);
  return { px: Math.round(32 + brand + nav + search + pill) };
}
function fit(w, names, labels, s) {
  for (const st of STEPS) { const n = need(st, names, labels, s); if (n.px <= w) return { step: st, ...n }; }
  return { step: 'overflow', ...need('noCounts', names, labels, s) };
}
function barLabels(w, names, s) {
  if (w >= 1100 || fit(w, names, names, s).step !== 'overflow') return names;
  return names.map(l => SHORT[l] || l);
}
function bar(w, active, o = {}) {
  const s = o.ts || 1, names = o.nine ? FULL9 : FULL10, labels = o.forceShort ? names.map(l => SHORT[l] || l) : barLabels(w, names, s), f = fit(w, names, labels, s), i = STEPS.indexOf(f.step);
  const cls = ['top', i >= 1 ? 'compact' : '', i >= 2 ? 'noage' : '', i >= 3 ? 'tight' : '', i >= 4 ? 'nobrandword' : '', i >= 5 ? 'nocounts' : ''].join(' ');
  const tabs = names.map((full, k) => {
    const l = labels[k], c = CNT[full];
    const badge = !c ? '' : BOLD[full] ? `<span class="count" aria-label="${c} ${full === 'Todo' ? 'due or overdue' : 'waiting on you'}">${c}</span>` : `<span class="cnum">${c}</span>`;
    return `<div class="tab${full === active ? ' on' : ''}" ${l !== full ? `title="${full}"` : ''}>${l}${badge}</div>`;
  }).join('');
  const pill = o.off ? `<div class="pill"><span class="w">${I.off}Not running</span></div>` : `<div class="pill"><span class="w"><span class="dot ok"></span>Running</span><span class="age">updated 4s ago</span></div>`;
  return `<div class="${cls}" ${o.id ? `id="${o.id}"` : ''} style="${o.ts ? '--ts:' + o.ts : ''}"><div class="brand"><span class="brand-mark">${I.glyph}</span><span class="brand-word">Sindri</span></div>
    <div class="seg">${tabs}</div><div class="grow"></div>
    <div class="search">${I.mag}<span>Search or run a command</span><kbd>⌘K</kbd></div>${pill}</div>`;
}

/* ---------- Sample data (made up). Today is Sat 2026-11-07. ---------- */
const TODOS = {
  over:   [{ t:'Renew the staging TLS cert', due:'Mon', cls:'over' }],

const chipOf = r => r.link ? `<span class="chip link">${I[r.lk]}${r.link}</span>` : '';

const NEEDS = [{ tag:'Decision', t:'Pick the backfill window for the nightly index', m:'filed by a session · 26 m' }, { tag:'Failed', f:1, t:'Service library-feed stopped: exit 1', m:'retry from System · 2 h' }];
const PRS = [{ t:'Retry payment capture on timeout', m:'acme/harbor#219 · review requested · 5 h' }, { t:'Add booking hold expiry', m:'acme/harbor#214 · reviewed, 2 new commits · 2 h' }, { t:'Reviews list: row names and J / K keys', m:'jthorare/agentic-workflow#2102 · 1 d' }];
const LIN = [['ENG-142','Model-check the lease renewal','In progress'], ['ENG-151','Docs sync rules fail on empty folders','Todo'], ['ENG-155','Tray tooltip loses the unread count','Todo'], ['ENG-160','Rename the queue groups in the CLI','Backlog'], ['ENG-163','Frames tests flake on the first paint','In progress']];
const erow = (tag, t, m, f) => `<div class="row erow">${tag ? `<span class="tag${f ? ' f' : ''}">${tag}</span>` : ''}<span class="tx">${t}</span><span class="m">${m}</span><span class="go">→</span></div>`;
const showall = t => `<div class="showall">${t}</div>`;
function elsewhere() {
  const fail = STATE === 'elsefail';
  const linBody = fail
    ? `<div class="gerr"><span class="att" style="display:flex">${I.warn}</span><span>Couldn’t load Linear</span><span class="fresh">The other two are fine.</span><span class="btn sm">Retry</span></div>`
    : LIN.map(([k, t, s]) => erow(k, t, s)).join('') + showall('Show all 9 in Work →');

    ${group('Needs you', 2, NEEDS.map(n => erow(n.tag, n.t, n.m, n.f)).join(''))}

/* ---------- The Todo page ---------- */
const head = (cnt) => `<div class="pagehead"><div class="grow"><h1>Todo</h1><div class="cnt">${cnt}</div></div><div class="newhint"><kbd>N</kbd>New todo</div></div>`;
function editRow(conflict) {
  const r = TODOS.up[0];
  return `<div class="edit"><div class="f"><span class="k">Todo</span><div class="fld on"><span>${conflict ? 'Reply to Sam about the offsite and the venue' : r.t}</span><span class="caret"></span></div></div>
    <div class="f"><span class="k">Due</span><div class="fld">${conflict ? 'Fri 11-13' : 'Fri 11-13'}</div></div>
    <div class="f"><span class="k">Link</span><div class="fld" style="color:var(--tert)">${conflict ? 'none' : 'none · paste a PR url, ENG-12 or ITM-…'}</div></div>
    ${conflict ? `<div class="msg err"><span>Changed somewhere else. Here’s the latest</span><span class="code">SND-TODO-409</span></div>`
               : `<div class="bar"><span><kbd>Enter</kbd> Save</span><span><kbd>Tab</kbd> Next field</span><span><kbd>Esc</kbd> Cancel</span></div>`}</div>
    ${conflict ? `<div class="latest">Latest: due <b style="color:var(--attention)">Mon 11-09</b> (was Fri 11-13), set from <span class="mono" style="font-family:'JetBrains Mono',monospace">sindri todo edit</span>. Your typed text is kept above; Enter saves it on top of the latest.</div>` : ''}`;
}
function todoPage() {
  if (STATE === 'notrunning') return `<div class="col">${head('')}<div class="card"><h3>${I.off} Sindri isn’t running</h3><div class="fresh">Todos live in Sindri’s ledger, so there’s nothing to show or save until it’s up. <kbd>N</kbd> says the same instead of opening a box.</div><div class="fresh">Start it with <code>sindri</code> in a terminal.</div></div></div>`;
  if (STATE === 'empty') return `<div class="col">${head('0 open')}<div class="empty"><p style="font-size:15px;color:var(--ink);margin:0 0 6px">Nothing on your list.</p><p style="margin:0">Press <kbd>N</kbd> to add one.</p></div>${elsewhere().replace(/<div class="divider">[\s\S]*$/, '') ? '' : ''}${elsewhere()}</div>`;
  const sel = q.get('sel') === '1', ed = q.get('edit') === '1', cf = q.get('conflict') === '1', toast = q.get('toast') === '1', done = q.get('done') === '1';
  const up = TODOS.up.map((r, k) => k === 0 && (ed || cf) ? editRow(cf) : todoRow(r, { sel: sel && k === 0 })).join('');
  const over = toast ? '' : todoRow(TODOS.over[0], { sel: false });
  const doneRows = done ? DONE.map(r => todoRow(r, { done: true })).join('') : '';
  const nDone = toast ? 3 : 2;
  const toastRow = toast ? todoRow({ t:'Renew the staging TLS cert', at:'now' }, { done: true }) : '';
  const overBlock = toast ? '' : group('Overdue', 1, over, 'over');
  const doneBlock = `<div class="group"><div class="ghead"><span class="chev">${done || toast ? '▾' : '▸'}</span>Done today <span class="n">${nDone}</span></div>${done || toast ? `<div class="list">${toastRow}${doneRows}</div>` : ''}</div>`;
  const doneOpenNote = '';
  return `<div class="col">${head(toast ? '5 open · none overdue' : '6 open · <b>1 overdue</b>')}
    ${overBlock}${group('Today', 1, todoRow(TODOS.today[0]), '')}${group('Upcoming', 2, up)}${group('Someday', 2, TODOS.some.map(r => todoRow(r)).join(''))}${doneBlock}
    ${elsewhere()}
    <div class="foot"><span><kbd>J</kbd><kbd>K</kbd> move</span><span><kbd>X</kbd> done</span><span><kbd>Enter</kbd> edit</span><span><kbd>D</kbd> date</span><span><kbd>O</kbd> open link</span><span><kbd>Delete</kbd> remove</span><span><kbd>G</kbd><kbd>T</kbd> open Todo</span></div></div>`;
}

/* ---------- Other pages the shots need ---------- */
function reviewsPage() {
  const r = (t, m, w) => `<div class="row erow"><span class="tx" style="font-size:14px;font-weight:500">${t}</span><span class="m">${m}</span><span class="due">${w}</span></div>`;

  return `<div class="col"><div class="pagehead"><div class="grow"><h1>Home</h1><div class="cnt"><b style="color:var(--ink);font-weight:500">5 need you</b> · 4 running · 1 with you · 4 queued</div></div>${todoBtn}</div>
    <div class="hband"><h2>Needs you</h2>${row('Parked','Retry storm in outbox dispatcher','checks failed twice','12m')}${row('Decision','Re-scope: drop the iOS head from this item','filed by a session','26m')}${row('Escalated','Context map review for tabs.layout','judge 0.62, below 0.80','2h')}</div>

/* ---------- Quick-add (spec §3.2) ---------- */
function quickAdd() {
  const hint = `<div class="foot2"><span><kbd>Enter</kbd> Save</span><span><kbd>Shift</kbd><kbd>Enter</kbd> Save and add another</span><span><kbd>Esc</kbd> Close</span></div>`;
  let inp, parse, fail = '';
  if (QUICK === 'pr') {
    inp = `<span>check flaky test</span><span class="chip link">${I.pr}PR #2071 ×</span><span class="caret"></span>`;
    parse = `<span>Links PR #2071</span><span class="fresh">· No date</span><span class="fresh" style="margin-left:auto">The url left the text</span>`;
  } else if (QUICK === 'fail') {
    inp = `<span>check flaky test fri</span><span class="caret"></span>`;
    parse = `<span>Due Fri 11-13</span>`;
    fail = `<div class="fail"><span>Couldn’t save: Sindri stopped answering. Your text is still here, Enter tries again.</span></div>`;
  } else {
    inp = `<span>check flaky test fri</span><span class="caret"></span>`;

  }
  return `<div class="scrim"></div><div class="qa" role="dialog" aria-label="New todo"><div class="in">${inp}</div><div class="parse" aria-live="polite">${parse}</div>${fail}${hint}</div>`;
}

/* ---------- Measured bars (TP-7) ---------- */
function barsPage() {
  const cases = [[1000, 1], [1099, 1], [1100, 1], [1440, 1], [1000, 1.3]];
  const rows = cases.map(([w, s]) => {
    const t = fit(w, FULL10, barLabels(w, FULL10, s), s), tf = fit(w, FULL10, FULL10, s), n = fit(w, FULL9, barLabels(w, FULL9, s), s), fl = need('noCounts', FULL10, FULL10, s).px, flS = need('noCounts', FULL10, FULL10.map(l => SHORT[l] || l), s).px, fl9 = need('noCounts', FULL9, FULL9, s).px;
    return { w, s, t, tf, n, fl, flS, fl9 };
  });
  const frames = [[1000, 1], [1000, 1.3], [1440, 1]].map(([w, s]) => {
    const l = barLabels(w, FULL10, s), f = fit(w, FULL10, l, s);
    return `<div class="barbox"><div class="cap"><b>Ten tabs, ${w} px window${s !== 1 ? ', text 130%' : ''}</b><span>${l === FULL10 ? 'full labels' : 'short labels'} · bar step: ${f.step} · needs ${f.px} of ${w} px${f.px > w ? ` · <b class="att">${f.px - w} px too wide</b>` : ''}</span></div>
      <div class="frame" style="width:${w}px;overflow:hidden">${bar(w, 'Todo', { ts: s })}</div></div>`;
  }).join('') + `<div class="barbox"><div class="cap"><b>Fallback v=home, 1000 px (not needed: ten tabs fit)</b><span>nine tabs · needs ${fit(1000, FULL9, barLabels(1000, FULL9, 1), 1).px} of 1000 px</span></div><div class="frame" style="width:1000px">${bar(1000, 'Home', { nine: true })}</div></div>`;
  const T = rows.map(r => `<tr class="${r.t.step === 'overflow' ? 'bad' : ''}"><td>${r.w}${r.s !== 1 ? ' @ text 130%' : ''}</td><td>${r.tf.px}</td><td class="stp">${r.t.step}</td><td>${r.t.step === 'overflow' ? `<b>${r.t.px - r.w} px over</b>` : r.w - r.t.px}</td><td>${r.fl}</td><td>${r.flS}</td><td>${r.fl9}</td><td class="stp">${r.n.step}</td></tr>`).join('');
  const r1000 = rows[0], r13 = rows[4];
  const verdict = `<div class="verdict" id="verdict" data-fits1000="${r1000.t.step !== 'overflow'}" data-step1000="${r1000.t.step}" data-need1000="${r1000.t.px}" data-spare1000="${1000 - r1000.t.px}" data-step13="${r13.t.step}" data-need13="${r13.t.px}" data-spare13="${1000 - r13.t.px}" data-floor="${r1000.fl}" data-floor13="${r13.fl}">
    <b>TP-7, 1000 px at 100% text: ${r1000.t.step === 'overflow' ? `does NOT fit, ${r1000.t.px - 1000} px too wide` : `fits at step “${r1000.t.step}”, ${1000 - r1000.t.px} px spare`}.</b>
    At text 130%: ${r13.t.step === 'overflow' ? `does NOT fit, ${r13.t.px - 1000} px too wide (with “Flows”: ${r13.flS} at the last step)` : `fits at step “${r13.t.step}”, ${1000 - r13.t.px} px spare`}.</div>`;
  setTimeout(() => { const o = []; document.querySelectorAll('.frame').forEach(f => { const t = f.querySelector('.top'); o.push(Math.max(0, t.scrollWidth - t.clientWidth)); const c = f.previousElementSibling.querySelector('span'); c.insertAdjacentHTML('beforeend', ` · drawn bar overflows by <b class="${o[o.length-1] ? 'att' : 'ok'}">${o[o.length-1]} px</b>`); }); document.getElementById('verdict').dataset.drawn = o.join(','); }, 0);
  return `<div class="bars"><h1>Ten tabs, measured</h1>
    <div class="lead">Same model as the Reviews list mockup (brand, segmented nav, ⌘K field, health pill; Inter 13/500 widths measured in this page) with Todo added after Home and a worst-case count on each of Todo 2, Workflows 12, Work 12, Recipes 8, Agents 4, Reviews 3. Step-down order: ⌘K folds to its magnifier, the pill’s age drops, tab padding 7 → 2 px, the brand word drops, counts hide.</div>
    ${verdict}${frames}
    <table class="meas"><tr><th>Window</th><th>Needs, ten tabs, full labels</th><th>Step it lands on</th><th>Spare px</th><th>Floor (every step taken)</th><th>Floor with “Flows”</th><th>Floor, nine tabs</th><th>Nine tabs: step</th></tr>${T}</table></div>`;
}

/* ---------- Mount ---------- */
function mount() {
  measure();
  if (q.get("toast") === "1") CNT.Todo = "1";   // the overdue one was just checked off: 0 overdue + 1 today
  const root = document.getElementById('root');
  if (PAGE === 'bars') { root.innerHTML = barsPage(); return; }
  const active = PAGE === 'reviews' ? 'Reviews' : PAGE === 'home' ? 'Home' : 'Todo';
  const body = PAGE === 'reviews' ? reviewsPage() : PAGE === 'home' ? homePage() : todoPage();
  const nine = V === 'home';
  let extra = '';
  if (QUICK) extra += quickAdd();
  if (q.get('toast') === '1') extra += `<div class="toast" role="status"><span>Done.</span><span class="undo">Undo</span><kbd>⌘Z</kbd><span class="tm"><i></i></span></div>`;
  root.innerHTML = bar(W, active, { nine, off: STATE === 'notrunning' }) + `<div class="body"><div class="page">${body}</div></div>` + extra;
  document.body.insertAdjacentHTML('beforeend', `<div class="label">mockup · ${PAGE}${STATE !== 'main' ? ' · ' + STATE : ''}${QUICK ? ' · quick ' + QUICK : ''} · ${W}px</div>`);
}
/* The text model needs Inter's real widths: load each face used before measuring (fonts.ready alone resolves before first use). */
const faces = ['400 12px Inter','400 13px Inter','500 13px Inter','600 12px Inter','600 13px Inter','600 14px Inter'];
(document.fonts && document.fonts.load ? Promise.all(faces.map(f => document.fonts.load(f).catch(() => 0))) : Promise.resolve()).then(mount);
</script>
