<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo panel mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<!--
  Sindri todo mockups, rev 5 (spec 2026-11-07-sindri-todo-design.md §3.1 panel, §3.2 quick-add, §3.3 keys, §3.4 states, D13; Ph0).
  Static: no production code. Colors, sizes and radii are the app's tokens (src/Sindri/Aw.Sindri.Ui/Theme/Tokens.axaml); no new tokens.
  Query:  s=<screen>   home-collapsed | home-expanded | home-expanded-top
                       attn-a | attn-b | attn-c | attn-c-hold | attn-d | attn-e
                       focus-panel | focus-needs | quickadd | workflows
                       settings-a | settings-b | settings-c | settings-d
  Today in the sample is Sat 2026-11-07. Data is made up.
-->
<style>
:root {
  --canvas:#010102; --s1:#0f1011; --s2:#141516; --s3:#18191a; --s4:#191a1b;
  --hair:#23252a; --hair2:#34343a; --hair3:#3e3e44;
  --ink:#f7f8f8; --muted:#d0d6e0; --subtle:#8a8f98; --tert:#62666d;
  --primary:#5e6ad2; --primaryHover:#828fff; --primarySoft:#1d2036; --onPrimary:#fff;
  --success:#27a644; --attention:#f2994a; --error:#eb5757;
  --attentionSoft:#23160c; --errorSoft:#220d0e; --attentionFill:#624328;
  --xxs:4px; --xs:8px; --sm:12px; --md:16px; --lg:24px; --xl:32px;
  --rxs:4px; --rsm:6px; --rmd:8px; --rlg:12px;
  --topbar:48px; --sheet:520px; --control:30px;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; }
body { background:var(--canvas); color:var(--ink); font:13px/1.45 Inter, system-ui, sans-serif; overflow:hidden; }
.mono { font-family:"JetBrains Mono", Menlo, monospace; font-size:12px; }
svg { flex:none; }

/* ---------- Top bar: nine tabs (spec §3). Same structure as the real bar; the .step-* classes are its step-down. ---------- */
.top { --ts:1; height:var(--topbar); display:flex; align-items:center; padding:0 var(--md); border-bottom:1px solid var(--hair); background:var(--canvas); position:relative; z-index:2; }
.brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:calc(14px * var(--ts)); letter-spacing:-.2px; margin-right:20px; flex:none; }
.brand-mark { width:20px; height:20px; border-radius:5px; background:var(--primary); color:var(--onPrimary); display:grid; place-items:center; }
.top.nobrandword .brand { gap:0; }
.top.nobrandword .brand-word { display:none; }
.seg { display:flex; align-items:center; gap:2px; padding:2px; background:var(--s1); border:1px solid var(--hair); border-radius:var(--rmd); flex:none; }
.seg .tab { display:flex; align-items:center; gap:6px; height:26px; padding:0 7px; border-radius:var(--rsm); color:var(--subtle); font-weight:500; font-size:calc(13px * var(--ts)); white-space:nowrap; }
.top.tight .seg .tab { padding:0 2px; }
.seg .tab.on { background:var(--primarySoft); color:var(--primaryHover); }
.seg .tab.on::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--primary); }
.count { font-size:calc(12px * var(--ts)); font-weight:600; line-height:1.2; color:var(--attention); background:var(--attentionSoft); border-radius:var(--rxs); padding:1px 5px; }
.cnum { font-size:calc(12px * var(--ts)); font-weight:500; color:var(--subtle); }
.top.nocounts .count, .top.nocounts .cnum { display:none; }
.grow { flex:1; min-width:0; }
.search { margin:0 12px; height:var(--control); display:flex; align-items:center; gap:8px; padding:0 10px; border:1px solid var(--hair); border-radius:var(--rmd); background:var(--s1); color:var(--subtle); white-space:nowrap; flex:0 1 300px; min-width:160px; font-size:calc(13px * var(--ts)); }
.search span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.top.compact .search { flex:none; min-width:0; }
.top.compact .search span, .top.compact .search kbd { display:none; }
kbd { font:500 11px Inter, sans-serif; color:var(--subtle); border:1px solid var(--hair2); border-radius:var(--rxs); padding:1px 5px; background:var(--s2); }
.pill { font-size:calc(13px * var(--ts)); display:flex; align-items:center; gap:6px; height:var(--control); padding:4px 12px; border:1px solid var(--hair2); border-radius:999px; background:var(--s1); white-space:nowrap; flex:none; }
.pill .w { font-weight:600; display:flex; align-items:center; gap:6px; }
.pill .age { color:var(--subtle); font-size:calc(12px * var(--ts)); }
.top.noage .pill .age { display:none; }
.bar-on { margin-left:6px; }

.body { position:absolute; top:var(--topbar); left:0; right:0; bottom:0; display:flex; }
.page { flex:1; min-width:0; overflow:hidden; padding:var(--lg) var(--lg) var(--xl); }
.col { max-width:760px; margin:0 auto; }
.fresh { color:var(--subtle); font-size:12px; }
.btn { height:var(--control); padding:0 var(--sm); border-radius:var(--rmd); border:1px solid var(--hair2); background:var(--s2); color:var(--ink); display:inline-flex; align-items:center; gap:6px; font:500 13px Inter, sans-serif; white-space:nowrap; }
.btn.primary { background:var(--ink); color:#000; border-color:var(--ink); }
.btn.ghost { background:transparent; border-color:transparent; color:var(--subtle); }
.btn.sm { height:26px; padding:0 var(--xs); font-size:12px; }
.focus { outline:2px solid var(--primary); outline-offset:2px; }
.ok { color:var(--success); } .att { color:var(--attention); } .err { color:var(--error); }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:none; }
.dot.ok { background:var(--success); } .dot.err { background:var(--error); }
.ico { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.chip { display:inline-flex; align-items:center; gap:4px; height:18px; padding:0 6px; border-radius:var(--rxs); border:1px solid var(--hair2); color:var(--subtle); font-size:11px; white-space:nowrap; flex:none; }
.chip.link { color:var(--primaryHover); border-color:var(--hair2); background:var(--primarySoft); }
.chip.att { color:var(--attention); border-color:var(--attentionFill); background:var(--attentionSoft); }
.ok { color:var(--success); }
.hide { display:none; }
.over { color:var(--error); } .today { color:var(--attention); }
a.l { color:var(--primaryHover); }
.page { position:absolute; top:var(--topbar); left:0; right:0; bottom:0; padding:var(--md) var(--lg) 0; overflow:hidden; }
.col { max-width:820px; margin:0 auto; }
.homehead { display:flex; align-items:baseline; gap:var(--sm); height:36px; }
.homehead h1 { font-size:20px; line-height:24px; font-weight:600; margin:0; letter-spacing:-.01em; }
.cnt { color:var(--subtle); font-size:12px; } .cnt b { color:var(--ink); font-weight:500; }

/* ---- the todo panel (spec §3.1) ---- */
.panel { border:1px solid var(--hair); border-radius:var(--rlg); background:var(--s1); display:flex; flex-direction:column; overflow:hidden; }
.region { position:relative; margin-bottom:var(--md); }
.region.focus::after { content:""; position:absolute; inset:-4px -4px -4px -4px; border:2px solid var(--primaryHover); border-radius:calc(var(--rlg) + 4px); pointer-events:none; }
.region.needs.focus::after { inset:-8px -8px -4px -8px; }
.panel.x { height:calc((100vh - var(--topbar)) / 2); }
.ph { display:flex; align-items:center; gap:var(--sm); height:40px; padding:0 var(--sm) 0 var(--md); border-bottom:1px solid var(--hair); flex:none; }
.ph h2, .nh { margin:0; font-size:14px; font-weight:600; color:var(--ink); }
.focus .ph h2, .focus .nh { color:var(--primaryHover); }
.ph .cnt { white-space:nowrap; }
.sync { font-size:12px; color:var(--subtle); white-space:nowrap; }
.sync.warn { color:var(--attention); }
.newhint { display:inline-flex; align-items:center; gap:8px; height:26px; padding:0 var(--sm) 0 5px; border:1px solid var(--hair2); border-radius:var(--rmd); background:var(--s2); color:var(--ink); font-weight:500; font-size:12px; white-space:nowrap; }
.pwrap { position:relative; flex:1; min-height:0; display:flex; flex-direction:column; }
.pbody { overflow:auto; flex:1; min-height:0; scrollbar-width:thin; scrollbar-color:var(--hair3) transparent; }
.row { display:flex; align-items:center; gap:var(--sm); height:36px; flex:none; padding:0 var(--md) 0 var(--sm); border-top:1px solid var(--hair); }
.pbody > .row:first-child, .gh + .row, .pbody > .first { border-top:none; }
.row.sel { background:var(--s3); box-shadow:inset 3px 0 0 var(--primaryHover); }
.cb { width:16px; height:16px; border:1.5px solid var(--hair3); border-radius:4px; flex:none; display:grid; place-items:center; }
.cb.on { background:var(--primary); border-color:var(--primary); color:#fff; }
.cb.rm { border-style:dashed; }
.row .tx { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px; }
.row.done .tx { color:var(--subtle); text-decoration:line-through; text-decoration-color:var(--tert); }
.due { color:var(--subtle); font-size:12px; white-space:nowrap; min-width:96px; text-align:right; font-variant-numeric:tabular-nums; flex:none; }
.chip.more { color:var(--subtle); }
.chip.agent { color:var(--muted); background:var(--s3); }
.gh { display:flex; align-items:center; gap:var(--xs); padding:10px var(--md) 4px; color:var(--subtle); font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:500; background:var(--s1); border-top:1px solid var(--hair); }
.gh:first-child { border-top:none; }
.gh .n { color:var(--tert); } .gh.o { color:var(--error); } .gh .sub { text-transform:none; letter-spacing:0; color:var(--tert); }
.sd { display:flex; align-items:center; gap:var(--xs); height:34px; padding:0 var(--md); border-top:1px solid var(--hair); color:var(--muted); font-size:12px; font-weight:500; flex:none; }
.sd .n { color:var(--subtle); }
.showall { display:flex; align-items:center; height:30px; padding:0 var(--md); border-top:1px solid var(--hair); font-size:12px; color:var(--primaryHover); flex:none; }
.pf { display:flex; align-items:center; gap:6px; min-height:34px; padding:0 var(--md); border-top:1px solid var(--hair); color:var(--muted); font-size:12px; flex:none; }
.pf .sep { color:var(--tert); }
.hints { display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; min-height:30px; padding:4px var(--md); border-top:1px solid var(--hair); background:var(--s2); color:var(--subtle); font-size:12px; flex:none; }
.hints span { display:inline-flex; align-items:center; gap:4px; } .hints b { color:var(--ink); font-weight:500; }

/* ---- attention rows (D13) ---- */
.attn { flex:none; padding:var(--xs) var(--md) var(--sm); background:var(--attentionSoft); border-top:1px solid var(--attentionFill); box-shadow:inset 3px 0 0 var(--attention); }
.pbody > .attn:first-child { border-top:none; }
.at { display:flex; align-items:center; gap:var(--xs); height:24px; font-size:13px; }
.at b { font-weight:600; } .at .att { display:flex; color:var(--attention); }
.at .same { margin-left:auto; color:var(--subtle); font-size:12px; white-space:nowrap; }
.cols { display:grid; grid-template-columns:1fr 1fr; gap:var(--sm); margin-top:var(--xs); }
.cc { display:flex; flex-direction:column; gap:var(--xs); min-width:0; padding:var(--xs) var(--sm) var(--sm); border:1px solid var(--hair2); border-radius:var(--rmd); background:var(--s1); }
.who { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--subtle); font-weight:500; }
.fk { font-size:11px; color:var(--subtle); display:flex; gap:6px; align-items:center; }
.fk em { font-style:normal; color:var(--attention); border:1px solid var(--attentionFill); border-radius:var(--rxs); padding:0 5px; font-size:11px; line-height:15px; }
.fv { font-size:13px; line-height:19.5px; } .fv.ch { color:var(--attention); }
.fv.clamp { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.fv.gone { font-weight:600; }
.cc .btn { margin-top:auto; align-self:flex-start; }
.btn kbd { margin-right:2px; }
.btn.hold { background:var(--attentionFill); border-color:var(--attentionFill); color:var(--ink); }
.holdtx { font-size:13px; line-height:19.5px; margin:2px 0 var(--xs); }
.holdbtns { display:flex; gap:var(--xs); flex-wrap:wrap; }
.holdsub { color:var(--subtle); font-size:12px; margin-top:var(--xs); }
.fold { display:flex; align-items:center; gap:var(--xs); height:36px; flex:none; padding:0 var(--md); background:var(--attentionSoft); border-top:1px solid var(--attentionFill); box-shadow:inset 3px 0 0 var(--attention); font-size:13px; }
.fold .att { display:flex; color:var(--attention); } .fold .tx { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fold .fresh { color:var(--subtle); font-size:12px; white-space:nowrap; }

/* ---- Needs you (existing list) ---- */
.nh { margin:0 0 6px; }
.nlist { border:1px solid var(--hair); border-radius:var(--rlg); background:var(--s1); overflow:hidden; }
.hrow { display:grid; grid-template-columns:78px 1fr 1fr 40px; gap:var(--md); align-items:center; padding:0 var(--md); height:38px; border-top:1px solid var(--hair); font-size:13px; }
.hrow:first-child { border-top:none; } .hrow.sel { background:var(--s3); box-shadow:inset 3px 0 0 var(--primaryHover); }
.hrow .m { color:var(--subtle); font-size:12px; } .hrow .a { color:var(--subtle); font-size:12px; text-align:right; }
.hchip { font-size:11px; color:var(--attention); border:1px solid var(--attentionFill); background:var(--attentionSoft); border-radius:var(--rxs); padding:0 6px; height:18px; display:inline-flex; align-items:center; width:fit-content; }

/* ---- quick-add (spec §3.2), toast ---- */
.scrim { position:absolute; inset:var(--topbar) 0 0 0; background:rgba(0,0,0,.6); z-index:4; }
.qa { position:absolute; top:calc(var(--topbar) + 12px); left:50%; transform:translateX(-50%); width:560px; max-width:calc(100% - 32px); z-index:5; background:var(--s3); border:1px solid var(--hair3); border-radius:var(--rlg); padding:var(--sm); box-shadow:0 12px 40px rgba(0,0,0,.6); display:flex; flex-direction:column; gap:var(--xs); }
.qa .in { height:38px; border:1px solid var(--primaryHover); background:var(--s1); border-radius:var(--rmd); display:flex; align-items:center; padding:0 var(--sm); font-size:14px; }
.qa .caret { width:1px; height:18px; background:var(--ink); margin-left:1px; }
.qa .parse { font-size:12px; color:var(--muted); display:flex; gap:var(--sm); align-items:center; min-height:20px; padding-left:2px; }
.qa .foot2 { display:flex; gap:var(--md); color:var(--subtle); font-size:11px; padding-left:2px; }
.toast { position:absolute; left:50%; bottom:28px; transform:translateX(-50%); z-index:6; background:var(--s4); border:1px solid var(--hair3); border-radius:var(--rmd); padding:0 var(--sm); height:40px; display:flex; align-items:center; gap:var(--md); box-shadow:0 8px 28px rgba(0,0,0,.6); white-space:nowrap; }
.toast .undo { color:var(--primaryHover); font-weight:600; }
.toast .tm { width:60px; height:3px; background:var(--hair2); border-radius:2px; overflow:hidden; } .toast .tm i { display:block; width:60%; height:100%; background:var(--primary); }

/* ---- Workflows page ---- */
.pagehead { display:flex; align-items:flex-start; gap:var(--md); margin-bottom:var(--md); }
.pagehead h1 { font-size:20px; line-height:24px; font-weight:600; margin:0 0 var(--xxs); letter-spacing:-.01em; } .pagehead .grow { flex:1; }
.list { border:1px solid var(--hair); border-radius:var(--rlg); background:var(--s1); overflow:hidden; }
.list .row .m { color:var(--subtle); font-size:12px; white-space:nowrap; }
.pillst { font-size:11px; border-radius:var(--rxs); padding:0 6px; height:18px; display:inline-flex; align-items:center; min-width:70px; justify-content:center; flex:none; border:1px solid var(--hair2); color:var(--muted); }
.pillst.run { color:var(--primaryHover); background:var(--primarySoft); } .pillst.you { color:var(--attention); background:var(--attentionSoft); border-color:var(--attentionFill); }
.note { margin-top:var(--md); border:1px dashed var(--hair3); border-radius:var(--rmd); padding:var(--sm) var(--md); color:var(--muted); font-size:13px; display:flex; flex-direction:column; gap:6px; }
.note .tag { color:var(--tert); font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
.note .k { display:flex; align-items:center; gap:8px; }
.btn.pr { background:var(--primary); border-color:var(--primary); color:var(--onPrimary); }
.btn.pr:disabled, .btn.off { background:transparent; border-color:var(--hair2); color:var(--tert); }

/* ---- Settings → Connections ---- */
.cards { display:grid; grid-template-columns:1fr 1fr; gap:var(--md); align-items:start; }
.scard { border:1px solid var(--hair); background:var(--s1); border-radius:var(--rlg); padding:var(--md); display:flex; flex-direction:column; gap:var(--sm); min-width:0; }
.scard h3 { margin:0; font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; }
.scard h3 .st { margin-left:auto; font-size:12px; font-weight:500; color:var(--subtle); display:flex; align-items:center; gap:6px; }
.scard p { margin:0; color:var(--muted); font-size:13px; line-height:19.5px; }
.scard code { font-family:"JetBrains Mono", Menlo, monospace; font-size:12px; background:var(--s3); padding:1px 6px; border-radius:var(--rxs); }
.scard .sub { color:var(--subtle); font-size:12px; line-height:16.8px; }
.fl { display:grid; grid-template-columns:52px 1fr; align-items:center; gap:var(--xs); }
.fl .k { color:var(--subtle); font-size:12px; }
.fld { height:var(--control); border:1px solid var(--hair2); background:var(--s1); border-radius:var(--rmd); display:flex; align-items:center; padding:0 var(--sm); gap:8px; font-size:13px; min-width:0; }
.fld .m { color:var(--subtle); font-size:12px; margin-left:auto; white-space:nowrap; } .fld .chev { color:var(--subtle); font-size:10px; }
.btns { display:flex; gap:var(--xs); flex-wrap:wrap; align-items:center; }
.res { border:1px solid var(--hair2); background:var(--s2); border-radius:var(--rmd); padding:var(--sm); display:flex; flex-direction:column; gap:var(--xs); }
.res .w { display:flex; gap:8px; color:var(--attention); font-size:13px; line-height:19.5px; } .res .w svg { margin-top:3px; }
.res p { color:var(--ink); }
.label { position:fixed; right:8px; bottom:6px; z-index:20; font-size:10px; color:var(--tert); }
</style></head><body><div id="root"></div><script>
const I = {

};

/* ---------- Top bar: ten tabs (Todo after Home), or nine with v=home. Same model as the PR review list mockup. ---------- */
const FULL10 = ['Home','Projects','Workflows','Work','Recipes','Context','Agents','System','Reviews'];
const FULL9 = FULL10.filter(t => t !== 'Todo');
const SHORT = { Workflows:'Flows' };
const CNT = { Workflows:'12', Work:'12', Recipes:'8', Agents:'4', Reviews:'3' };   // worst case, as in the Reviews list mockup; Todo = overdue 1 + due today 1
const BOLD = { Reviews:1 };                                                          // drawn as the attention count
const STEPS = ['full','compactSearch','noAge','tightNav','noBrandWord','noCounts'];
const tl = (t, css) => { const s = document.createElement('span'); s.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;' + css; s.textContent = t; document.body.appendChild(s); const w = s.getBoundingClientRect().width; s.remove(); return w; };
let M = null;
function measure() {
  const lab = {}; [...FULL10, ...Object.values(SHORT)].forEach(t => lab[t] = tl(t, 'font:500 13px Inter'));
  M = { lab, brandWord: tl('Sindri', 'font:600 14px Inter'), pillWord: tl('Running', 'font:600 13px Inter'), pillAge: tl('updated 4s ago', 'font:400 12px Inter') };
}
function need(step, names, labels, s) {
  const i = STEPS.indexOf(step), padX = i >= 3 ? 2 : 7, search = i >= 1 ? 60 : 184, age = i < 2, word = i < 4, counts = i < 5;
  const brand = 20 + (word ? 8 + M.brandWord * s : 0) + 20;
  const tabs = labels.map((l, k) => { const key = names[k], c = CNT[key]; return 2 * padX + (M.lab[l] || tl(l, 'font:500 13px Inter')) * s + (counts && c ? 6 + (BOLD[key] ? tl(c, 'font:600 12px Inter') + 10 : tl(c, 'font:500 12px Inter')) * s : 0); });
  const nav = 2 + 4 + tabs.reduce((a, b) => a + b, 0) + 2 * (labels.length - 1) + 12;
  const pill = 26 + 16 + 6 + M.pillWord * s + (age ? 6 + M.pillAge * s : 0);
  return { px: Math.round(32 + brand + nav + search + pill) };
}
function fit(w, names, labels, s) {
  for (const st of STEPS) { const n = need(st, names, labels, s); if (n.px <= w) return { step: st, ...n }; }
  return { step: 'overflow', ...need('noCounts', names, labels, s) };
}
function barLabels(w, names, s) {
  if (w >= 1100 || fit(w, names, names, s).step !== 'overflow') return names;
  return names.map(l => SHORT[l] || l);
}
function bar(w, active, o = {}) {
  const s = o.ts || 1, names = o.nine ? FULL9 : FULL10, labels = o.forceShort ? names.map(l => SHORT[l] || l) : barLabels(w, names, s), f = fit(w, names, labels, s), i = STEPS.indexOf(f.step);
  const cls = ['top', i >= 1 ? 'compact' : '', i >= 2 ? 'noage' : '', i >= 3 ? 'tight' : '', i >= 4 ? 'nobrandword' : '', i >= 5 ? 'nocounts' : ''].join(' ');
  const tabs = names.map((full, k) => {
    const l = labels[k], c = CNT[full];
    const badge = !c ? '' : BOLD[full] ? `<span class="count" aria-label="${c} waiting on you">${c}</span>` : `<span class="cnum">${c}</span>`;
    return `<div class="tab${full === active ? ' on' : ''}" ${l !== full ? `title="${full}"` : ''}>${l}${badge}</div>`;
  }).join('');
  const pill = o.off ? `<div class="pill"><span class="w">${I.off}Not running</span></div>` : `<div class="pill"><span class="w"><span class="dot ok"></span>Running</span><span class="age">updated 4s ago</span></div>`;
  return `<div class="${cls}" ${o.id ? `id="${o.id}"` : ''} style="${o.ts ? '--ts:' + o.ts : ''}"><div class="brand"><span class="brand-mark">${I.glyph}</span><span class="brand-word">Sindri</span></div>
    <div class="seg">${tabs}</div><div class="grow"></div>
    <div class="search">${I.mag}<span>Search or run a command</span><kbd>⌘K</kbd></div>${pill}</div>`;
}

/* c = { s:{text,due,done,gone}, o:{...} }: a field that is equal on both sides is drawn once, dimmed (spec §3.1); a different one is marked "changed". */
function conflict(c) {
  const F = [['text', 'Text'], ['due', 'Due'], ['done', 'State']];
  const same = [], diff = [];
  const gone = c.s.gone || c.o.gone;
  F.forEach(([k, n]) => { const a = c.s[k], b = c.o[k]; (a === b || (gone && k !== 'text') ? same : diff).push([k, n]); });
  const col = (side, name, btn, n) => {
    const v = c[side];
    const fields = v.gone ? `<div><div class="fk">State <em>changed</em></div><div class="fv gone ch">Removed</div></div>`
      : diff.filter(([k]) => !(gone && k === 'done')).map(([k, nm]) => `<div><div class="fk">${nm} <em>changed</em></div><div class="fv ch${k === 'text' ? ' clamp' : ''}">${v[k] ?? ''}</div></div>`).join('');
    return `<div class="cc"><div class="who">${name}</div>${fields}<button class="btn sm">${kb(n)}${btn}</button></div>`;
  };
  const sameTxt = same.filter(([k]) => !(gone && k === 'done') && (gone ? (c.s.gone ? c.o : c.s) : c.s)[k]).map(([k, nm]) => k === 'due' ? `due ${(gone ? (c.s.gone ? c.o : c.s) : c.s)[k]}` : (gone ? (c.s.gone ? c.o : c.s) : c.s)[k]).join(' · ');
  return `<div class="attn" data-k="attn"><div class="at"><span class="att">${I.warn}</span><b>Changed in Sindri and in Obsidian</b><span class="same">${sameTxt ? sameTxt + (gone ? '' : ', same in both') : ''}</span></div>

}
