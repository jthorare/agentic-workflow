# binaries.lock — external executables the C# build and the repo checks run but don't build, pinned by version and sha256
# (engine spec rev 8 §0 "Operations" and Phases "The Temporal dev server in tests").
#
# Format: one row per (name, platform), whitespace-separated, six fields:
#   name  version  platform  sha256  url  path
#     name      the binary's lock name, [a-z0-9-]+
#     version   x.y.z, one version per name
#     platform  darwin-arm64 | darwin-x64 | linux-x64 | linux-arm64; every name has all four
#     sha256    64 lowercase hex digits of the archive at url
#     url       https://github.com/... release asset (a .tar.gz) whose name carries the version
#     path      the executable's path inside the archive (relative, no '..')
# '#' starts a comment line; blank lines are ignored.
#
# Check:  scripts/binaries-lock.sh check            (scripts/tests/binaries-lock.test.sh)
# Fetch:  scripts/binaries-lock.sh fetch <name>     downloads this platform's row, verifies the sha256 and installs it
#         as ${AW_STATE_DIR:-~/.agentic-workflow}/cache/bin/<name>-<version>/<basename of path>; prints that path.
# Pins follow the package policy (Directory.Packages.props): an exact version at least 14 days old when pinned.
# Changing a row is a reviewed change; take the sha256 from the release's own checksums (GitHub's asset digest, and
# checksums.txt where the release publishes one).

