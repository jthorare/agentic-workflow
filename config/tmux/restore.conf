
# --- Session restore (./setup.sh --with-tmux-restore): tmux-resurrect saves every session, continuum saves every 10
# minutes and restores the last save when the tmux server starts. Keep this block LAST: TPM's `run` line must come after
# every @plugin line, and continuum adds its save hook to the status-right set above. Resurrect brings back only a short
# list of programs (vim, less, top ...); a `claude` pane comes back as an empty shell, so run `claude --resume` in it.
# Continuum skips its autosave while another tmux server is running, so check autosave from a clean start.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect#v4.0.0'
set -g @plugin 'tmux-plugins/tmux-continuum#v3.1.0'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
run '~/.tmux/plugins/tpm/tpm'
