# Agentic Workflow tmux config, installed to ~/.tmux.conf by `./setup.sh --with-tmux` (scripts/install-tmux.sh).
# Colors are ANSI names (magenta, brightmagenta, brightblack, yellow), never 256-color numbers, so the bar follows the
# terminal's own theme (Warp, iTerm, GNOME Terminal ...). Edit this file in the toolkit, not ~/.tmux.conf: a re-run of
# setup with --with-tmux backs up a changed ~/.tmux.conf to ~/.tmux.conf.aw-bak before it writes this one.

# --- Basics ---
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
setw -g mode-keys vi

# Panes and windows open in the current pane's folder.
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- Status bar ---
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=white"

# Left: the session name in a magenta chip that turns yellow while the prefix key is held.
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[bg=yellow#,fg=black#,bold],#[bg=magenta#,fg=black#,bold]} #S #[default] "

# Windows: index and name; Z marks a zoomed pane, - the last window. The current window is the bright chip.
setw -g window-status-separator ""
setw -g window-status-format "#[fg=brightblack] #I:#W#{?window_zoomed_flag, Z,}#{?window_last_flag, -,} "
setw -g window-status-current-format "#[bg=brightmagenta,fg=black,bold] #I:#W#{?window_zoomed_flag, Z,} #[default]"
setw -g window-status-activity-style "fg=yellow"

# Right: the active pane's git branch (empty outside a repo), its full folder with ~ for home, the host. No clock.
set -g status-right-length 160
set -g status-right "#[fg=magenta]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null) #[fg=white]#{s|^$HOME|~|:pane_current_path} #[fg=brightblack]| #[fg=brightmagenta]#h "

# --- Borders and messages ---
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=magenta"
set -g message-style "bg=magenta,fg=black"
setw -g mode-style "bg=brightmagenta,fg=black"
