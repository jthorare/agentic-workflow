# context/onyx.lock — the pins for Sindri-managed Onyx (spec docs/superpowers/specs/2026-10-16-sindri-onyx-managed-design.md §6).
# Checked by scripts/onyx-lock.sh check (CI) and embedded into the Sindri build (Aw.Sindri.Infrastructure, onyx.lock).
# Rows (format documented in scripts/onyx-lock.sh):
#   version <tag> <commit>                          the Onyx release and the commit its tag points to
#   file <path under deployment/> <sha256>          deployment files Sindri fetches from raw.githubusercontent.com at <commit>
#   image <repository> <tag> <platform> <digest>   every image the v4.9.0 compose names, by manifest digest per platform
#   need disk-bytes | docker-memory-bytes <n>       what preflight requires
# Measured 2026-10-16 on v4.9.0 without pulling anything:
#   commit   gh api repos/onyx-dot-app/onyx/git/ref/tags/v4.9.0 (a lightweight tag: the object is the commit)
#   files    sha256 of docker_compose/docker-compose.yml, docker_compose/env.template and every file of data/nginx/ (the
#            compose mounts ../data/nginx), downloaded at the commit
#   images   `docker buildx imagetools inspect <repo>:<tag> --raw`, the linux/arm64 and linux/amd64 manifest digests of the
#            index (`scripts/onyx-lock.sh verify` repeats this per row, from the recorded tag). Tags: onyx-* at v4.9.0, postgres 15.2-alpine, opensearch 3.6.0, nginx 1.25.5-alpine, redis 7.4-alpine,
#            minio RELEASE.2025-07-23T15-54-02Z-cpuv1 (the s3-filestore profile), code-interpreter 0.4.8
#   need disk-bytes
#            2712988889 (config + layers sizes, compressed, of the nine linux/arm64 manifests) x 2.5 for uncompressed
#            layers and volumes = 6782472222, + 10 GiB (10737418240) for models and data = 17519890462. A first estimate:
#            P2 re-measures on a real pull and adjusts.
#   need docker-memory-bytes
#            5905580032 = 5.5 GiB: the floor for `docker info` MemTotal. The one-user sizing of docs/sindri/onyx.md is a
#            6 GiB Docker VM, and Docker Desktop reports MemTotal a few percent under the limit the user sets, so a 6 GiB
#            VM reads about 5.8 GiB. Preflight compares MemTotal with this floor and tells the user the floor rounded up to
#            a whole GiB (6 GiB) as the setting.

