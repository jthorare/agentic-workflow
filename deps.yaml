# deps.yaml — the declared package graph (spec §4b.1a, §4e B10). The merge gate (and CI once the CI
# workflow lands) fails on any drift from it.
#
# Check:   node scripts/check-deps.mjs            (add --mermaid [--base-file F] for the PR graph)
# Schema:  schemas/deps.schema.json
#
# packages  Each node: a C# package (kind: package, with a tier), the bash hooks and statusline (kind: shell)
#           or the Claude Code mod (kind: mod). `ts` is where the code lives today, `src` where the C#
#           package lands after its port. `scan` lists the source the checker reads for cli/db/file edges.
#           `bins`, `binPaths`, `db`, `files` and `namespace` are what other nodes need an edge to use:
#           db, files and namespace are relative to the state root (${AW_STATE_DIR:-~/.agentic-workflow}),
#           and `namespace` owns every path under that directory, listed or not. `routes` lists the HTTP
#           route prefixes a package serves (e.g. /sindri/). Shell and mod nodes own nothing: they only
#           consume.
# edges     kind: project (a C# ProjectReference), cli (runs the other's binary), db (opens the other's
#           SQLite file, read-only), file (shared state files), http (calls the other's HTTP API, which
#           it declares as `routes`) or compose (a Host references a lower-tier
#           package's Features and Infrastructure projects to call their public Add…() registration methods
#           and nothing else: DEPS-COMPOSE-001 here, ARCH-COMPOSE-001 in tests/Aw.Architecture.Tests; context
#           spec §4). A compose edge sits beside a project edge to the same package: the Host and Features
#           reach the target's Core through that project edge. status: current edges exist in the source today;
#           planned edges are allowed but not built yet. Both directions are checked: a current edge
#           the scan can't find, and a planned edge it does find, both fail. Adding an edge is a reviewed
#           change to this file.
# rules     Nothing depends on a shell or mod node. Project and compose edges point strictly down the
#           tiers (a compose edge never into tier 0, which has no Features or Infrastructure); `sublevel`
#           orders the kernel family inside tier 0 and is allowed on tier 0 only. db and file edges point
#           down or across, never up; cli and http edges may point anywhere (a contract, §4b.1a). No cycles across
#           any kind, unless a DEPS-CYCLE-001 exception excuses the one cli or http edge that closes it. Fan-out (§4b.1a): once C# projects exist, each project may reference at most
#           limits.projectFanOut in-repo projects and limits.thirdPartyFanOut third-party packages (analyzers
#           excluded; *.Host and *.Tests exempt). There is no cap on the packages one package declares project
#           edges to (the owner removed DEPS-FANOUT-001, 2026-10-12). Only the fan-out rules and the cycle rule
#           take exceptions, each with a reason, at most limits.exceptionMaxDays long, and an exception that
#           suppresses nothing fails. A DEPS-CYCLE-001 exception names the edge it excuses (`excuses:` from, to,
#           kind cli or http; from is its subject) and covers the one cycle that goes away without that edge:
#           DEPS-EXC-005 when the edge isn't declared or doesn't leave the subject, DEPS-EXC-002 when it closes
#           no cycle or more than one.
# C# names  A project belongs to the package whose projectPrefix starts its name (longest wins), e.g.
#           src/Judge/Aw.Judge.Core and tests/Aw.Judge.Tests both belong to Judge. Another package is
#           reached only through its Core project (Aw.<Pkg>.Core) or a tier-0 package's library projects
#           (never a Host, Infrastructure, Features or App); anything else fails DEPS-PROJ-007 (§4b.1a
#           "only through their Core contracts"). A Core reference sits in Features (App in the small shape)
#           or Host: Core and Infrastructure use tier-0 packages only (DEPS-PROJ-008, §4b.1). The one
#           carve-out: a *.Host project may reference a compose target's Features and Infrastructure
#           projects (without the compose edge that is DEPS-COMPOSE-001). Those references make the compose
#           edge current; the project edge beside it is current only through a Core reference. Which tier-0
#           package Core and Features may use (Aw.Kernel only, not Aw.Kernel.Data, Telemetry or Redaction)
#           is ARCH-DIR-005 in tests/Aw.Architecture.Tests.
#           Test code is every project under tests/, plus any project named *.Tests or *.Testing (also
#           with a further suffix, such as *.Tests.Integration). Names with a .Testing segment are
#           test-support (a package's fakes, builders, contract bases; KernelTesting is the shared one,
#           tests/Aw.Kernel.Testing); the rest are leaves. Test code
#           follows its owner: it may reference its own package, test-support packages (test: true, such
#           as Aw.Kernel.Testing), analyzers (normally, to test them) and what its owner has a project edge
#           to, needs no edge of its own, and is exempt from fan-out. Nothing references a leaf; only test
#           code references test-support. Test assemblies no package owns (Aw.Architecture.Tests; the
#           Aw.LaneCap.Testing CI tool) may reference every package. Analyzer packages (analyzer: true, Aw.Analyzers) are referenced from
#           production code only with OutputItemType="Analyzer" (in a .csproj or a Directory.Build file);
#           they need no edge and don't count as fan-out. Any other ProjectReference in a Directory.Build
#           file fails.
# scan      A heuristic, not a proof. It reads *.ts/*.js and *.sh under `scan` (not tests, node_modules or
#           dist) and finds: spawn/exec*(…"bin…" calls, also wrapped over lines; `?? "bin"` and `|| "bin"`
#           fallbacks; *Bin = "bin" and *Bin("bin"); BIN_BIN env names; shell commands after VAR=, env,
#           sudo, xargs, nohup, exec, !, $( and backquotes, by name, path suffix, "$BIN_BIN" or
#           ${VAR:-bin}. TS comments are blanked and string, template and regex interiors are skipped for
#           calls; a template literal or block comment left open at the end of a file is a tool error
#           (exit 2), so a lexing mistake can't hide the rest of the file. It can't see a binary named only
#           through a variable it doesn't recognise, indirection such as `npx <bin>`, or calls in JSON and
#           plist config (config/settings.json hook commands, launchd jobs). Shell commands starting with
#           echo, printf or log (separators inside quotes don't start a new command) and heredoc bodies
#           are skipped. C# projects (production only, owned by the longest projectPrefix, so a client inside
#           the server's src directory is told apart): an http edge is a string literal ("…", $"…", @"…",
#           """…""") whose text starts with another package's route prefix; a file or db edge is one .cs file
#           holding another package's files/db path in one literal ("sindri-app/control.json") or every segment
#           as literals ("sindri-app", "control.json"). Whole-line // comments are skipped (/* */ blocks are not).
#           Not seen: a route after a base ($"{url}/sindri/x", an absolute
#           URL), a path under another package's `namespace` that isn't in its files or db (namespace
#           names double as log and label strings in C#, so the C# scan doesn't match them), paths from
#           computed pieces, cli edges (a C# Process start is not scanned), and http calls from
#           TypeScript or shell (only C# is scanned for routes; a current http edge from a shell or
#           mod node is therefore never stale: check-deps prints "not scanned" for it instead).
#
# YAML subset (parsed without a library, so the check needs no install step): block mappings and
# sequences, plain, 'single' or "double" quoted scalars, [flow, lists] of scalars, and # comments.
# Anchors, aliases, tags, block scalars (| >), flow mappings ({}), multiple documents, tab indentation,
# duplicate keys and non-JSON escapes are rejected (DEPS-YAML-001). Quote a scalar that contains ": " or " #".

version: 1

limits:
  projectFanOut: 4
  thirdPartyFanOut: 6
  exceptionMaxDays: 183

packages:
  # ---- tier 0: domain-free building blocks (the BCL plus one external package each) ----
  # sublevel orders the kernel family inside tier 0: §4b.1 has Data, Telemetry and Testing reference
  # Aw.Kernel, and Telemetry carries the scrubbing processor from Redaction, so tier 0 stays acyclic.
  - id: Kernel
    kind: package
    tier: 0
    projectPrefix: Aw.Kernel
    ts: null
    src: src/Aw.Kernel
    note: "Result<T>, Error, IService<,> and decorators, clock and id ports, envelope and outbox contracts, source-generated JSON settings (§4b.1)"
  - id: Redaction
    kind: package
    tier: 0
    projectPrefix: Aw.Redaction
    ts: null
    src: src/Redaction
    note: "the scrubbing patterns copied between judge and sindri today, merged into one package; tier 0 per §4e B10"
  - id: Analyzers
    kind: package
    tier: 0
    analyzer: true
    projectPrefix: Aw.Analyzers
    ts: null
    src: src/Aw.Analyzers
    note: "repo-specific Roslyn rules (§4b.6); build-time only, wired with OutputItemType=Analyzer, never a runtime reference"
  - id: KernelData
    kind: package
    tier: 0
    sublevel: 1
    projectPrefix: Aw.Kernel.Data
    ts: null
    src: src/Aw.Kernel.Data
    note: "SQLite access and the migrations runner (Microsoft.Data.Sqlite)"
  - id: KernelTelemetry
    kind: package
    tier: 0
    sublevel: 1
    projectPrefix: Aw.Kernel.Telemetry
    ts: null
    src: src/Aw.Kernel.Telemetry
    note: "logging and OpenTelemetry setup with the scrubbing processor (§4d runtime hardening)"
  - id: KernelTesting
    kind: package
    tier: 0
    sublevel: 2
    test: true
    projectPrefix: Aw.Kernel.Testing
    ts: null
    src: tests/Aw.Kernel.Testing
    note: "fakes base, builders, contract-test bases and the Kernel ports' in-memory fakes, golden files, the CTRF lane cap (LaneCap); lives under tests/ next to every package's Aw.<Pkg>.Testing, and only test code references it"

  # ---- tier 1 ----
  - id: Judge
    kind: package
    tier: 1
    projectPrefix: Aw.Judge
    ts: judge
    src: src/Judge
    scan: [judge/src]
    bins: [judge]
    db: [judge/decisions.sqlite]
    files: [judge/outbox, judge/sessions]
    namespace: judge
    note: "decisions, health, briefs and the prompt sorter; called by hooks and tier-2 packages through its CLI"
  # Packets and Readiness are standalone (§10 R1b, §4c): they depend on tier 0 only and Sindri (tier 3)
  # consumes both. Tier 1 rather than tier 0, because they carry domain (packet schema, readiness criteria)
  # and tier 0 stays domain-free.
  - id: Packets
    kind: package
    tier: 1
    projectPrefix: Aw.Packets
    ts: null
    src: src/Packets
    bins: [aw-packets]
    namespace: packets
    note: "packet schema, validate, freeze (§4c); a standalone NativeAOT CLI before the switch, writing only under packets/"
  - id: Readiness
    kind: package
    tier: 1
    projectPrefix: Aw.Readiness
    ts: null
    src: src/Readiness
    bins: [aw-readiness]
    namespace: readiness
    note: "the readiness check of record (decision R4, §8); a standalone NativeAOT CLI before the switch, writing only under readiness/ (§4c)"
  # Context: the Sindri context retrieval engine (docs/superpowers/specs/2026-10-10-sindri-context-retrieval-design.md
  # §4). Separable, no Sindri imports; Sindri reaches it through the IContextEngine facade in Aw.Context.Core and
  # composes it with a compose edge. Its state lives in Sindri's app home ($AW_SINDRI_HOME/context/), passed in by Sindri.
  - id: Context
    kind: package
    tier: 1
    projectPrefix: Aw.Context
    ts: null
    src: src/Context
    note: "context retrieval engine: product graph, source adapters, query planner (context spec §4); the package lands in stage S-1A"

  # ---- tier 2 ----
  - id: Scorer
    kind: package
    tier: 2
    projectPrefix: Aw.Scorer
    ts: scorer
    src: src/Scorer
    scan: [scorer/src]
    bins: [scorer]
    files: [scorer/live, context-guard]
    namespace: scorer
    note: "daily cost and involvement report, live session numbers; owns the context-guard fires-log contract it reports on. Not ported as a standalone CLI (addendum §17.29, Q7): it comes back as a block of the Sindri app; the TS package runs until the switch"
  - id: Evidence
    kind: package
    tier: 2
    projectPrefix: Aw.Evidence
    ts: skills/ui-evidence
    src: src/Evidence
    scan: [skills/ui-evidence/src, skills/ui-evidence/scripts]
    binPaths: [ui-evidence/dist/bin.js]
    files: [ui-evidence/runs, locks/heavy-job.lock, locks/qa-stack.lock]
    namespace: ui-evidence
    note: "Playwright UI evidence and the db-run/api-run data evidence (third-party packages in Aw.Evidence.Infrastructure: Playwright for the browser, Npgsql 10.0.3 for a Postgres target, behind the IDatabaseReader port); owns the box-wide heavy-job lock (AW_HEAVY_SLOTS slots, default 2: locks/heavy-job.lock and .2) and the one-slot QA-stack lock. In the C# build they sit behind Evidence's own Core port IMachineLocks, with a directory adapter (atomic mkdir, owner file) that interoperates with config/lib/locks.sh and the heavy wrapper. A tier-0 or tier-1 package can't take those locks (that would be an upward file edge, DEPS-TIER-002)"
  - id: BugFix
    kind: package
    tier: 2
    projectPrefix: Aw.BugFix
    ts: skills/bugFixOrchestrator
    src: src/BugFix
    scan: [skills/bugFixOrchestrator/src]
    bins: [bugfix-state]
    namespace: bugfix
    note: "bugfix-state CLI for /bugFixOrchestrator; its state lives under the --state directory the skill passes, bugfix/<repo-slug>/<ticket-slug> after the switch (spec §4c)"

  # ---- tier 3 ----
  - id: Sindri
    kind: package
    tier: 3
    projectPrefix: Aw.Sindri
    ts: sindri
    src: src/Sindri
    scan: [sindri/src]
    bins: [sindri]
    db: [sindri/ledger.db, sindri-app/ledger.db, sindri-app/views.db]
    files: [sindri-app/control.json, sindri-app/auth/human.token, fleet]
    namespace: sindri
    routes: [/sindri/]
    note: "built new in C# as an application (control plane, workflow engine, context retrieval; addendum §17.29, Q7), not ported; ts: sindri (profile, ledger, scrub, observe, index, scope, evolve) is the reference and runs until the switch; S1 (app shell: CLI and control plane, host lease, ledger, profile, API, scheduler, doctor) and workflow engine P1 (the recipe model and validator, `sindri recipe validate`) are in src/Sindri; API P2 adds the projector and its views (views.db: services, profile; read-your-writes, health, `sindri views rebuild`); API P3 adds items and the queue (views.db: items, item-aliases, item-timeline; `sindri queue`, `items`, `item add`, `item close`); API P5 adds the event stream, the ledger read and the events catalog (`GET /events`, `/ledger`, `/events/catalog`; `sindri ledger`, `status --follow`); API P6: jobs and services (the job runtime, `GET /jobs`, `POST /services/{name}/run|pause|resume`, `view_jobs`, the opt-in job-probe service; `sindri services`, `jobs`); Aw.Sindri.Workflows is the Temporal adapter (Infrastructure layer, namespace Aw.Sindri.Infrastructure.Workflows, AwAotCompatible=false for temporalio/sdk-dotnet#286; engine rev 8 §0); reaches lower tiers only through Core contracts, CLIs and the compose edges to Context and Judge (registration only), plus the tier-0 Redaction edge (RecordEvent's ledger scrub and, in Infrastructure, the desk notices' text); P6 adds effects (EffectActivities: RecordEffect, RecheckEffect, RunEffect with the outbox retry policy, outbox.* rows), the registry wake (TemporalRecipeWake over the RecipeHash search attribute), effect.notify.desk (notifications.jsonl, digest, OS banner) and effect.claim.ref (git update-ref through GitClaimRefs)"

  # ---- tier 4 ----
  - id: SindriUi
    kind: package
    tier: 4
    projectPrefix: Aw.Sindri.Ui
    ts: null
    src: src/Sindri/Aw.Sindri.Ui
    bins: [sindri-ui]
    files: [sindri-app/ui/preferences.json, sindri-app/ui/instance.sock, sindri-app/ui/instance.lock, sindri-app/ui/instance.pid]
    note: "the Avalonia desktop app (readiness spec §4a UI): Aw.Sindri.Ui (views, view models, the typed API client, platform ports) and the thin Aw.Sindri.Ui.Desktop head (NativeAOT, binary sindri-ui). It references no Sindri project and holds no logic: Sindri's HTTP API and two files under AW_SINDRI_HOME, the endpoint record (control.json) and the per-start human token (auth/human.token), are its only contract (docs/csharp/sindri-ui.md). It owns its own files in a ui/ directory (0700) of Sindri's home: the local preferences and the single-instance lock and socket (instance.sock falls back to an owner-only temp directory when its path is too long for sun_path). Bare `sindri` starts sindri-ui: that Sindri -> SindriUi launch is declared as a cli edge (status planned only because check-deps does not scan C# for cli edges) and closes a cycle with the http edge, so it carries a DEPS-CYCLE-001 exception (owner decision 2026-10-12): the launch only spawns a separate process, shares no code or data, and the HTTP API (with control.json and auth/human.token) stays the app's only contract"

  # ---- outside the tiers: code that stays bash or TypeScript and calls the CLIs (§4a) ----
  - id: Hooks
    kind: shell
    ts: config/hooks
    src: null
    scan: [config/hooks]
    note: "safety and context hooks, per-provider adapters"
  - id: Statusline
    kind: shell
    ts: config/statusline.sh
    src: null
    scan: [config/statusline.sh]
    note: "the statusline reads a cache and refreshes it from the judge and scorer CLIs in the background"
  - id: AwLive
    kind: mod
    ts: mods/aw-live
    src: null
    scan: [mods/aw-live/hooks]
    note: "Claude Code mod (stays TypeScript, §4a); calls `scorer live --json`"
  - id: Meta
    kind: package
    tier: 2
    projectPrefix: Aw.Meta
    bins: [aw-meta]
    ts: null
    src: src/Meta
    scan: [scripts/meta-launch.sh, scripts/meta-lane.sh, scripts/launcher-lib.sh]
    note: "aw-meta CLI for the /meta skill: the meta orchestrator's obligations (inbox/outbox), lane map, gate and merge runner, owner queue, health and running log; state under $AW_STATE_DIR/meta; a thin harness Sindri absorbs later"

  - id: Launcher
    kind: package
    tier: 1
    projectPrefix: Aw.Launcher
    ts: null
    src: null
    files: [launcher.json]
    note: "the session launcher's machine file and its contract (spec 2026-10-15-sindri-session-launcher-design.md, SL-0): $AW_STATE_DIR/launcher.json is read by aw-meta-launch (bash, SL-1) and by the C# Sindri launcher (SL-2). The repo-side contract files are schemas/launcher.schema.json, config/launcher/builtins.json and config/launcher/terminals.json (shared fixtures: tests/fixtures/launcher); no C# code of its own, so no projects. The bash reader lives with its only user, Meta (scripts/launcher-lib.sh), and is declared by the Meta -> Launcher file edge"
  - id: Forge
    kind: package
    tier: 1
    projectPrefix: Aw.Forge
    ts: null
    src: src/Forge
    note: "the forge port (IForge): GitHub and file-backed adapters, a fake and its contract tests"
  - id: CodeIndex
    kind: package
    tier: 1
    projectPrefix: Aw.CodeIndex
    ts: null
    src: src/CodeIndex
    note: "code index: symbols, callers and callees per repo, built in the background when trunk moves (code-index spec)"

edges:
  # ---- current: found in the source today ----
  - from: Scorer
    to: Judge
    kind: db
    status: current
    note: "scorer reads judge's decisions.sqlite (run.ts, live.ts). Read-only; should become a judge CLI or a published view"
  - from: Scorer
    to: Judge
    kind: file
    status: current
    note: "scorer counts queued wakes in judge/outbox"
  - from: Scorer
    to: Evidence
    kind: file
    status: current
    note: "scorer reads ui-evidence run files (§4e B10)"
  - from: Evidence
    to: Judge
    kind: cli
    status: current
    note: "ui-evidence asks judge for selector repair and visual critique"
  - from: BugFix
    to: Judge
    kind: cli
    status: current
    note: "bugfix-state runs judge resolution-check and judge why"
  - from: BugFix
    to: Evidence
    kind: cli
    status: current
    note: "bugfix-state runs the sibling ui-evidence entry point (same tier, through its CLI contract)"
  - from: Hooks
    to: Meta
    kind: cli
    status: current
    note: "the meta Stop gate runs aw-meta stop-check and the SendMessage outbox hook runs aw-meta outbox-record (docs/csharp/meta.md)"
  - from: Sindri
    to: Evidence
    kind: file
    status: current
    note: "sindri index builds take a slot of the box-wide heavy-job lock (the same lock directory Evidence's IMachineLocks adapter takes)"
  - from: Hooks
    to: Judge
    kind: cli
    status: current
    note: "done-gate, subagent-start-map, judge-health, prompt-sort, send-gate and scope-gate call judge"
  - from: Hooks
    to: Judge
    kind: file
    status: current
    note: "external-write-guard, done-gate and turn-origin read judge/sessions; outbox-flush and send-gate use judge/outbox; send-gate, record-teammate-name and subagent-start-map keep judge/teammate-names.jsonl, hook-only state inside judge's namespace that moves with judge's port"
  - from: Hooks
    to: Scorer
    kind: file
    status: current
    note: "the context-guard hook writes the fires log scorer reports on (context-guard/); nothing depends on a shell node, so the contract sits with scorer"
  - from: Hooks
    to: Sindri
    kind: cli
    status: current
    note: "sindri-nudge runs sindri at SessionStart"
  - from: Hooks
    to: Sindri
    kind: file
    status: current
    note: "the aw:fleet hook (config/hooks/fleet-state.sh, session collector CO-1) writes one state file per session under $AW_FLEET_DIR (default $AW_STATE_DIR/fleet), which Sindri's collector reads and prunes (spec 2026-10-16-sindri-session-collector-design.md §5). ~/.claude/sessions and the provider folders are outside the state root, so not edges"
  - from: Statusline
    to: Judge
    kind: cli
    status: current
    note: "judge health for the statusline segment"
  - from: Statusline
    to: Scorer
    kind: cli
    status: current
    note: "scorer live refreshes the statusline cache"
  - from: Statusline
    to: Scorer
    kind: file
    status: current
    note: "the statusline reads scorer/live snapshots and writes its own cache there (scorer/live/<sid>.statusline.json)"
  - from: AwLive
    to: Scorer
    kind: cli
    status: current
    note: "the /live pane runs scorer live --json"

  - from: KernelData
    to: Kernel
    kind: project
    status: current
    note: "kernel family"
  - from: KernelTesting
    to: Kernel
    kind: project
    status: current
    note: "fakes and builders"
  - from: KernelTelemetry
    to: Kernel
    kind: project
    status: current
    note: "kernel family"
  - from: KernelTelemetry
    to: Redaction
    kind: project
    status: current
    note: "the scrubbing processor on logs and OTel exports"
  # ---- planned: the C# project references the ports create (§4b.1, §4b.1a) ----
  - from: KernelTesting
    to: KernelData
    kind: project
    status: planned
    note: "contract-test bases run against SQLite"
  - from: Judge
    to: Kernel
    kind: project
    status: current
    note: "Result, IService, ports"
  - from: Judge
    to: KernelData
    kind: project
    status: current
    note: "decisions.sqlite"
  - from: Judge
    to: KernelTelemetry
    kind: project
    status: current
    note: "logging"
  - from: Judge
    to: Redaction
    kind: project
    status: current
    note: "replaces judge's copy of the scrubbing patterns"
  - from: Packets
    to: Kernel
    kind: project
    status: current
    note: "Result, JSON"
  - from: Packets
    to: KernelTelemetry
    kind: project
    status: current
    note: "the aw-packets host starts Kernel telemetry in Compose (§4b.4)"
  - from: Readiness
    to: Kernel
    kind: project
    status: current
    note: "Result, JSON"
  - from: Readiness
    to: KernelTelemetry
    kind: project
    status: current
    note: "the aw-readiness host starts Kernel telemetry in Compose (§4b.4)"
  # Context's tier-0 edges (context spec §4: Aw.Kernel, Aw.Kernel.Data, Redaction), current since stage S-1A.
  - from: Context
    to: Kernel
    kind: project
    status: current
    note: "Result, AwJson, IService; Aw.Context.Testing reads the fixture's history and probes through AwJson"
  - from: Context
    to: KernelData
    kind: project
    status: current
    note: "context.db: migrations, connections and sessions (Aw.Context.Infrastructure only; S-1A repo docs, S-3a graph store)"
  - from: Context
    to: Redaction
    kind: project
    status: current
    note: "the ingest and egress scrubbers (Aw.Context.Infrastructure only; context spec D14)"
  - from: Scorer
    to: Kernel
    kind: project
    status: planned
    note: "Result, IService, ports"
  - from: Scorer
    to: KernelData
    kind: project
    status: planned
    note: "scorer's own SQLite file"
  - from: Scorer
    to: KernelTelemetry
    kind: project
    status: planned
    note: "logging"
  - from: Evidence
    to: Kernel
    kind: project
    status: current
    note: "Result, IService, ports"
  - from: Evidence
    to: KernelTelemetry
    kind: project
    status: current
    note: "logging"
  - from: Evidence
    to: Redaction
    kind: project
    status: current
    note: "api-run summaries (bodies, stdout, expected and actual values, the whole document) are scrubbed before they are written (RedactionScrubber behind ITextScrubber; spec DT-E1, section 5.2 Secrets)"
  - from: Evidence
    to: KernelData
